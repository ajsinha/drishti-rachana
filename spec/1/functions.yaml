  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  description: "Calendar days from a to b (negative when b is before a)."
  deprecated_spellings:
  - {name: "days", note: "`days` gives empty, not an error, for a non-date; it reads the first ten characters of the text"}
  examples:
  - {expr: "days_between('2026-11-01', '2026-11-17')", result: 16}
  since: "1.0"
- name: edate
