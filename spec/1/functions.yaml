  - {name: "start", type: "integer"}
  - {name: "end", type: "integer"}
  - {name: "type", type: "integer"}
  returns: "number"
  nulls: {empty: "an empty argument, or a list with an empty element, gives empty (a missing flow is never skipped)", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number, or a list longer than 100,000 values"}
  - {code: "RCH-2102", when: "the periods are not within 1 to nper, start first"}
  tolerance: 1.0e-09
  description: "The interest paid from period start to end. Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
  - {expr: "cumipmt(0.01, 12, 1000, 1, 1, 0)", result: -10}
  since: "1.0"
- name: cumprinc
  family: finance
  signature: "cumprinc(rate, nper, pv, start, end, type)"
  eval: eager
  params:
  - {name: "rate", type: "number"}
  - {name: "nper", type: "number"}
