rachana: 1.2
fragment: curve-overview
version: 1
doc:
  summary: A curve as a line and, under it, its pillars as a table.
  description: >-
    The term-structure line and the curve-table over the same rows, in one fragment. Use the two fragments on their
    own when you want to place them apart.
  category: market-data
  tags: [curve, overview, rates]
  use-when:
    - One curve is shown as a line with its pillars as a table underneath.
  avoid-when:
    - "The line and the table are placed apart: use finance/term-structure and finance/curve-table."
  data:
    table: rows
    in-words: "One row per pillar: tenor and zero rate, optionally instrument, quote and discount factor."
    sample-row: { tenor: "2Y", zero: 0.0412, instrument: SOFR swap, quote: 0.0415, df: 0.9598 }
  example: { use: finance/curve-overview@1, with: { rows: { from: "$.pts", columns: { tenor: PILLAR, zero: ZERO_RATE } } } }
  see-also: [finance/term-structure, finance/curve-table]
  keywords: [curve, zero rate, pillars, yield curve, discount]
params:
  rows:
    type: table
    required: true
    doc: One row per pillar
    columns:
      tenor:      { type: text,   doc: The pillar's tenor }
      zero:       { type: number, doc: The zero rate }
      instrument: { type: text,   optional: true, doc: The instrument that fixes the pillar }
      quote:      { type: number, optional: true, doc: The market quote }
      df:         { type: number, optional: true, doc: The discount factor }
  title:    { type: text, default: Curve, doc: The panel's title }
  zero-fmt: { type: format, default: pct4, doc: How rates are written }
emits:
  - { name: select, payload: { tenor: text }, doc: A pillar was chosen }
panels:
  - id: line
    kind: line
    title: arg.title
    rows: arg.rows
    x: tenor
    y: zero
    fmt: "%{zero-fmt}"
  - id: pillars
    kind: table
    title: Pillars
    rows: arg.rows
    search: false
    columns:
      - { label: Tenor, bind: "@.tenor" }
      - { label: Instrument, bind: "@.instrument" }
      - { label: Quote, bind: "@.quote", fmt: "%{zero-fmt}" }
      - { label: Zero, bind: "@.zero", fmt: "%{zero-fmt}" }
      - { label: Discount factor, bind: "@.df", fmt: text }
    emits: [ { name: select, on: row-click, payload: { tenor: "@.tenor" } } ]
