[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "drishti-rachana"
version = "0.11.0.dev0"
description = "Drishti Rachana for Python: Data Protocol host (JSON, Arrow, NDJSON, live changes), conformance runner, Flask and FastAPI adapters serving <rachana-view>."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
dependencies = []          # the core types use the standard library only

[project.optional-dependencies]
conformance = ["pyyaml>=6", "jsonschema>=4"]   # the runner reads YAML case files
flask = ["flask>=3"]
fastapi = ["fastapi>=0.110"]
arrow = ["pyarrow>=15"]
polars = ["polars>=1"]
v8 = ["mini-racer>=0.14.1"]           # drishti_rachana.engine: the JavaScript bundle on V8 (W-1)
test = ["httpx>=0.27", "pytest>=8", "pyyaml>=6", "jsonschema>=4", "pyarrow>=15"]

[project.scripts]
rachana = "drishti_rachana.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drishti_rachana"]
artifacts = ["src/drishti_rachana/bundle/*.js"]   # built by tools/js/build_js.py, git-ignored

# The assets <rachana-view> loads, served by the adapters under their mount (drishti_rachana.assets): copied into the wheel as package data.
[tool.hatch.build.targets.wheel.force-include]
"../js/packages/rachana/src" = "drishti_rachana/web/rachana/src"
"../js/vendor/drishti-elements/3.2.0-dev+f8b8619" = "drishti_rachana/web/vendor/drishti-elements/3.2.0-dev+f8b8619"
"../js/vendor/apache-arrow/21.1.0" = "drishti_rachana/web/vendor/apache-arrow/21.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
