# The Drishti profile's number-format names, as the conformance run loads them with --jvm and --node (copied from Drishti i7a's
# core pack, formats.yaml; format names only, no data). Replace the copy when the profile's names change.
# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Number formats the banking packs share.
formats:
  pct4:
    type: number
    decimals: 4
    scale: 100
    suffix: '%'
  rate5:
    type: number
    decimals: 5
    grouping: false
  pips1:
    type: number
    decimals: 1
    sign: always
  df4:
    type: number
    decimals: 4
  bp1:
    type: number
    decimals: 1
    sign: always
    suffix: ' bp'
  price4:
    type: number
    decimals: 4
