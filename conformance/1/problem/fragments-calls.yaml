  - id: function-parameter-needs-a-lambda
    kind: problem
    source: LIBRARIES 4.2 (fn); EL_EXPANSION X13 (RCH-2116)
    files: &scored
      scored.v1.fragment.yaml: |
        rachana: 1.2
        fragment: scored
        version: 1
        doc:
          summary: The amounts scored as the caller says.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              amount: { type: number, doc: The amount }
          score: { type: "fn(number) -> number", required: true, doc: The score of an amount }
        panels:
          - { id: total, kind: metric, label: Scored, value: "sum(map(arg.rows, arg.score(@.amount)))" }
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { MTM_USD: 1200 } ] }
      panels:
        - use: scored@1
          with: { rows: { from: $.positions, columns: { amount: MTM_USD } }, score: 1000 }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "parameter score of fragment scored is a function (fn(number) -> number): write lambda x: ..., not '1000'"
        range: { start: { line: 10, column: 79 } }

  - id: function-parameter-arity
    kind: problem
    source: LIBRARIES 4.2 (fn); EL_EXPANSION X13 (RCH-2116)
    files: *scored
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { MTM_USD: 1200 } ] }
      panels:
        - use: scored@1
          with: { rows: { from: $.positions, columns: { amount: MTM_USD } }, score: "lambda a, b: a + b" }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "parameter score of fragment scored is a function of 1 name (fn(number) -> number); this lambda has 2"
        range: { start: { line: 10, column: 79 } }

  - id: function-parameter-reads-no-row
    kind: problem
    source: L-21 (4); EL_EXPANSION X13 (RCH-2116)
    note: "Inside the fragment @ would be the fragment's row, not the caller's: a function argument reads its names and the caller's screen only."
    files: *scored
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { MTM_USD: 1200, FX: 2 } ] }
      panels:
        - use: scored@1
          with: { rows: { from: $.positions, columns: { amount: MTM_USD } }, score: "lambda x: x * @.FX" }
