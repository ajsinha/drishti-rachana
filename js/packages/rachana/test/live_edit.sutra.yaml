rachana: 1
sutra: live-edit
version: 1
title: { id: "'Editable live table'" }
data:
  trades: { table: trades, key: id, live: true }
panels:
  - id: trades
    kind: live
    title: Trades
    rows: $.trades
    columns:
      - { label: Trade, bind: "@.id" }
      - { label: Book, bind: "@.book" }
      - { label: Quantity, bind: "@.qty" }
      - { label: Status, bind: "@.status" }
      - { label: Version, bind: "@.v" }
    sort: at desc
    top: true
    window: 50
    edit: cells
