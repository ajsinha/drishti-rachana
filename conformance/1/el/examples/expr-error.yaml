suite: el/examples/expr-error
since: "1.0"
profile: core
verified: true
description: Expressions that do not compile, matched by code, message words (SPEC 6.3) and offsets.
cases:
  - id: double-star-is-not-rachana
    kind: expr-error
    source: SPEC 6.3
    expr: "2 ** 3"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "'**' is not Rachana: write power(x, y)", expr: { start: 2 } }

  - id: unterminated-string
    kind: expr-error
    source: SPEC 6.3
    expr: "'abc"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "unterminated string" }

  - id: arity-out-of-range
    kind: expr-error
    source: SPEC 4.10 rule 1, 6.3
    expr: "size($.a, 'b')"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "size takes 1 argument(s), got 2" }

  - id: unknown-function-names-near-matches
    kind: expr-error
    source: SPEC 4.10 rule 1, 6.3
    note: The list of known names after the colon is not pinned here.
    expr: "roundd(1)"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "unknown function 'roundd'" }

  - id: unclosed-template-part-at-template-offset
    kind: expr-error
    source: SPEC 4.11
    template: "Total ${sum($.a)"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "unclosed '${'", expr: { start: 6 } }

  - id: host-lowered-depth-is-named
    kind: expr-error
    source: SPEC 4.12
    given: { limits: { depth: 3 } }
    expr: "((((1))))"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "expression nested deeper than 3 levels" }
