rachana: 1.2
fragment: price-bars
version: 1
doc:
  summary: Open, high, low and close per period as candles, with volume under them.
  description: >-
    One row per period in date order. Volume is optional. For a plain closing-price line with figures beside it use
    finance/price-history.
  category: market-data
  tags: [candles, ohlc, prices]
  use-when:
    - "Prices are read as candles (open, high, low, close) with volume."
  avoid-when:
    - "A plain closing line with figures: use finance/price-history."
  data:
    table: rows
    in-words: "One row per period: date, open, high, low, close and optionally volume."
    sample-row: { date: "2026-11-20", open: 100.4, high: 102.1, low: 99.8, close: 101.25, volume: 1250000 }
  example: { use: finance/price-bars@1, with: { rows: { from: "$.px", columns: { date: DAY, open: OPEN_PX, high: HIGH_PX, low: LOW_PX, close: CLOSE_PX } } } }
  see-also: [finance/price-history, finance/quote-card]
  keywords: [candles, ohlc, price, volume, chart]
params:
  rows:
    type: table
    required: true
    live: ok
    doc: One row per period
    columns:
      date:   { type: date, doc: The period }
      open:   { type: number, doc: The first price }
      high:   { type: number, doc: The highest price }
      low:    { type: number, doc: The lowest price }
      close:  { type: number, doc: The last price }
      volume: { type: number, optional: true, doc: The quantity traded }
  title: { type: text, default: Prices, doc: The panel's title }
  fmt:   { type: format, default: price2, doc: How prices are written }
emits:
  - { name: bar, payload: { date: date }, doc: A bar was chosen }
panels:
  - id: bars
    kind: candlestick
    title: arg.title
    rows: arg.rows
    x: date
    open: open
    high: high
    low: low
    close: close
    volume: volume
    fmt: "%{fmt}"
    emits: [ { name: bar, on: point-click, payload: { date: "@.date" } } ]
