# Synthetic demo content.
rachana: 1.2
sutra: entry-form-example
version: 1
libraries: [core@1]
title: { id: "'New contact'" }
state:
  contact: { type: text, default: none }
panels:
  - use: core/entry-form@1
    as: contact
    with:
      title: New contact
      submit-label: Save
      fields:
        - { id: name, label: Name, required: true }
        - { id: segment, label: Segment, type: enum, options: [ Retail, Wholesale ] }
        - { id: limit, label: Credit limit, type: number }
      rules:
        - { rule: "limit <= 50000", message: "At most 50,000 without approval" }
    on:
      submit:
        - { set: { state: contact, to: event.values.name } }
        - { host: contact.create, with: { contact: event.values } }
      cancel: [ { clear: contact } ]
  - { id: saved, kind: metric, label: Last saved, value: state.contact }
