#
#   reference         the compiler a level's files were first made from (the reference's release for 1.0)
#   comments          the text of the files' $comment, as released with the level (a level's files are written once)
#   schemaText        wording of the schema as released with a level where the compiler's text has changed since: {from, to} pairs applied
#                     to the generated file ("1.0": the reference spelled its codes DRS-nnnn)
#   codes             every problem code a Sutra, a fragment or a library can carry: profile, since (the language level that brought
#                     it) and raisedBy ("package.Class" under com.ash.rachana; the levels-1.0 entries are the reference's, as released).
#                     The exception codes of RachanaCode (SPEC 7) are not Sutra problems and are not listed. ProblemCodesTest fails
#                     when a code literal of the main sources is neither listed nor one of RachanaCode's.
#   profileFunctions  the Drishti profile's functions (SPEC 5.11), which the compiler does not implement: name, family, arity, since
