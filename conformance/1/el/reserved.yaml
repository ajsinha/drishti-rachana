# Written by hand from the 1.0 decisions of 2026-11-19 (EL_EXPANSION XD2 to XD4). Built at language level 1.1 (2026-11-21, the syntax batch): the tokens 1.1 defines
# (|>, ??, ..., {, }, /* */, the digit separator) left this file for el/syntax-1-1; =>, .. and a stray */ stay refused, with the Python spelling as the fix (DECISIONS PY3, PY4).
suite: el/reserved
since: "1.0"
profile: core
verified: true
description: "The 1.0 reservations (SPEC 4.15, reserved.yaml, EL_EXPANSION X1): each reserved token and a sample of reserved Core names refused with its message; what stays allowed."
cases:

  - id: "arrow-is-reserved"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 1"
    note: "X13 lambdas."
    tags: ["reserved"]
    expr: "map($.legs, l => l.x)"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'map($.legs, l => l.x)': '=>' is reserved for a later version of Rachana: write lambda x: ... at 14", "expr": {"start": 14, "end": 16}}]}

  - id: "range-in-an-index-is-reserved"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 1"
    note: "X7; the number stops before '..'."
    tags: ["reserved"]
    expr: "$.a[1..3]"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '$.a[1..3]': '..' is reserved for a later version of Rachana: write range(start, stop) at 5", "expr": {"start": 5, "end": 7}}]}

  - id: "range-between-numbers-is-reserved"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 1"
    note: "X7; '1..5' is 1, '..', 5, never 'bad number'."
    tags: ["reserved"]
    expr: "1..5"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '1..5': '..' is reserved for a later version of Rachana: write range(start, stop) at 1", "expr": {"start": 1, "end": 3}}]}

  - id: "closing-brace-is-reserved"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 1"
    note: "X6."
    tags: ["reserved"]
    expr: "$.a }"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '$.a }': unexpected '}' at 4", "expr": {"start": 4, "end": 5}}]}

  - id: "comment-closer-is-reserved"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 1"
    note: "X14."
    tags: ["reserved"]
    expr: "$.a */ 2"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '$.a */ 2': '*/' closes no comment at 4", "expr": {"start": 4, "end": 6}}]}

  - id: "reserved-name-group-by"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X19; in place of 'unknown function'."
    tags: ["reserved"]
    expr: "group_by($.trades, 'desk')"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'group_by($.trades, 'desk')': 'group_by' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 8}}]}

  - id: "reserved-name-filter"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X17."
    tags: ["reserved"]
    expr: "filter($.legs, @.x > 1)"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'filter($.legs, @.x > 1)': 'filter' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 6}}]}

  - id: "reserved-name-zip"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X17."
    tags: ["reserved"]
    expr: "zip($.a, $.b)"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'zip($.a, $.b)': 'zip' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 3}}]}

  - id: "reserved-name-money"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X5."
    tags: ["reserved"]
    expr: "money(1250.5, 'USD')"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'money(1250.5, 'USD')': 'money' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 5}}]}

  - id: "reserved-name-between"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X15."
    tags: ["reserved"]
    expr: "between($.x, 1, 5)"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'between($.x, 1, 5)': 'between' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 7}}]}

  - id: "reserved-name-of-a-core-library"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.15 rule 2"
    note: "X29, library quant."
    tags: ["reserved"]
    expr: "bs_price(100, 100, 1, 0.05, 0.2)"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression 'bs_price(100, 100, 1, 0.05, 0.2)': 'bs_price' is reserved for a later version of Rachana at 0", "expr": {"start": 0, "end": 8}}]}

  - id: "a-field-named-like-a-reserved-name-is-a-field"
    kind: "expr"
    source: "SPEC 4.15 rule 2"
    tags: ["reserved"]
    given: {"record": {"filter": 3, "rank": 2}}
    expr: "$.filter + $.rank"
    expect: {"value": 5}

  - id: "a-let-name-like-a-reserved-name-is-the-authors"
    kind: "expr"
    source: "SPEC 4.15 rule 4"
    tags: ["reserved"]
    expr: "let(zip = 2, zip + 1)"
    expect: {"value": 3}

  - id: "reserved-tokens-inside-a-text-are-characters"
    kind: "expr"
    source: "SPEC 4.15 rule 1"
    tags: ["reserved"]
    expr: "'{a} ?? |> => .. /* */ 1_000'"
    expect: {"value": "{a} ?? |> => .. /* */ 1_000"}

  - id: "double-bar-is-still-or"
    kind: "expr"
    source: "SPEC 4.15 rule 1"
    tags: ["reserved"]
    given: {"record": {"a": 0, "b": 1}}
    expr: "$.a || $.b"
    expect: {"value": true}

  - id: "type-of-answers-number-for-an-exact-number"
    kind: "expr"
    source: "SPEC 4.15 rule 3"
    tags: ["reserved"]
    expr: "type_of(0.1)"
    expect: {"value": "number"}
