rachana: 1.2
fragment: series-line
version: 1
doc:
  summary: "A line of one series: x along the bottom, y up the side."
  description: Rows in x order. Mark one x value to draw a vertical marker (a date, a threshold).
  category: charts
  tags: [line, series, trend]
  use-when:
    - "One numeric series is read over an ordered x (time, tenor)."
  avoid-when:
    - "Several series add up to a whole: use core/area-stack."
    - "The series is a curve by tenor: use finance/term-structure."
  data:
    table: rows
    in-words: One row per x in order with a numeric y.
    sample-row: { x: "2026-11-20", "y": 0.84 }
  example: { use: core/series-line@1, with: { title: Price, rows: { from: "$.history", columns: { x: PX_DATE, "y": CLOSE } }, fmt: price2, mark: "2026-01-06" } }
  see-also: [core/area-stack, finance/term-structure, finance/pnl-history]
  keywords: [line, trend, time series, over time, chart]
params:
  rows:
    type: table
    required: true
    doc: One row per point, in x order
    live: ok
    columns:
      x: { doc: "The position along the bottom: a date, a number or a label" }
      y: { type: number, doc: The value up the side }
  title: { type: text, default: Series, doc: The panel's title }
  fmt:   { type: format, default: amount2, doc: How the values are written }
  unit:  { type: text, default: "", doc: "The unit, written beside the values" }
  step:  { type: boolean, default: false, doc: Whether the line steps between points instead of joining them }
  mark:  { type: text, optional: true, doc: An x value to mark }
panels:
  - id: line
    kind: line
    title: arg.title
    rows: arg.rows
    x: x
    y: y
    fmt: "%{fmt}"
    unit: arg.unit
    step: arg.step
    mark: "coalesce(arg.mark, '')"
