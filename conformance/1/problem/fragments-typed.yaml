suite: problem/fragments-typed
since: "1.2"
profile: core
verified: true
description: "Typed fragments (C1) and libraries (X42): the problems at a use and when a library loads; level 1.2."
cases:

  - id: typed-unknown-parameter
    kind: problem
    source: LIBRARIES 7.2 (RCH-2114)
    files:
      key-figure.v1.fragment.yaml: |
        rachana: 1
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: { type: number, default: 0, min: 0, doc: Below this the caption says so }
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
    sutra: |
      rachana: 1
      sutra: lib-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - { use: key-figure@1, with: { value: 1, colour: red } }
    expect:
      ok: false
      problems:
      - code: RCH-2114
        severity: error
        message: fragment key-figure has no parameter 'colour' (it has value, label, fmt, id, floor)
        range:
          start:
            line: 7
            column: 52

