suite: live/overlay
since: "1.0"
profile: core
verified: true
description: "A paged live table's pages (LIVE_TABLES 1.3, 1.5, 7): the snapshot stays in the source; a changed row shadows the source's, a removed key hides it, a new row takes its place in the order; totals; a new source version reads the index again; an order by a column the source does not keep; the whole sort list; keyset paging; the query tier. Run with protocol_check.py --live (PROTOCOL 15)."
cases:
  - id: a-changed-row-shadows-the-sources-and-moves-in-the-order
    kind: protocol
    source: "LIVE_TABLES 1.3 (a changed row shadows the source's)"
    fixture: &paged
      name: orders
      tier: columns
      declaration: &decl |
        rachana: 1
        live-table: orders
        snapshot: orders
        stream: orders.live
        key: id
        version: v
        columns: [ { name: id }, { name: v, type: integer }, { name: book }, { name: qty, type: integer } ]
      rows: &rows
        - { id: a, v: 1, book: A, qty: 1 }
        - { id: b, v: 1, book: B, qty: 2 }
        - { id: c, v: 1, book: A, qty: 3 }
        - { id: d, v: 1, book: B, qty: 4 }
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id, qty], sort: [ { col: qty, dir: desc } ] } }
        expect: { status: 200, body: { values: [ [d, 4], [c, 3], [b, 2], [a, 1] ], total: 4 } }
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: a, v: 2, book: A, qty: 9 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id, qty], sort: [ { col: qty, dir: desc } ] } }
        expect: { status: 200, body: { values: [ [a, 9], [d, 4], [c, 3], [b, 2] ], total: 4 } }

  - id: a-removed-key-hides-the-sources-row
    kind: protocol
    source: "LIVE_TABLES 1.3 (a removed key hides it; totals with the same corrections)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200, body: { total: 4 } }
      - request: { method: POST, path: /_test/stream, body: { delete: [ [b] ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200, body: { values: [ [a], [c], [d] ], total: 3 } }

  - id: a-new-row-takes-its-place-in-the-order
    kind: protocol
    source: "LIVE_TABLES 1.3 (a new row takes its place in the order)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: qty } ] } }
        expect: { status: 200, body: { total: 4 } }
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: e, v: 1, book: A, qty: 2 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id, qty], sort: [ { col: qty } ] } }
        expect: { status: 200, body: { values: [ [a, 1], [b, 2], [e, 2], [c, 3], [d, 4] ], total: 5 } }

  - id: a-new-source-version-reads-the-index-again
    kind: protocol
    source: "LIVE_TABLES 1.1, 4 (a new source version drops the indexes; the same version keeps them)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200, body: { total: 4 } }
      - request: { method: POST, path: /_test/stream, body: { source: { put: [ { id: f, v: 1, book: A, qty: 6 } ] } } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200, body: { values: [ [a], [b], [c], [d] ], total: 4 } }
      - request: { method: POST, path: /_test/stream, body: { source: { version: v2 } } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200, body: { values: [ [a], [b], [c], [d], [f] ], total: 5 } }

  - id: the-whole-sort-list-orders-a-page
    kind: protocol
    source: "LIVE_TABLES 1.5, PROTOCOL 6.1 (every sort entry, then the key)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: e, v: 1, book: B, qty: 3 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: book }, { col: qty, dir: desc } ] } }
        expect: { status: 200, body: { values: [ [c], [a], [d], [e], [b] ], total: 5 } }

  - id: absent-values-last-unless-nulls-first
    kind: protocol
    source: "PROTOCOL 6.1 (nulls: first)"
    fixture:
      name: orders
      tier: columns
      declaration: *decl
      rows: [ { id: a, v: 1, book: A, qty: 1 }, { id: b, v: 1, book: A }, { id: c, v: 1, book: A, qty: 0 } ]
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: qty } ] } }
        expect: { status: 200, body: { values: [ [c], [a], [b] ] } }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: qty, nulls: first } ] } }
        expect: { status: 200, body: { values: [ [b], [c], [a] ] } }

  - id: a-cursor-continues-after-its-last-row
    kind: protocol
    source: "LIVE_TABLES 1.5 (keyset paging: a row removed before the cursor neither shifts nor repeats the next page)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ], limit: 2 } }
        expect: { status: 200, body: { values: [ [a], [b] ], total: 4 } }
        capture: { next: /next }
      - request: { method: POST, path: /_test/stream, body: { delete: [ [a] ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ], limit: 2, cursor: "${next}" } }
        expect: { status: 200, body: { values: [ [c], [d] ], total: 3 } }

  - id: an-offset-page-of-the-merged-order
    kind: protocol
    source: "LIVE_TABLES 1.5 (offset counts the merged order)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ] } }
        expect: { status: 200 }
      - request: { method: POST, path: /_test/stream, body: { delete: [ [a] ], upsert: [ { id: bb, v: 1, book: A, qty: 5 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ], offset: 1, limit: 2 } }
        expect: { status: 200, body: { values: [ [bb], [c] ], total: 4 } }

  - id: an-order-by-a-column-the-source-does-not-keep
    kind: protocol
    source: "LIVE_TABLES 1.1 (a column scan cannot give orders as absent: after the live rows that carry it)"
    fixture:
      name: orders
      tier: columns
      sourceColumns: [id, v, book]
      declaration: *decl
      rows: *rows
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: qty } ] } }
        expect: { status: 200 }
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: c, v: 2, book: A, qty: 7 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: qty } ] } }
        expect: { status: 200, body: { values: [ [c], [a], [b], [d] ], total: 4 } }

  - id: the-query-tier-is-shadowed-in-place
    kind: protocol
    source: "LIVE_TABLES 1.1, 4 (a source that pages itself: its rows shadowed and hidden by the live side in place)"
    fixture:
      name: orders
      tier: query
      declaration: *decl
      rows: *rows
    steps:
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: b, v: 2, book: B, qty: 20 } ], delete: [ [c] ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id, qty], sort: [ { col: id } ] } }
        expect: { status: 200, body: { values: [ [a, 1], [b, 20], [d, 4] ] } }

  - id: a-filtered-page-and-its-total
    kind: protocol
    source: "LIVE_TABLES 1.3 (the query's filter on the merged rows; totals with the same corrections)"
    fixture: *paged
    steps:
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], filter: { op: "==", args: [ { col: book }, { lit: A } ] } } }
        expect: { status: 200, body: { values: [ [a], [c] ], total: 2 } }
      - request: { method: POST, path: /_test/stream, body: { upsert: [ { id: b, v: 2, book: A, qty: 2 } ] } }
        expect: { status: 204 }
      - request: { method: POST, path: /tables/orders/query, body: { columns: [id], sort: [ { col: id } ], filter: { op: "==", args: [ { col: book }, { lit: A } ] } } }
        expect: { status: 200, body: { values: [ [a], [b], [c] ], total: 3 } }
