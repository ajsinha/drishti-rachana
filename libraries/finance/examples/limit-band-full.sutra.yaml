rachana: 1
sutra: limit-band-full-example
version: 1
libraries: [finance@1]
title: { id: "'Limit band (full)'" }
data:
  desk: { record: { NET_DELTA_USD: 910000, DELTA_LIMIT_USD: 1000000 } }
panels:
  - use: finance/limit-band@1
    with: { label: Net delta, value: "$.desk.NET_DELTA_USD", lower: "0 - $.desk.DELTA_LIMIT_USD", upper: "$.desk.DELTA_LIMIT_USD", warn-at: 0.85, fmt: compact }
