# Synthetic demo content.
rachana: 1
sutra: price-history-example
version: 1
libraries: [finance@1]
title: { id: "'Price history'" }
data:
  hist:
    rows:
      - { DAY: "2026-01-12", CLOSE_PX: 100.1 }
      - { DAY: "2026-01-13", CLOSE_PX: 99.9 }
      - { DAY: "2026-01-14", CLOSE_PX: 101.8 }
      - { DAY: "2026-01-15", CLOSE_PX: 101.4 }
panels:
  - use: finance/price-history@1
    with:
      rows: { from: $.hist, columns: { date: DAY, close: CLOSE_PX } }
