suite: problem/controls
since: "1.0"
profile: [core, drishti]
verified: true
description: "controls: sections of Sutras, problem codes 2034 to 2039, where, on-select, limit; harvested from ControlsTest."
cases:

  - id: "every-kind-valid"
    kind: "problem"
    source: "ControlsTest#everyKindReadsWithItsFields"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: leg, kind: dropdown, label: Leg, options: \"$.legs[*].id\", default: first, remember: user, required: true }\n  - { id: legs, kind: multi-select, options: [\"L1\", { value: L2, label: Second }], default: all }\n  - { id: sub, kind: cascading, parent: leg, options: \"$.legs[?(@.id == ctl.leg)][*].leg\" }\n  - { id: side, kind: toggle, options: [Pay, Receive], default: Pay }\n  - { id: view, kind: segmented, options: [A, B, C] }\n  - { id: d, kind: date, default: today }\n  - { id: when, kind: date-range, default: next-90d, placement: side }\n  - { id: size, kind: number-range, min: 0, max: \"max($.legs[*].leg)\" }\n  - { id: top, kind: top-n, options: [5, 10], default: 10 }\n  - { id: q, kind: search, placement: header, panel: cf }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": true, "problems": []}

  - id: "no-controls-valid"
    kind: "problem"
    source: "ControlsTest#aSutraWithoutControlsHasNone"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": true, "problems": []}

