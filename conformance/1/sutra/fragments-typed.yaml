suite: sutra/fragments-typed
since: "1.2"
profile: core
verified: true
description: "Typed fragments (C1) and library fragments (X42): a use expands to the panels it stands for; level 1.2."
cases:

  - id: typed-fragment-expands-like-panels-in-place
    kind: sutra
    source: LIBRARIES 4.1, 4.2
    files:
      key-figure.v1.fragment.yaml: |
        rachana: 1.2
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: { type: number, default: 0, min: 0, doc: Below this the caption says so }
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
    sutra: |
      rachana: 1.2
      sutra: lib-demo
      version: 1
      title: { id: "'Demo'" }
      panels:
        - { use: key-figure@1, with: { value: 1250, label: Revenue, id: total } }
    expect:
      at:
        /panels/0/id: total
        /panels/0/data/value/label: Revenue
        /panels/0/data/value/text: 1,250
        /panels/0/data/caption: ok

  - id: typed-fragment-value-parameter-is-an-expression
    kind: sutra
    source: LIBRARIES 4.2 (value class)
    files:
      key-figure.v1.fragment.yaml: |
        rachana: 1.2
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: { type: number, default: 0, min: 0, doc: Below this the caption says so }
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
    given:
      record:
        sales: 700
        costs: 450
    sutra: |
      rachana: 1.2
      sutra: lib-demo
      version: 1
      title: { id: "'Demo'" }
      panels:
        - { use: key-figure@1, with: { value: "$.sales - $.costs", floor: 300 } }
    expect:
      at:
        /panels/0/id: figure

