  - id: "round-up-1"
    kind: "expr"
    source: "functions.yaml#round_up"
    expr: "round_up(2.671, 2)"
    expect: {"value": 2.68, "tolerance": {"abs": 1e-09}}

  - id: "round-up-2"
    kind: "expr"
    source: "functions.yaml#round_up"
    expr: "round_up(0.1 + 0.2, 1)"
    expect: {"value": 0.3, "tolerance": {"abs": 1e-09}}

  - id: "round-down-1"
    kind: "expr"
