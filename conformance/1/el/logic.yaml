  - id: "strategy-x"
    kind: "expr"
    source: "MoreScalarsTest#theNullRuleHolds"
    note: "Rachana's null rule (SPEC 4.6): a missing value is not equal to a text, so null != 'X' is true."
    expr: "$.STRATEGY != 'X'"
    expect: {"value": true, "type": "boolean"}

  - id: "strategy-x-2"
    kind: "expr"
    source: "MoreScalarsTest#theNullRuleHolds"
    expr: "$.STRATEGY == 'X'"
    expect: {"value": false, "type": "boolean"}

  - id: "year-nope-2026"
    kind: "expr"
    source: "MoreScalarsTest#theNullRuleHolds"
    expr: "year($.NOPE) != 2026"
    expect: {"value": true, "type": "boolean"}

  - id: "null-not-equal-text-is-true-again"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    expr: "$.STRATEGY != 'X'"
    expect: {"value": true, "type": "boolean"}

  - id: "strategy-null"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    expr: "$.STRATEGY == null"
    expect: {"value": true, "type": "boolean"}

  - id: "strategy-1"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    note: "Arithmetic on nothing is nothing."
    expr: "$.STRATEGY + 1"
    expect: {"value": null, "type": "empty"}

  - id: "1-strategy"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    expr: "1 - $.STRATEGY"
    expect: {"value": null, "type": "empty"}

  - id: "strategy-2"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    expr: "$.STRATEGY * 2"
    expect: {"value": null, "type": "empty"}

  - id: "strategy"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    expr: "-$.STRATEGY"
    expect: {"value": null, "type": "empty"}

  - id: "x-strategy"
    kind: "expr"
    source: "FoldedSyntaxTest#theNullRule"
    note: "+ still joins a text with nothing."
    expr: "'x' + $.STRATEGY"
    expect: {"value": "x", "type": "text"}

  - id: "strategy-1-2"
    kind: "expr"
