    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: a, kind: kv, columns: [ { label: A, bind: $.A } ], emits: [ { name: pick, on: row-click } ] }\n"
