  - {name: "b", type: "date"}
  - {name: "basis", type: "text", enum: ["ACT/360", "ACT/365F", "30/360", "30E/360", "ACT/ACT"]}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2101", when: "a literal basis outside the set - at compile time"}
  - {code: "RCH-2102", when: "a basis outside the set at evaluation"}
  description: "Fraction of a year from a to b on a day-count basis (dates in either order; never negative): ACT/360, ACT/365F, 30/360 (US NASD), 30E/360, ACT/ACT (ISDA). A decimal to 16 significant digits."
  examples:
  - {expr: "yearfrac('2026-01-01', '2026-07-01', '30/360')", result: 0.5}
  - {expr: "yearfrac('2026-01-01', '2027-01-01', 'ACT/ACT')", result: 1}
  since: "1.0"
- name: intck
  family: dates
  signature: "intck(interval, a, b, calendar?)"
  eval: eager
  params:
