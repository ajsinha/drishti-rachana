drishti_profile:
# Functions that need a model or a platform. A Core implementation that meets one answers RCH-2060 naming the profile.
# Drafted from Drishti's signatures.yaml; the profile's own catalogue (and its DRS- codes) is authoritative here.
- name: measure
  family: "measure reference"
  runs: E
  signature: "measure('name') | measure('VAR', 'DESK:DESK-COMM', [options])"
  params:
  - {name: "name", type: "string-literal"}
  - {name: "scope", type: "string", default: "null"}
  - {name: "options", type: "any", default: "null"}
  returns: "number"
  scopes: ["aggregate", "context"]
  description: "Another measure of the model, by its name or its stable id (measure('m_mtm')); a rename keeps the binding by id."
  edge_cases: {"nulls": "As the measure it names.", "types": "Measures that refer to each other in a circle are DRS-9127."}
  examples:
  - {expr: "measure('P&L 1d') / measure('Exposure (EE peak)')", says: "P&L per unit of exposure"}
  - {expr: "measure('MTM') - measure('Open MTM')", says: "MTM of the matured trades"}
  classify: profile
- name: cell
  family: measure reference
  runs: E
  signature: "cell(view, field?, member?, ...)"
  params:
  - {name: "view", type: "text"}
  - {name: "pairs", type: "any", variadic: true, optional: true}
  returns: "number"
  description: "A cell of a saved pivot view the person may open, as the view computes it: cell('ann/desk-pnl', 'DESK', 'DESK-COMM', 'month', '2026-09'); a field left out reads its total; 'value', '<label>' picks one of several values. Arity 1 to 33. No row in signatures.yaml yet (RCH-9129/DRS-9129 in checked mode)."
  classify: profile
- name: ratio
  family: "aggregate"
  runs: E
  signature: "ratio(num, den)"
  params:
  - {name: "num", type: "aggregate"}
  - {name: "den", type: "aggregate"}
  returns: "decimal"
  scopes: ["aggregate"]
  description: "num / den as a decimal, None when den is 0. The same as num / den in DEL, kept for readability."
  edge_cases: {"nulls": "null when either side is null.", "empty": "null over no rows."}
  examples:
  - {expr: "ratio(sum(trades.MTM), sum(trades.NOTIONAL))", says: "MTM per unit of notional"}
  - {expr: "ratio(sum(regions.GDP_USD_BN), sum(regions.POPULATION)) * 1000000000", says: "GDP per head in USD"}
  classify: profile
- name: convert
  family: "conversion"
  runs: E
  signature: "convert(agg, to = 'USD', at = 'as-of')"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "to", type: "string-literal", default: "'USD'", keyword_only: true}
  - {name: "at", type: "string-literal", default: "'as-of'", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate"]
  description: "An aggregate of amounts in many currencies, converted to one: each amount inside is multiplied by the rate of its own currency (its column's unit: { currency: ... }) at the as-of date (at='as-of'), at each row's trade date (at='trade-date'; the business date when the row has none) or at another date column of the row (at='settleDate')."
  edge_cases: {"currencies": "Lifts the currency guard: the result has one currency.", "types": "An amount with no currency, or mixing two, is refused (DRS-9020): convert each amount in its own aggregate.", "nulls": "A row whose rate is unknown adds null (it is skipped by the sum)."}
  examples:
  - {expr: "convert(sum(trades.NOTIONAL), to = 'USD')", says: "notional in USD at the as-of rate"}
  - {expr: "convert(sum(trades.MTM), to = 'EUR', at = 'trade-date')", says: "each trade converted at its own trade date"}
  classify: profile
- name: fx
  family: "conversion"
  runs: R
  signature: "fx(ccy, to, at = null)"
  params:
  - {name: "ccy", type: "string"}
  - {name: "to", type: "string-literal"}
  - {name: "at", type: "date", default: "null", keyword_only: true}
  returns: "decimal"
  scopes: ["row", "aggregate"]
  description: "The rate that converts one unit of ccy into the currency to: the latest rate on or before the row's business date (or at=) in the model's FX rates (fx: { rates, from, to, rate, date, base }), a pair as stored, its inverse, or through the base currency; 1 for the same currency. Worked out inside a measure (a dataset's derived column cannot read the rates)."
  edge_cases: {"nulls": "null when the currency is null or no rate for the pair is on or before the date.", "currencies": "A converted amount has one currency, so summing it lifts the currency guard (DRS-9158).", "masked": "The rates are reference data: the rates table's row rules do not filter a conversion."}
  examples:
  - {expr: "sum(trades.NOTIONAL * fx(trades.CURRENCY, 'USD'))", says: "notional in US dollars"}
  - {expr: "sum(trades.MTM * fx(trades.CURRENCY, 'EUR', at = trades.TRADE_DATE))", says: "MTM in euros at each trade date"}
  classify: profile
- name: related
  family: "lookup"
  runs: E
  signature: "related(alias.COLUMN) | related(table.COLUMN, on = key)"
  params:
  - {name: "field", type: "field"}
  - {name: "on", type: "field", default: "null", keyword_only: true}
  returns: "same"
  scopes: ["row"]
  description: "A column of the one row a many-to-one pack reference points at: one hop, in a dataset's derive (for example the desk's name on a trade)."
  edge_cases: {"nulls": "null when the reference is empty or points at nothing.", "masked": "A masked column of the referenced kind arrives masked.", "types": "Exactly one hop; related(related(...)) is DRS-9127."}
  examples:
  - {expr: "related(desk.NAME)", says: "the desk's name next to each trade"}
  - {expr: "related(counterparty.sector)", says: "the counterparty's sector as a column of the trade dataset"}
  classify: profile
- name: related_rows
  family: "lookup"
  runs: E
  signature: "related_rows('alias')"
  params:
  - {name: "alias", type: "string-literal"}
  returns: "boolean"
  scopes: ["rule"]
  description: "A row rule that limits a table to the rows related to the rows of another table of the model that the reader sees: the keys both tables share (a dimension both reference, or a reference from one to the other) must appear among the reader's rows of that table. A desk head limited to her desks' trades sees the exposure of the counterparties her desks trade with."
  edge_cases: {"missing": "Refused when the model has no table of that alias, or the two tables share no key: the question is refused rather than answered without the rule.", "elsewhere": "Outside BI's engine (a table read on its own through the table layer) the rule lets no row through."}
  examples:
  - {expr: "related_rows('trades')", says: "the rows that share a key with a trade the reader sees (a rule on another fact of the model)"}
  - {expr: "related_rows('netting_sets')", says: "the exposure of the netting sets the reader sees"}
  classify: profile
- name: calc
  family: "filter context"
  runs: E
  signature: "calc(agg, where = ..., ignore = [...] | ALL | GROUP, keep = [...], via = 'rel_id', filter = 'one_way' | 'both', by = [...], having = ...)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "where", type: "boolean", default: "null", keyword_only: true}
  - {name: "ignore", type: "fields-or-all", default: "[]", keyword_only: true}
  - {name: "keep", type: "fields", default: "[]", keyword_only: true}
  - {name: "via", type: "string-literal", default: "null", keyword_only: true}
  - {name: "filter", type: "string-literal", default: "null", keyword_only: true}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  - {name: "having", type: "boolean", default: "null", keyword_only: true}
  returns: "same"
  scopes: ["aggregate", "context"]
  description: "The aggregate in an edited filter context: add conditions (where=, a row condition ANDed to the aggregate's), drop the query's and the group's filters on some fields or a whole table (ignore=[desks.NAME], ignore=[desks]) or on all (ignore=ALL), the group alone (ignore=GROUP, slicers stay), narrow what ignore drops (with ignore, keep=[...]), drop every filter except those on some fields (keep alone), follow an inactive relationship (via='r_5'), override a relationship's direction for this measure (via='name', filter='one_way'|'both'), or keep only the groups of by that pass a condition (by=[...], having=...). Security is never in scope: ignore=ALL means everything you may see."
  edge_cases: {"masked": "ignore=ALL means all the rows you may see, never more; a masked field in ignore= or keep= is never a group (it is not grouped on).", "empty": "null (a count: 0) when the edited context has no rows.", "types": "Nesting of calc, share_of, parent_of and as_of is at most three deep (DRS-9127)."}
  examples:
  - {expr: "calc(measure('MTM'), ignore = [desks.NAME])", says: "MTM ignoring the desk slicer and the desk of the row"}
  - {expr: "calc(sum(trades.MTM), where = trades.TRADE_STATUS != 'MATURED')", says: "MTM of the live trades, whatever else is filtered"}
  - {expr: "calc(measure('MTM'), keep = [desks.REGION])", says: "MTM of the whole region of the row"}
  - {expr: "calc(measure('MTM'), via = 'r_5')", says: "MTM along the settlement-date relationship"}
  classify: profile
- name: share_of
  family: "filter context"
  runs: E
  signature: "share_of(agg, over = [...] | ALL)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "over", type: "fields-or-all", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "The aggregate divided by itself with the fields of over ignored (the same as agg / calc(agg, ignore=over)): over=ALL is the share of the grand total you may see, over=[books.NAME] a book's share within the rest of its group."
  edge_cases: {"nulls": "null when the coarser total is 0 or null.", "masked": "Of what you may see: the total never includes rows your row rules hide."}
  examples:
  - {expr: "share_of(measure('MTM'), over = ALL)", says: "MTM as a share of the total you may see"}
  - {expr: "share_of(measure('MTM'), over = [books.NAME])", says: "a book's share within its desk"}
  classify: profile
- name: parent_of
  family: "filter context"
  runs: E
  signature: "parent_of(agg, hierarchy = 'name')"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "hierarchy", type: "string-literal", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "The aggregate as a share of its parent level in a hierarchy of the model: the deepest level of the hierarchy in the answer is ignored (with the levels below it), so each row is divided by its parent's total."
  edge_cases: {"nulls": "null at the top level, and when no level of the hierarchy is a field of the answer; null when the parent's total is 0.", "types": "hierarchy names a hierarchy of the model (DRS-9152 otherwise)."}
  examples:
  - {expr: "parent_of(measure('MTM'), hierarchy = 'Desk && book')", says: "a book's share of its desk"}
  - {expr: "parent_of(measure('Notional'), hierarchy = 'Region')", says: "a country's share of its region"}
  classify: profile
- name: as_of
  family: "time travel"
  runs: E
  signature: "as_of(agg, date_expr)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date_expr", type: "date"}
  returns: "same"
  scopes: ["aggregate", "context"]
  description: "The aggregate with every scan bound to another business date (the same fields, filters and security, that day's data), joined on the answer's fields: today against yesterday in one visual. The date is worked out before the query runs: date('...'), asof(), or shift_date(asof(), n, unit=)."
  edge_cases: {"empty": "null when that date has no data for the group.", "types": "A date that depends on the row (a column) is refused (DRS-9166); a live table has no other dates (DRS-9157)."}
  examples:
  - {expr: "measure('MTM') - as_of(measure('MTM'), shift_date(asof(), -1))", says: "MTM day on day"}
  - {expr: "as_of(measure('Exposure'), date('2026-09-30'))", says: "exposure at the quarter end"}
  classify: profile
- name: avg_by
  family: "aggregate"
  runs: E
  signature: "avg_by(agg, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "by", type: "fields", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "A two-level aggregate: agg per value of by (within each group of the answer), then the average of those values (the explicit iteration DEL has instead of DAX context transition)."
  edge_cases: {"nulls": "Groups of by whose aggregate is null are left out of the average.", "empty": "null when no group of by has rows.", "masked": "A masked field in by is refused (DRS-9161): the inner groups would split on hidden values."}
  examples:
  - {expr: "avg_by(sum(trades.MTM), by = [trades.TRADE_DATE])", says: "the average daily MTM"}
  - {expr: "avg_by(count(trades), by = [trades.PORTFOLIO])", says: "trades per book, on average"}
  classify: profile
- name: sum_by
  family: "aggregate"
  runs: E
  signature: "sum_by(agg, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "by", type: "fields", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "A two-level aggregate: agg per value of by, then the sum of those values. The row-to-filter context transition, with its grain written: per value of by the inner aggregate is evaluated with that value as a filter. A measure that does not add (additive: false, such as VaR) is refused: use max_by, min_by or avg_by."
  edge_cases: {"nulls": "Groups of by whose aggregate is null are left out.", "empty": "null when no group of by has rows."}
  examples:
  - {expr: "sum_by(max(trades.MTM), by = [desks.NAME])", says: "the sum of each desk's largest MTM"}
  - {expr: "sum_by(count(trades), by = [trades.PORTFOLIO])", says: "trades, counted book by book"}
  classify: profile
- name: min_by
  family: "aggregate"
  runs: E
  signature: "min_by(agg, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "by", type: "fields", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "A two-level aggregate: agg per value of by, then the smallest of those values."
  edge_cases: {"nulls": "Groups of by whose aggregate is null are left out.", "empty": "null when no group of by has rows."}
  examples:
  - {expr: "min_by(measure('MTM'), by = [desks.NAME])", says: "the smallest desk MTM"}
  - {expr: "min_by(sum(trades.MTM), by = [trades.TRADE_DATE])", says: "the worst day's MTM"}
  classify: profile
- name: max_by
  family: "aggregate"
  runs: E
  signature: "max_by(agg, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "by", type: "fields", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate", "context"]
  description: "A two-level aggregate: agg per value of by, then the largest of those values. Good for a measure that does not add, such as the largest desk VaR."
  edge_cases: {"nulls": "Groups of by whose aggregate is null are left out.", "empty": "null when no group of by has rows."}
  examples:
  - {expr: "max_by(measure('VaR'), by = [desks.NAME])", says: "the largest desk VaR"}
  - {expr: "max_by(sum(trades.MTM), by = [trades.TRADE_DATE])", says: "the best day's MTM"}
  classify: profile
- name: avg_over
  family: "balances"
  runs: E
  signature: "avg_over(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "decimal"
  scopes: ["aggregate"]
  description: "The average over the dates of each group of the aggregate per date (an average daily balance): avg_by(agg, by=[date])."
  edge_cases: {"empty": "null when the group has no dated row."}
  examples:
  - {expr: "avg_over(sum(accounts.balance), accounts.business_date)", says: "the average daily balance"}
  - {expr: "avg_over(sum(collateral.value), collateral.businessDate)", says: "average collateral held"}
  classify: profile
- name: latest
  family: "balances"
  runs: E
  signature: "latest(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows of each group dated on the group's latest date (a balance's semi-additive total: the latest day's figure, never the sum of the days)."
  edge_cases: {"empty": "null when the group has no dated row.", "nulls": "Rows with no date are never the latest."}
  examples:
  - {expr: "latest(sum(accounts.balance), accounts.business_date)", says: "the closing balance of the period"}
  - {expr: "latest(sum(collateral.value), collateral.businessDate)", says: "collateral held at the end"}
  classify: profile
- name: earliest
  family: "balances"
  runs: E
  signature: "earliest(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows of each group dated on the group's earliest date."
  edge_cases: {"empty": "null when the group has no dated row."}
  examples:
  - {expr: "earliest(sum(accounts.balance), accounts.business_date)", says: "the balance at the start of the period"}
  - {expr: "latest(sum(accounts.balance), accounts.business_date) - earliest(sum(accounts.balance), accounts.business_date)", says: "the change over the period"}
  classify: profile
- name: opening
  family: "balances"
  runs: E
  signature: "opening(agg, date, period = 'month')"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  - {name: "period", type: "string-literal", default: "'month'", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The balance at the close of the business day before the period starts (period: day, week, month, quarter, year): along the answer's date field it is the closing of the row before; without one, the aggregate on the business day before the as-of date's period (read at that business date when date is the snapshot's businessDate)."
  edge_cases: {"empty": "null when the day before has no rows, and on the first period of the answer when the period before is not in it."}
  examples:
  - {expr: "opening(sum(accounts.balance), accounts.business_date)", says: "the opening balance of the month"}
  - {expr: "opening(sum(accounts.balance), accounts.business_date, period = 'quarter')", says: "the opening balance of the quarter"}
  classify: profile
- name: closing
  family: "balances"
  runs: E
  signature: "closing(agg, date, period = 'month')"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  - {name: "period", type: "string-literal", default: "'month'", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows dated on the last business day of each period (on the model's calendar: a month ending on a holiday or a weekend closes on the business day before), up to the as-of date (the as-of period closes on the as-of date); per group, so a monthly answer shows each month's close."
  edge_cases: {"empty": "null when the period's last business day has no rows.", "types": "Without a window the periods of the five years before the as-of date are looked at."}
  examples:
  - {expr: "closing(sum(accounts.balance), accounts.business_date)", says: "the month-end balance"}
  - {expr: "closing(sum(accounts.balance), accounts.business_date, period = 'year')", says: "the year-end balance"}
  classify: profile
- name: ytd
  family: "time intelligence"
  runs: E
  signature: "ytd(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows whose date falls between the start of the as-of date's year and the as-of date (the end of the query's dates), on the pack's business-day calendar."
  edge_cases: {"empty": "null (a count: 0) when no row is in the window.", "types": "date is a date or timestamp field of the aggregate's dataset."}
  examples:
  - {expr: "ytd(sum(trades.MTM), trades.TRADE_DATE)", says: "MTM of the trades dated this year so far"}
  - {expr: "ytd(count(trades), trades.TRADE_DATE)", says: "trades done this year"}
  classify: profile
- name: mtd
  family: "time intelligence"
  runs: E
  signature: "mtd(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows dated from the start of the as-of month to the as-of date."
  edge_cases: {"empty": "null (a count: 0) when no row is in the window."}
  examples:
  - {expr: "mtd(sum(trades.PNL_1D), trades.TRADE_DATE)", says: "month-to-date P&L"}
  - {expr: "mtd(count(trades), trades.TRADE_DATE)", says: "trades this month"}
  classify: profile
- name: qtd
  family: "time intelligence"
  runs: E
  signature: "qtd(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the rows dated from the start of the as-of quarter to the as-of date."
  edge_cases: {"empty": "null (a count: 0) when no row is in the window."}
  examples:
  - {expr: "qtd(sum(trades.PNL_1D), trades.TRADE_DATE)", says: "quarter-to-date P&L"}
  - {expr: "qtd(sum(trades.NOTIONAL), trades.TRADE_DATE)", says: "notional traded this quarter"}
  classify: profile
- name: fiscal_ytd
  family: "time intelligence"
  runs: E
  signature: "fiscal_ytd(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate from the start of the fiscal year that holds the as-of date to the as-of date; the fiscal year starts on the first of the model's calendars.fiscal-year-start month (January when the model names none)."
  edge_cases: {"empty": "null (a count: 0) when no row is in the window.", "types": "date is a date or timestamp field of the aggregate's dataset."}
  examples:
  - {expr: "fiscal_ytd(sum(trades.PNL_1D), trades.TRADE_DATE)", says: "fiscal year-to-date P&L"}
  - {expr: "fiscal_ytd(count(trades), trades.TRADE_DATE)", says: "trades this fiscal year"}
  classify: profile
- name: prior_period
  family: "time intelligence"
  runs: E
  signature: "prior_period(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the period just before the query's dates, of the same number of business days."
  edge_cases: {"empty": "null (a count: 0) when the prior period has no rows."}
  examples:
  - {expr: "prior_period(sum(trades.PNL_1D), trades.TRADE_DATE)", says: "P&L of the period before"}
  - {expr: "sum(trades.PNL_1D) - prior_period(sum(trades.PNL_1D), trades.TRADE_DATE)", says: "change on the prior period"}
  classify: profile
- name: same_period_last_year
  family: "time intelligence"
  runs: E
  signature: "same_period_last_year(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate over the query's dates moved back one year."
  edge_cases: {"empty": "null (a count: 0) when last year's window has no rows."}
  examples:
  - {expr: "same_period_last_year(sum(trades.NOTIONAL), trades.TRADE_DATE)", says: "notional a year ago"}
  - {expr: "ratio(sum(trades.NOTIONAL), same_period_last_year(sum(trades.NOTIONAL), trades.TRADE_DATE)) - 1", says: "growth on last year"}
  classify: profile
- name: running
  family: "time intelligence"
  runs: E
  signature: "running(agg, date)"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "date", type: "date-field"}
  returns: "same"
  scopes: ["aggregate"]
  description: "A running total of a sum, count, min or max along the date field of the answer (the date must be a field of the visual)."
  edge_cases: {"types": "Only sum, count, min, max; the date field must be in the answer (DRS-9020 otherwise).", "masked": "Refused along a masked date (DRS-9021)."}
  examples:
  - {expr: "running(sum(trades.NOTIONAL), trades.TRADE_DATE)", says: "cumulative notional by day"}
  - {expr: "running(count(trades), trades.TRADE_DATE)", says: "trades so far"}
  classify: profile
- name: lag
  family: "windows"
  runs: E
  signature: "lag(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate n rows before, along order (a field of the answer), restarting for each value of by (default: every other field of the answer)."
  edge_cases: {"nulls": "null on the first n rows of each partition.", "masked": "A masked field is never a partition; ordering along a masked field is DRS-9021."}
  examples:
  - {expr: "lag(sum(trades.MTM), 1, trades.TRADE_DATE)", says: "yesterday's MTM on each row"}
  - {expr: "sum(trades.MTM) - lag(sum(trades.MTM), 1, trades.TRADE_DATE, by = [trades.DESK])", says: "day-on-day change per desk"}
  classify: profile
- name: lead
  family: "windows"
  runs: E
  signature: "lead(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The aggregate n rows after, along order."
  edge_cases: {"nulls": "null on the last n rows of each partition."}
  examples:
  - {expr: "lead(sum(trades.NOTIONAL), 1, trades.MATURITY_DATE)", says: "the next maturity bucket's notional"}
  - {expr: "lead(count(trades), 2, trades.TRADE_DATE, by = [trades.PORTFOLIO])", says: "two days ahead, per book"}
  classify: profile
- name: rank
  family: "windows"
  runs: E
  signature: "rank(agg, desc = true, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "desc", type: "boolean-literal", default: "true", keyword_only: true}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "integer"
  scopes: ["aggregate"]
  description: "The position of each row of the answer by the aggregate, 1 for the highest (desc=False: 1 for the lowest); ties share a rank and leave gaps."
  edge_cases: {"nulls": "null values rank last."}
  examples:
  - {expr: "rank(sum(trades.MTM))", says: "MTM rank, best first"}
  - {expr: "rank(sum(set_exposure.PEAK_EE), by = [counterparties.SECTOR])", says: "exposure rank within each sector"}
  classify: profile
- name: dense_rank
  family: "windows"
  runs: E
  signature: "dense_rank(agg, desc = true, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "desc", type: "boolean-literal", default: "true", keyword_only: true}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "integer"
  scopes: ["aggregate"]
  description: "Like rank, without gaps after ties."
  edge_cases: {"nulls": "null values rank last."}
  examples:
  - {expr: "dense_rank(sum(trades.NOTIONAL))", says: "1, 2, 2, 3 for tied notionals"}
  - {expr: "dense_rank(count(trades), desc = false)", says: "the quietest first"}
  classify: profile
- name: percent_rank
  family: "windows"
  runs: E
  signature: "percent_rank(agg, desc = true, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "desc", type: "boolean-literal", default: "true", keyword_only: true}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate"]
  description: "The relative rank from 0 to 1."
  edge_cases: {"empty": "0 for a single row."}
  examples:
  - {expr: "percent_rank(sum(trades.MTM))", says: "0 for the best desk, 1 for the worst"}
  - {expr: "percent_rank(sum(trades.NOTIONAL), desc = false)", says: "a percentile position by size"}
  classify: profile
- name: moving_avg
  family: "windows"
  runs: E
  signature: "moving_avg(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "decimal"
  scopes: ["aggregate"]
  description: "The average of the aggregate over the row and the n - 1 rows before it along order."
  edge_cases: {"nulls": "The first rows average over what is there."}
  examples:
  - {expr: "moving_avg(sum(trades.MTM), 3, trades.TRADE_DATE)", says: "a three-day moving average of MTM"}
  - {expr: "moving_avg(sum(trades.PNL_1D), 20, trades.TRADE_DATE, by = [trades.DESK])", says: "a 20-day average P&L per desk"}
  classify: profile
- name: moving_sum
  family: "windows"
  runs: E
  signature: "moving_sum(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The sum of the aggregate over the row and the n - 1 rows before it."
  edge_cases: {"nulls": "null values are skipped."}
  examples:
  - {expr: "moving_sum(sum(trades.PNL_1D), 5, trades.TRADE_DATE)", says: "a rolling five-day P&L"}
  - {expr: "moving_sum(count(trades), 7, trades.TRADE_DATE)", says: "trades over the last seven rows"}
  classify: profile
- name: moving_min
  family: "windows"
  runs: E
  signature: "moving_min(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The smallest value of the aggregate over the row and the n - 1 rows before it."
  edge_cases: {"nulls": "null values are skipped."}
  examples:
  - {expr: "moving_min(sum(trades.MTM), 10, trades.TRADE_DATE)", says: "the worst MTM of the last ten days"}
  - {expr: "moving_min(min(trades.MTM), 3, trades.TRADE_DATE)", says: "the worst trade over three days"}
  classify: profile
- name: moving_max
  family: "windows"
  runs: E
  signature: "moving_max(agg, n, order, by = [fields])"
  params:
  - {name: "agg", type: "aggregate"}
  - {name: "n", type: "integer-literal"}
  - {name: "order", type: "field"}
  - {name: "by", type: "fields", default: "[]", keyword_only: true}
  returns: "same"
  scopes: ["aggregate"]
  description: "The largest value of the aggregate over the row and the n - 1 rows before it."
  edge_cases: {"nulls": "null values are skipped."}
  examples:
  - {expr: "moving_max(max(netting_sets.NET_MTM), 5, netting_sets.businessDate)", says: "the largest net MTM over five days"}
  - {expr: "moving_max(sum(trades.MTM), 20, trades.TRADE_DATE)", says: "the 20-day high of MTM"}
  classify: profile

engine_list_functions:
# Supplied today by Drishti's pivot engine as list functions. Core or profile is not yet settled (SPEC 5.11); a Core implementation MAY lack them.
- {name: "sum_once", signature: "sum_once(x)", form: "mergeable", description: "a coarser figure counted once per parent (a trade's in a per-leg view)", classify: "pending (H5)"}
- {name: "count_once", signature: "count_once(x)", form: "mergeable", description: "as sum_once, counting", classify: "pending (H5)"}
- {name: "avg_once", signature: "avg_once(x)", form: "mergeable", description: "as sum_once, the mean", classify: "pending (H5)"}
- {name: "sumproduct", signature: "sumproduct(a, b)", form: "mergeable", description: "sum of a*b over the rows where both are present; 0 for none", classify: "pending (H5)"}
- {name: "sumsq", signature: "sumsq(x)", form: "mergeable", description: "sum of x squared", classify: "pending (H5)"}
- {name: "product", signature: "product(x)", form: "mergeable", description: "product of x, kept as a mantissa and a binary exponent; empty past a number's range", classify: "pending (H5)"}
- {name: "devsq", signature: "devsq(x)", form: "mergeable", description: "sum of (x - mean) squared", classify: "pending (H5)"}
- {name: "avedev", signature: "avedev(x)", form: "holistic", description: "mean absolute deviation from the mean", classify: "pending (H5)"}
- {name: "geomean", signature: "geomean(x)", form: "mergeable", description: "geometric mean; positive values only", classify: "pending (H5)"}
- {name: "harmean", signature: "harmean(x)", form: "mergeable", description: "harmonic mean; positive values only", classify: "pending (H5)"}
- {name: "mode", signature: "mode(x)", form: "holistic", description: "most frequent value, ties to the smallest; none when no value repeats", classify: "pending (H5)"}
- {name: "mode_multi", signature: "mode_multi(x)", form: "holistic", description: "every most frequent value, ascending; at most 10,000 different values", classify: "pending (H5)"}
- {name: "range", signature: "range(x)", form: "mergeable", description: "max - min", classify: "pending (H5)"}
- {name: "iqr", signature: "iqr(x)", form: "holistic", description: "p75 - p25, linear interpolation (Excel's QUARTILE.INC)", classify: "pending (H5)"}
- {name: "cv", signature: "cv(x)", form: "mergeable", description: "coefficient of variation s/mean; none under two values", classify: "pending (H5)"}
- {name: "stderr", signature: "stderr(x)", form: "mergeable", description: "standard error s/sqrt(n); none under two values", classify: "pending (H5)"}
- {name: "nmiss", signature: "nmiss(x)", form: "mergeable", description: "the number of empty values", classify: "pending (H5)"}
- {name: "kurtosis", signature: "kurtosis(x)", form: "mergeable", description: "Excel's sample excess kurtosis; none under four values or without spread", classify: "pending (H5)"}
- {name: "skewness", signature: "skewness(x)", form: "mergeable", description: "Excel's sample skewness; none under three values or without spread", classify: "pending (H5)"}
- {name: "skewness_pop", signature: "skewness_pop(x)", form: "mergeable", description: "population skewness", classify: "pending (H5)"}
