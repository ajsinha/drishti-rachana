# Harvested by reading Drishti's tests (plan H2); verified by the reference runner (plan H1) unless a case says verified: false.
suite: format/coverage
since: "1.0"
profile: core
verified: true
description: "Formats and tones no other format case names (plan R0 H5 coverage)."
cases:

