rachana: 1.2
fragment: kpi-strip
version: 1
doc:
  summary: A row of up to eight headline figures, each with its change against a reference and an optional sparkline.
  description: >-
    The figures a reader looks at first, in a row: label, value, change against a reference (day before, last close)
    and, when a history table is given, a small line of recent values beside each figure. Give the items in the order
    to show them; a figure beyond the eighth is left out. Use
    core/tile-grid for tiles with no history, core/key-figure for one figure.
  category: figures
  tags: [kpi, strip, figures, sparkline, home]
params:
  items:
    type: "list<record{label: text, value: number, delta: number?, caption: text?, open: text?}>"
    required: true
    min: 1
    max: 8
    doc: "The figures in order: { label, value, delta, caption, open }; open is the command a click on the figure raises (open0 ... open7), empty: the figure is not clickable"
  history:
    type: table
    optional: true
    live: ok
    doc: One row per figure and day, for the sparklines
    columns:
      label: { type: text,   doc: The figure's label, as in items }
      date:  { type: date,   doc: The day }
      value: { type: number, doc: The figure on that day }
  fmt:       { type: format, default: amount0, doc: How the figures are written }
  delta-fmt: { type: format, default: signed0, doc: How the changes are written }
  tone:      { type: enum, options: [sign, accent, ok, warn, bad, pos, neg], default: accent, doc: How the figures are toned }
emits:
  - { name: open0, payload: { command: text }, doc: "Figure 1 was clicked: the command that opens its mnemonic" }
  - { name: open1, payload: { command: text }, doc: "Figure 2 was clicked: the command that opens its mnemonic" }
  - { name: open2, payload: { command: text }, doc: "Figure 3 was clicked: the command that opens its mnemonic" }
  - { name: open3, payload: { command: text }, doc: "Figure 4 was clicked: the command that opens its mnemonic" }
  - { name: open4, payload: { command: text }, doc: "Figure 5 was clicked: the command that opens its mnemonic" }
  - { name: open5, payload: { command: text }, doc: "Figure 6 was clicked: the command that opens its mnemonic" }
  - { name: open6, payload: { command: text }, doc: "Figure 7 was clicked: the command that opens its mnemonic" }
  - { name: open7, payload: { command: text }, doc: "Figure 8 was clicked: the command that opens its mnemonic" }
panels:
  - id: k0
    kind: metric
    when: "size(arg.items) > 0"
    label: "arg.items[0].label"
    value: "arg.items[0].value"
    fmt: "%{fmt}"
    tone: "%{tone}"
    caption: "${coalesce(arg.items[0].caption, '')}"
    delta: "arg.items[0].delta"
    deltaFmt: "%{delta-fmt}"
    emits: [ { name: open0, on: point-click, payload: { command: "coalesce(arg.items[0].open, '')" } } ]
  - id: s0
    kind: line
    when: "size(arg.items) > 0 && !is_blank(arg.history)"
    rows: "arg.history[?@.label == arg.items[0].label]"
    x: date
    y: value
  - id: k1
    kind: metric
    when: "size(arg.items) > 1"
    label: "arg.items[1].label"
    value: "arg.items[1].value"
    fmt: "%{fmt}"
