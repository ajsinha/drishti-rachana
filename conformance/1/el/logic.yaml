  - id: "is-blank-blank"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_blank($.BLANK)"
    expect: {"value": true, "type": "boolean"}

  - id: "is-blank-nope"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_blank($.NOPE)"
    expect: {"value": true, "type": "boolean"}

  - id: "is-blank-desk"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_blank($.DESK)"
    expect: {"value": false, "type": "boolean"}

  - id: "is-blank-1-0"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    note: "A division by zero is empty in Rachana."
    expr: "is_blank(1 / 0)"
    expect: {"value": true, "type": "boolean"}

  - id: "is-error-round-up-abc"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_error(round_up('abc'))"
    expect: {"value": true, "type": "boolean"}

  - id: "is-error-1-1"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_error(1 + 1)"
    expect: {"value": false, "type": "boolean"}

  - id: "is-error-date-x"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_error(date('x'))"
    expect: {"value": true, "type": "boolean"}

  - id: "is-blank-mtm"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    note: "Whether a hidden field is filled is hidden."
    expr: "is_blank($.MTM)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "is-error-mtm"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_error($.MTM)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "type-of-quantity"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "type_of($.QUANTITY)"
    expect: {"value": "number", "type": "text"}

  - id: "type-of-legs"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "type_of($.LEGS)"
    expect: {"value": "list", "type": "text"}

  - id: "type-of-legs-0"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "type_of($.LEGS[0])"
