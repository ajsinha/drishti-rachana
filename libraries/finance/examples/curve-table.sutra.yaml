# Synthetic demo content.
rachana: 1.2
sutra: curve-table-example
version: 1
libraries: [finance@1]
title: { id: "'Curve table'" }
data:
  pts:
    rows:
      - { PILLAR: 3M, ZERO_RATE: 0.0412 }
      - { PILLAR: 1Y, ZERO_RATE: 0.0398 }
      - { PILLAR: 5Y, ZERO_RATE: 0.0385 }
panels:
  - use: finance/curve-table@1
    as: pillars
    with:
      rows: { from: $.pts, columns: { tenor: PILLAR, zero: ZERO_RATE } }
  - { id: picked, kind: markdown, text: "Pillar ${@pillars.select.tenor}", waits: pillars-pillars }
