suite: problem/fragments-calls
since: "1.2"
profile: core
verified: true
description: "Fragments are functions (decision L-21): problems at the call site name the fragment's local name and the caller's; level 1.2."
cases:

  - id: fragment-reads-only-its-parameters
    kind: problem
    source: L-21 (1, 4); LIBRARIES 4.4 (RCH-2117)
    files:
      peek.v1.fragment.yaml: |
        rachana: 1.2
        fragment: peek
        version: 1
        doc:
          summary: A figure that reads the screen around it.
        params:
          label: { type: text, default: Value, doc: What the figure is }
        panels:
          - { id: figure, kind: metric, label: arg.label, value: "$.total" }
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - { use: peek@1 }
    expect:
      ok: false
      problems:
      - code: RCH-2117
        severity: error
        message: "fragment peek reads the screen around it ('$.total'): a library fragment reads only its parameters (arg.), its tables and its slots"
        file: peek.v1.fragment.yaml
        path: "/panels/0/value"
        range: { start: { line: 9, column: 58 } }

  - id: mapping-names-an-unknown-local-column
    kind: problem
    source: L-21 (5); LIBRARIES 5.1 (RCH-2114)
    files: &desk
      desk-list.v1.fragment.yaml: |
        rachana: 1.2
        fragment: desk-list
        version: 1
        doc:
          summary: Amounts by desk, one row each.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
              note: { type: text, optional: true, doc: "A remark, not shown yet" }
        emits:
          - { name: pick, payload: { desk: text }, doc: A desk was chosen }
        panels:
          - id: list
            kind: table
            rows: arg.rows
            columns: [ { label: Desk, bind: desk }, { label: Amount, bind: "@.amount", fmt: amount0 } ]
            emits: [ { name: pick, on: row-click, payload: { desk: "@.desk" } } ]
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amt: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2114
        severity: error
        message: "fragment desk-list: table rows has no column 'amt' (it has desk, amount, note); the use maps it to MTM_USD"
        range: { start: { line: 10, column: 73 } }

  - id: required-column-not-mapped
    kind: problem
    source: L-21 (5); LIBRARIES 5.1 (RCH-2115)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK } } }
    expect:
      ok: false
      problems:
      - code: RCH-2115
        severity: error
        message: "fragment desk-list: table rows needs column amount (number); $.positions has BOOK_DESK, MTM_USD (map it: { from: $.positions, columns: { amount: <column> } })"
        range: { start: { line: 10, column: 19 } }

  - id: mapped-to-a-column-the-caller-lacks
    kind: problem
    source: L-21 (5); LIBRARIES 5.1 (RCH-2116)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_EUR } } }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "column amount of rows (fragment desk-list) is mapped to MTM_EUR, which $.positions does not have (it has BOOK_DESK, MTM_USD)"
        range: { start: { line: 10, column: 19 } }

  - id: column-type-does-not-fit-the-contract
    kind: problem
    source: L-21 (5); LIBRARIES 5.1 (RCH-2116)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions:
          rows: [ { BOOK_DESK: FX, MTM_USD: "1200" } ]
          fields: { BOOK_DESK: { type: text }, MTM_USD: { type: text } }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "column amount of rows (fragment desk-list) is number; $.positions's MTM_USD is text"
        range: { start: { line: 12, column: 19 } }

  - id: unused-mapping-is-a-warning
    kind: problem
    source: L-21 (5) (RCH-2120)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200, REMARK: ok } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD, note: REMARK } } }
    expect:
      ok: true
      problems:
      - code: RCH-2120
        severity: warning
        message: "the use maps column note of rows to REMARK, and fragment desk-list never reads note"
        range: { start: { line: 10, column: 19 } }

  - id: event-payload-is-the-fragments-return-value
    kind: problem
    source: L-21 (4); LIBRARIES 6.1
    note: "@mtm.pick.amount is read as @mtm-list.pick.amount: pick returns desk only, so the check names the scoped panel."
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          as: mtm
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
        - { id: chosen, kind: markdown, text: "Desk ${@mtm.pick.desk}, ${@mtm.pick.amount}", waits: mtm-list }
    expect:
      ok: false
      problems:
      - code: RCH-2057
        severity: error
        message: "panel 'chosen' reads @mtm-list.pick.amount, but the payload of pick has desk"
        range: { start: { line: 12, column: 5 } }

  - id: on-names-an-unknown-event
    kind: problem
    source: L-21 (4); LIBRARIES 7.2 (RCH-2114)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      controls:
        - { id: desk, kind: dropdown, options: [FX, Rates] }
      panels:
        - use: desk-list@1
          as: mtm
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
          on: { choose: { set: desk, field: desk } }
    expect:
      ok: false
      problems:
      - code: RCH-2114
        severity: error
        message: "fragment desk-list has no event 'choose' (it has pick)"
        range: { start: { line: 14, column: 19 } }

  - id: same-fragment-twice-without-as-collides
    kind: problem
    source: L-21 (6); LIBRARIES 7.2 (as)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2024
        severity: error
        message: "duplicate panel id 'list'"
        range: { start: { line: 18, column: 5 } }

  - id: as-is-a-kebab-name
    kind: problem
    source: LIBRARIES 7.2 (as)
    files: *desk
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { desk: FX, amount: 1200 } ] }
      panels:
        - { use: desk-list@1, as: My_Desk, with: { rows: $.positions } }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "as: names this use of fragment desk-list with a lower-case kebab word, not 'My_Desk'"
        range: { start: { line: 9, column: 29 } }

  - id: compile-result-records-library-hashes
    kind: problem
    source: LIBRARIES 9.3, 12
    files:
      rachana_libs/demo/LICENSE: |
        Test material for the conformance suite only.
      rachana_libs/demo/MANIFEST.sha384: |
        db106a3e6b152c7ece984ce582ece8dd99f8763e70e5e6044dc18b57593f5d444618670e9ea8df096e01d179adcf0520  LICENSE
        13f64110035896af0fc8e28f40d3ce87cdefd1a74adc45ce99f02d4c9f8f540c626ff0a98653d6fbac1f51e2ae4262a7  demo.rachana-lib.yaml
        efeff0b56cf42b9fd8768afceed7c2bf573b16d3aa2a2bf485444a1b68a8728afaef9f10c74a7425f071652de5effa61  fragments/figure-pair.v1.fragment.yaml
        ab6e8ed131731de52fa0dbe668334867122306f7dca70b1de8eab22cf2926e1e399fbaf145bd98327e935a488d49f281  fragments/key-figure.v1.fragment.yaml
      rachana_libs/demo/demo.rachana-lib.yaml: |
        rachana: 1
        library: demo
        version: 1.0.0
        title: Demo
        summary: A tiny synthetic library that exercises the library machinery in the conformance suite.
        publisher: { name: Rachana conformance }
        licence: LicenseRef-Rachana-Test
        scope: public
        profiles: []
        depends: []
        exports:
          fragments:
            - { name: figure-pair, majors: [1] }
            - { name: key-figure, majors: [1] }
      rachana_libs/demo/fragments/figure-pair.v1.fragment.yaml: |
        rachana: 1.2
        fragment: figure-pair
        version: 1
        doc:
          summary: Two figures side by side, with room for a note under them.
        params:
          left: { type: number, required: true, doc: The first figure }
          right: { type: number, required: true, doc: The second figure }
        slots:
          below: { accepts: panels, max: 1, doc: A note under the figures }
        panels:
          - { use: demo/key-figure@1, with: { id: left, value: arg.left, label: Left } }
          - { use: demo/key-figure@1, with: { id: right, value: arg.right, label: Right } }
          - { slot: below }
      rachana_libs/demo/fragments/key-figure.v1.fragment.yaml: |
        rachana: 1.2
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: { type: number, default: 0, min: 0, doc: Below this the caption says so }
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
      rachana.lock: |
        lock: 1
        libraries:
          demo: { version: 1.0.0, sha384: "e508774901fed4086abf9915f1a177c0d442f34e95914140d7bb840cd9aeaeb2b2abb2971ee3024f1d0c8e9202dd9b03" }
    sutra: |
      rachana: 1.2
      sutra: lib-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      libraries: [demo@1]
      panels:
        - { use: demo/key-figure@1, with: { value: 1 } }
    expect:
      ok: true
      problems: []
      libraries:
      - { name: demo, version: 1.0.0, sha384: e508774901fed4086abf9915f1a177c0d442f34e95914140d7bb840cd9aeaeb2b2abb2971ee3024f1d0c8e9202dd9b03 }

  - id: column-parameter-given-a-computed-text
    kind: problem
    source: L-21 (3); functions.yaml role column (RCH-2121)
    files:
      desk-total.v1.fragment.yaml: |
        rachana: 1.2
        fragment: desk-total
        version: 1
        doc:
          summary: The total of one measure.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
          measure: { type: text, default: amount, doc: The column to total }
        panels:
          - { id: total, kind: metric, label: Total, value: "sum(arg.rows, arg.measure)" }
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-total@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2121
        severity: error
        message: "fragment desk-total names a column of table rows in sum(...) by a computed text ('arg.measure'): the caller's mapping cannot rename it; write the column parameter as text (one of desk, amount) or read the column as @.<name>"
        file: desk-total.v1.fragment.yaml
        path: "/panels/0/value"
        range: { start: { line: 16, column: 53 } }

  - id: filter-over-rows-the-mapping-cannot-follow
    kind: problem
    source: L-21 (3); library finding (core library 1.0.0), never silent
    files:
      desk-mapped.v1.fragment.yaml: |
        rachana: 1.2
        fragment: desk-mapped
        version: 1
        doc:
          summary: Large amounts over rows made by map.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - { id: big, kind: metric, label: Large, value: "count(map(arg.rows, @)[?@.amount > 1000])" }
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-mapped@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2121
        severity: error
        message: "fragment desk-mapped reads @.amount over 'map(arg.rows, @)', rows derived from table rows that the caller's mapping cannot follow: filter the table itself (arg.rows[?...]), or derive the rows with sort, take, drop, unique, difference or intersect over it"
        file: desk-mapped.v1.fragment.yaml
        path: "/panels/0/value"
        range: { start: { line: 15, column: 51 } }

  - id: bare-name-of-a-local-column
    kind: problem
    source: L-21 (3) (RCH-2121)
    files:
      desk-list.v1.fragment.yaml: |
        rachana: 1.2
        fragment: desk-list
        version: 1
        doc:
          summary: The desks with a positive amount.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - id: list
            kind: table
            rows: arg.rows
            where: "amount > 0"
            columns: [ { label: Desk, bind: desk } ]
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2121
        severity: error
        message: "fragment desk-list reads 'amount', a local column of table rows, as a bare name: the caller's mapping does not reach a bare name; write @.amount (or the column as text in a Core function's column parameter, sum(arg.rows, 'amount'))"
        file: desk-list.v1.fragment.yaml
        path: "/panels/0/where"
        range: { start: { line: 18, column: 12 } }

  - id: local-column-text-over-another-list
    kind: problem
    source: L-21 (3) (RCH-2121)
    files:
      desk-total.v1.fragment.yaml: |
        rachana: 1.2
        fragment: desk-total
        version: 1
        doc:
          summary: The total of the amounts.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - { id: total, kind: metric, label: Total, value: "sum(map(arg.rows, @), 'amount')" }
    sutra: |
      rachana: 1.2
      sutra: calls-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-total@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2121
        severity: error
        message: "fragment desk-total names 'amount', a local column of table rows, in sum(...) over a list that is not the table: the caller's mapping cannot rename it; call it over the table (sum(arg.rows, 'amount')) or read it as @.amount"
        file: desk-total.v1.fragment.yaml
        path: "/panels/0/value"
        range: { start: { line: 15, column: 53 } }

