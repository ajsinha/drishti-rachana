  - {name: "a", type: "date"}
  - {name: "b", type: "date"}
  - {name: "calendar", type: "text", optional: true, default: "empty"}
  returns: "integer"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2101", when: "a literal interval or calendar outside the sets - at compile time"}
  - {code: "RCH-2102", when: "a calendar given with an interval other than business_day; business_day spans more than 146,100 days"}
  description: "How many interval boundaries lie between a and b (negative when b is before a). Intervals: day, week (weeks start on Sunday), month, quarter, year, business_day (the business days after a up to and including b)."
  examples:
  - {expr: "intck('month', '2026-01-31', '2026-02-01')", result: 1}
  - {expr: "intck('year', '2025-12-31', '2026-01-01')", result: 1}
  since: "1.0"
- name: is_business_day
