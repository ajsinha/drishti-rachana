- name: macaulay_duration
  family: finance
  signature: "macaulay_duration(flows, when, yield, frequency?, settle?)"
  eval: eager
  params:
  - {name: "flows", type: "list"}
  - {name: "when", type: "list"}
  - {name: "yield", type: "number"}
  - {name: "frequency", type: "integer", optional: true, default: 1}
  - {name: "settle", type: "date", optional: true, default: "empty"}
  returns: "number"
  nulls: {empty: "an empty argument, or a list with an empty element, gives empty (a missing flow is never skipped)", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number, or a list longer than 100,000 values"}
  - {code: "RCH-2102", when: "frequency negative; yield not above -frequency; the flows' present value is 0; flows and times differ in number; dates without settle; a time before the settlement"}
  tolerance: 1.0e-09
  description: "Sum(t*CF*DF)/Sum(CF*DF) on given flows and a given yield; `when` is each flow's time in years or its date (then `settle` is needed; years = days/365); the yield compounds `frequency` times a year (0 continuously). Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
  - {expr: "macaulay_duration([5, 105], [1, 2], 0.05)", result: 1.9523809523809523}
  since: "1.0"
- name: modified_duration
  family: finance
  signature: "modified_duration(flows, when, yield, frequency?, settle?)"
  eval: eager
  params:
  - {name: "flows", type: "list"}
  - {name: "when", type: "list"}
  - {name: "yield", type: "number"}
  - {name: "frequency", type: "integer", optional: true, default: 1}
  - {name: "settle", type: "date", optional: true, default: "empty"}
  returns: "number"
  nulls: {empty: "an empty argument, or a list with an empty element, gives empty (a missing flow is never skipped)", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number, or a list longer than 100,000 values"}
  - {code: "RCH-2102", when: "as macaulay_duration"}
  tolerance: 1.0e-09
  description: "Macaulay duration / (1 + y/f) (continuous: the same). Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
  - {expr: "modified_duration([5, 105], [1, 2], 0.05)", result: 1.859410430839002}
  since: "1.0"
- name: convexity
  family: finance
  signature: "convexity(flows, when, yield, frequency?, settle?)"
  eval: eager
  params:
  - {name: "flows", type: "list"}
  - {name: "when", type: "list"}
  - {name: "yield", type: "number"}
  - {name: "frequency", type: "integer", optional: true, default: 1}
  - {name: "settle", type: "date", optional: true, default: "empty"}
  returns: "number"
  nulls: {empty: "an empty argument, or a list with an empty element, gives empty (a missing flow is never skipped)", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number, or a list longer than 100,000 values"}
  - {code: "RCH-2102", when: "as macaulay_duration"}
  tolerance: 1.0e-09
  description: "Sum(CF*DF*t*(t + 1/f)) / (P*(1 + y/f)^2) (continuous: Sum(CF*DF*t^2)/P). Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
  - {expr: "convexity([5, 105], [1, 2], 0.05)", result: 5.269409351042004}
  since: "1.0"

