    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: l1\n    kind: table\n    rows: $.A\n    columns: [ { label: K, bind: \"@.K\" } ]\n    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n    children:\n      - panels:\n          - id: l2\n            kind: table\n            rows: $.A\n            columns: [ { label: K, bind: \"@.K\" } ]\n            emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n            children:\n              - panels:\n                  - id: l3\n                    kind: table\n                    rows: $.A\n                    columns: [ { label: K, bind: \"@.K\" } ]\n                    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n"
