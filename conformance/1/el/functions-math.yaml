    kind: "expr"
    source: "functions.yaml#ln"
    expr: "ln(2.718281828459045)"
    expect: {"value": 1, "tolerance": {"abs": 1e-9}}

  - id: "log10-1"
    kind: "expr"
    source: "functions.yaml#log10"
    expr: "log10(1000)"
    expect: {"value": 3}

  - id: "log10-2"
    kind: "expr"
    source: "functions.yaml#log10"
    expr: "log10(0.01)"
