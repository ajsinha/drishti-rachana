rachana: 1.2
fragment: leg-table
version: 1
doc:
  summary: A trade's legs side by side - pay or receive, notional, currency, rate or index, spread, day count and frequency.
  description: >-
    One row per leg. Only the leg, its direction, notional and currency are required; the rate, index, spread, day count
    and frequency are shown when you map them.
  category: trading
  tags: [legs, trade, swap]
  use-when:
    - "A trade's legs are compared side by side (pay or receive, notional, rate or index)."
  avoid-when:
    - "The trade's payments are wanted: use finance/payment-schedule."
  data:
    table: rows
    in-words: "One row per leg: leg, direction, notional and currency, optionally rate, index, spread, day count, frequency."
    sample-row: { leg: Fixed, direction: Received, notional: 50000000, currency: USD, rate: 0.0425, index: SOFR, spread: 0.0015, day_count: ACT/360, frequency: Quarterly }
  example: { use: finance/leg-table@1, with: { rows: { from: "$.legs", columns: { leg: LEG_NO, direction: SIDE, notional: NOTL, currency: CCY } } } }
  see-also: [finance/trade-ticket, finance/payment-schedule]
  keywords: [legs, swap, trade, notional, rate]
params:
  rows:
    type: table
    required: true
    doc: One row per leg
    columns:
      leg:       { type: text,   doc: The leg's name or number }
      direction: { type: text,   doc: Pay or receive }
      notional:  { type: number, doc: The leg's notional }
      currency:  { type: text,   doc: The leg's currency }
      rate:      { type: number, optional: true, doc: The fixed rate }
      index:     { type: text,   optional: true, doc: The floating index }
      spread:    { type: number, optional: true, doc: The spread over the index }
      day_count: { type: text,   optional: true, doc: The day_count convention }
      frequency: { type: text,   optional: true, doc: The payment frequency }
  title:        { type: text, default: Legs, doc: The panel's title }
  rate-fmt:     { type: format, default: pct4, doc: How rates and spreads are written }
  notional-fmt: { type: format, default: amount0, doc: How notionals are written }
panels:
  - id: legs
    kind: table
    title: arg.title
    rows: arg.rows
    search: false
    columns:
      - { label: Leg, bind: "@.leg" }
      - { label: Direction, bind: "@.direction" }
      - { label: Notional, bind: "@.notional", fmt: "%{notional-fmt}" }
      - { label: Currency, bind: "@.currency" }
      - { label: Rate, bind: "@.rate", fmt: "%{rate-fmt}" }
      - { label: Index, bind: "@.index" }
      - { label: Spread, bind: "@.spread", fmt: "%{rate-fmt}" }
      - { label: Day count, bind: "@.day_count" }
      - { label: Frequency, bind: "@.frequency" }
