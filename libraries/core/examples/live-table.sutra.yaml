# Synthetic demo content.
rachana: 1.2
sutra: live-table-example
version: 1
libraries: [core@1]
title: { id: "'Live table'" }
data:
  trades: { table: trade, key: TRADE_ID, live: true, where: "@.BOOK == 'RATES-EU'" }
panels:
  - use: core/live-table@1
    with:
      title: Rates trades
      rows: $.trades
      order: UPDATED_AT
      edit: cells
      columns:
        - { label: Trade, bind: "@.TRADE_ID" }
        - { label: Quantity, bind: "@.QTY", fmt: amount0 }
        - { label: Price, bind: "@.PRICE", fmt: number }
        - { label: Status, bind: "@.STATUS", tone: status }
