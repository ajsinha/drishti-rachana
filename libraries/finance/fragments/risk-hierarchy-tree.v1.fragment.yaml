rachana: 1.2
fragment: risk-hierarchy-tree
version: 1
doc:
  summary: A risk measure down a hierarchy - firm, division, desk, book - each node with its figure, its limit and the share used.
  description: >-
    One row per node with its id, its parent's id (empty at the root), its name and its figure. The figure of every node
    is supplied by you: a risk measure does not add up a hierarchy, so none is summed here. The share used is the
    figure over the limit, shown where a limit is given.
  category: market-risk
  tags: [risk, hierarchy, limits]
  use-when:
    - "A risk measure is read down an organisation (firm, desk, book) with limits and share used."
  avoid-when:
    - "Exposure through netting sets: use finance/netting-set-tree."
  data:
    table: rows
    in-words: "One row per node: id, parent id, name, value and optionally limit (no summing: each node's figure is supplied)."
    sample-row: { id: T-100245, parent: DESK-RATES, name: Rates Desk, value: 1250000, limit: 2500000 }
  example: { use: finance/risk-hierarchy-tree@1, with: { rows: { from: "$.nodes", columns: { id: NODE, parent: PARENT_NODE, name: NODE_NAME, value: MEASURE } } } }
  see-also: [core/tree-table, finance/limit-table, finance/var-contributors]
  keywords: [hierarchy, var by desk, limits, tree, risk]
params:
  rows:
    type: table
    required: true
    doc: One row per node
    columns:
      id:     { type: text,   doc: The node's id }
      parent: { type: text,   doc: The parent node's id; empty at the root }
      name:   { type: text,   doc: The node's name }
      value:  { type: number, doc: The node's figure }
      limit:  { type: number, optional: true, doc: The node's limit }
  title: { type: text, default: Risk by hierarchy, doc: The panel's title }
  fmt:   { type: format, default: amount0, doc: How the figures are written }
  open:  { type: integer, default: 2, min: 0, max: 8, doc: How many levels start open }
panels:
  - id: tree
    kind: tree
    title: arg.title
    rows: "map(arg.rows, {id: @.id, parent: @.parent, name: @.name, value: @.value, limit: @.limit, used: if(is_blank(@.limit), null, @.value / @.limit)})"
    node: id
    parent: parent
    label: name
    mode: grid
    fmt: "%{fmt}"
    open: arg.open
    columns:
      - { label: Id, bind: "@.id" }
      - { label: Parent, bind: "@.parent" }
      - { label: Name, bind: "@.name" }
      - { label: Value, bind: "@.value" }
      - { label: Limit, bind: "@.limit" }
      - { label: Used, bind: "@.used", fmt: pct0 }
