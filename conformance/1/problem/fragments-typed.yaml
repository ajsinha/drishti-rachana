  - id: typed-and-text-form-mixed
    kind: problem
    source: LIBRARIES 2
    files:
      key-figure.v1.fragment.yaml: |
        rachana: 1
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: 0
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
    sutra: |
      rachana: 1
      sutra: lib-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - { use: key-figure@1, with: { value: 1 } }
    expect:
      ok: false
      problems:
      - code: RCH-2048
        severity: error
        message: 'fragment key-figure mixes the typed and the text form: parameter floor is a mapping with a type in the typed form'
        file: key-figure.v1.fragment.yaml
        path: "/params/floor"
        range:
          start:
            line: 11
            column: 10
      - code: RCH-2048
        severity: error
        message: fragment key-figure reads arg.floor, which is not a value or table parameter it declares ([value, label, fmt, id])
        file: key-figure.v1.fragment.yaml
        path: "/panels/0/caption"
        range:
          start:
            line: 18
            column: 14
      - code: RCH-2048
        severity: error
        message: no block key-figure@1 (no block files are loaded)
        range:
          start:
            line: 7
            column: 5

