suite: edit/ops
since: "1.0"
profile: [core, drishti]
verified: true
description: "Editing operations of the reference (design/ops) one at a time: applied, refused, and malformed; harvested from OpApplierTest."
cases:

  - id: "set-option-title-keeps-comments"
    kind: "edit"
    source: "OpApplierTest#everyOperationOnEveryKindKeepsCommentsAndOrder"
    sutra: "rachana: 1\nsutra: ops-test\nversion: 1\nmatch: { kind: trade }\ntitle: { pill: T, id: $.id }\npanels:\n  # the terms\n  - { id: terms, kind: kv, columns: [ { label: A, bind: $.a } ] }  # inline\n  - id: versions\n    kind: table\n    rows: $.versions\n    columns:\n      - { label: V, bind: \"@.v\" }\n  # the notes\n  - { id: notes, kind: markdown, text: hi }\n"
    operation: {"op": "set-option", "panel": "terms", "option": "title", "value": "Renamed \"by\" op: #1"}
    expect: {"text": "rachana: 1\nsutra: ops-test\nversion: 1\nmatch: { kind: trade }\ntitle: { pill: T, id: $.id }\npanels:\n  # the terms\n  - { id: terms, kind: kv, columns: [ { label: A, bind: $.a } ], title: \"Renamed \\\"by\\\" op: #1\" }  # inline\n  - id: versions\n    kind: table\n    rows: $.versions\n    columns:\n      - { label: V, bind: \"@.v\" }\n  # the notes\n  - { id: notes, kind: markdown, text: hi }\n"}

