    rows:
      - { ISSUER: Alder Ltd, QTY: 41000, MV: 4200000, WT: 0.42, CHG: 1500 }
      - { ISSUER: Birch Corp, QTY: 30000, MV: 2600000, WT: 0.26, CHG: -2000 }
