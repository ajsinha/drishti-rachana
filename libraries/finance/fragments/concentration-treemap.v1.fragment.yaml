rachana: 1.2
fragment: concentration-treemap
version: 1
doc:
  summary: Where the risk or the exposure sits - rectangles sized by exposure, nested by group, toned by P&L.
  description: >-
    One row per name (an issuer, a counterparty, a position) with its group (a sector, a country) and its exposure. Each name is a
    rectangle sized by its exposure inside its group's; a P&L, when given, tones it green or red by its sign. Names without a
    positive exposure are left out. A click on a rectangle names it.
  category: market-risk
  tags: [concentration, exposure, treemap]
  use-when:
    - Where risk or exposure concentrates by group and name is shown at a glance.
  avoid-when:
    - "Exact figures matter more than the picture: use core/drill-table."
    - "The names are few: use core/ranked-bars."
  data:
    table: rows
    in-words: "One row per name: group, name, exposure and optionally P&L."
    sample-row: { group: Financials, name: Rates Desk, exposure: 18500000, pnl: -125000 }
  example: { use: finance/concentration-treemap@1, with: { rows: { from: "$.positions", columns: { group: SECTOR, name: ISSUER, exposure: EXPOSURE_USD } } } }
  see-also: [core/drill-table, core/ranked-bars]
  keywords: [concentration, treemap, exposure, sector, issuer]
params:
  rows:
    type: table
    required: true
    doc: One row per name
    columns:
      group:    { type: text,   doc: "The outer level (a sector, a country)" }
      name:     { type: text,   doc: The name the rectangle shows }
      exposure: { type: number, doc: The figure that sizes it }
      pnl:      { type: number, optional: true, doc: The figure whose sign tones it }
  title: { type: text, default: Concentration, doc: The panel's title }
  fmt:   { type: format, default: amount0, doc: How the exposure is written }
emits:
  - { name: cell, payload: { group: text, name: text }, doc: A rectangle was chosen }
panels:
  - id: map
    kind: treemap
    title: arg.title
    rows: "map(arg.rows, {group: @.group, name: @.name, exposure: @.exposure, pnl: @.pnl})"
    group: group
    label: name
    value: exposure
    color: pnl
    fmt: "%{fmt}"
    emits: [ { name: cell, on: point-click, payload: { group: "@.group", name: "@.name" } } ]
