rachana: 1.2
fragment: gauge-figure
version: 1
doc:
  summary: A value against a maximum as a gauge.
  description: >-
    The share of a maximum that is used, as a gauge with its figure. Pass the value and the maximum; the painter draws
    the bands. For a limit with a history use a line chart beside it.
  category: figures
  tags: [gauge, utilisation, limit]
  use-when:
    - "One value is read against a maximum (utilisation, capacity, progress)."
  avoid-when:
    - "The maximum is a limit with warning bands and history: use finance/limit-gauge."
    - "The value has no natural maximum: use core/key-figure."
  data:
    in-words: "Two numbers: the value and the maximum."
    sample-row: { value: 1250000, max: 1000 }
  example: { use: core/gauge-figure@1, with: { value: "$.disk.USED_GB", max: "$.disk.SIZE_GB", label: Disk used } }
  see-also: [finance/limit-gauge, core/key-figure]
  keywords: [gauge, utilisation, capacity, progress, share used]
params:
  value: { type: number, required: true, doc: The amount used }
  max:   { type: number, required: true, doc: The maximum the gauge runs to }
  label: { type: text, default: Used, doc: What the gauge measures }
  fmt:   { type: format, default: pct0, doc: How the figure is written }
panels:
  - id: gauge
    kind: gauge
    value: arg.value
    max: arg.max
    label: arg.label
    fmt: "%{fmt}"
