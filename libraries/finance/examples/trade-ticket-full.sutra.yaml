# Synthetic demo content.
rachana: 1.2
sutra: trade-ticket-full-example
version: 1
libraries: [finance@1]
title: { id: "'Trade ticket (full)'" }
data:
  t: { record: { TRADE_ID: T-1001, PRODUCT: Interest rate swap, SIDE: Pay fixed, CPTY: Birch Bank, BOOK: RATES-A, TDATE: "2025-11-03", MAT: "2030-11-05", NOTL: 25000000, CCY: USD, FIXED: 0.0385, STATE: Live } }
panels:
  - use: finance/trade-ticket@1
    with:
      trade: "{id: $.t.TRADE_ID, product: $.t.PRODUCT, direction: $.t.SIDE, counterparty: $.t.CPTY, book: $.t.BOOK, trade_date: $.t.TDATE, maturity: $.t.MAT, notional: $.t.NOTL, currency: $.t.CCY, price: $.t.FIXED, status: $.t.STATE}"
      price-fmt: pct2
    slots:
      extra:
        - { id: remark, kind: markdown, text: Synthetic trade }
