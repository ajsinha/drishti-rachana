suite: protocol/examples/filter
since: "1.0"
profile: core
verified: false
description: The query document and the filter syntax tree (PROTOCOL 6, 7).
cases:
  - id: filter-and-sort
    kind: protocol
    source: PROTOCOL 6.1, 7
    fixture: &sales
      name: rdp-sales
      schema:
        name: rdp-sales
        key: [region, month]
        columns:
          - { name: region, type: string }
          - { name: month, type: date }
          - { name: revenue, type: decimal, scale: 2 }
          - { name: note, type: string }
        can: [page, sort, filter, group, count]
      rows:
        - { region: North, month: "2026-01-01", revenue: "120.00", note: null }
        - { region: North, month: "2026-02-01", revenue: "135.00", note: "late" }
        - { region: South, month: "2026-01-01", revenue: "80.00", note: "Late order" }
        - { region: South, month: "2025-12-01", revenue: "70.00", note: null }
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            columns: [region, month, revenue]
            filter:
              op: "&&"
              args:
                - { op: "==", args: [ { col: region }, { lit: South } ] }
                - { op: ">=", args: [ { col: month }, { lit: "2026-01-01", type: date } ] }
            sort: [ { col: revenue, dir: desc, nulls: last } ]
        expect:
          status: 200
          body:
            columns: [region, month, revenue]
            values: [ [South, "2026-01-01", "80.00"] ]

  - id: filter-in-list-and-null
    kind: protocol
    source: PROTOCOL 7
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            columns: [region, month]
            filter:
              op: "&&"
              args:
                - { op: in, args: [ { col: region }, { list: [ { lit: North }, { lit: East } ] } ] }
                - { op: is-null, args: [ { col: note } ] }
            sort: [ { col: month } ]
        expect:
          status: 200
          body: { values: [ [North, "2026-01-01"] ] }

  - id: filter-case-insensitive-contains
    kind: protocol
    source: PROTOCOL 7
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            columns: [region, note]
            filter: { op: contains, args: [ { col: note }, { lit: late } ] }
            sort: [ { col: region }, { col: month } ]
        expect:
          status: 200
          body:
            values: [ [North, late], [South, "Late order"] ]

  - id: filter-unknown-operation-is-invalid
    kind: protocol
    source: PROTOCOL 7, 10.1
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            filter: { op: matches, args: [ { col: note }, { lit: "^l" } ] }
        expect:
          status: 422
          body: { error: { code: rdp.query.invalid } }

  - id: group-with-totals
    kind: protocol
    source: PROTOCOL 6.3
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            group:
              by: [region]
              values: [ { name: revenue, agg: sum, col: revenue }, { name: n, agg: count } ]
              totals: true
            sort: [ { col: region } ]
        expect:
          status: 200
          body:
            columns: [region, revenue, n]
            values: [ [North, "255.00", 2], [South, "150.00", 2] ]
            totals: { revenue: "405.00", n: 4 }

  - id: filter-not-equal-keeps-empty
    kind: protocol
    source: PROTOCOL 7; SPEC 4.6
    note: "empty != 'X' is true in Rachana-EL, so rows whose note is null are kept (a SQL host needs IS DISTINCT FROM)."
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            columns: [region, month]
            filter: { op: "!=", args: [ { col: note }, { lit: late } ] }
            sort: [ { col: region }, { col: month } ]
        expect:
          status: 200
          body: { values: [ [North, "2026-01-01"], [South, "2025-12-01"], [South, "2026-01-01"] ] }

  - id: filter-not-of-ordering-against-empty-is-true
    kind: protocol
    source: PROTOCOL 7; SPEC 4.7, 4.8
    note: "An ordering against empty is false, so its negation is true and the null rows are kept (SQL's NOT (NULL < x) would drop them)."
    fixture: *sales
    steps:
      - request:
          method: POST
          path: /tables/rdp-sales/query
          body:
            columns: [region, month]
            filter: { op: "!", args: [ { op: "<", args: [ { col: note }, { lit: zzz } ] } ] }
            sort: [ { col: region }, { col: month } ]
        expect:
          status: 200
          body: { values: [ [North, "2026-01-01"], [South, "2025-12-01"] ] }

  - id: filter-on-masked-column-is-forbidden
    kind: protocol
    source: PROTOCOL 7, 11
    fixture:
      name: rdp-staff
      schema:
        name: rdp-staff
        key: [id]
        columns:
          - { name: id, type: string }
          - { name: salary, type: decimal, scale: 2, masked: true }
        can: [filter]
      rows:
        - { id: A, salary: { $masked: true } }
        - { id: B, salary: { $masked: true } }
    steps:
      - request:
          method: POST
          path: /tables/rdp-staff/query
          body:
            filter: { op: ">", args: [ { col: salary }, { lit: "100000", type: decimal } ] }
        expect:
          status: 403
          body: { error: { code: rdp.forbidden } }
