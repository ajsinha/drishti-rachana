rachana: 1.2
fragment: alert-banner
version: 1
doc:
  summary: A line across the screen, shown only while its condition holds.
  description: >-
    Give the condition and the words (fixed text, as written). Nothing is drawn while the condition is false. For a
    figure in the message, put a key-figure beside it.
  category: states
  tags: [alert, banner, warning]
  use-when:
    - "A condition needs the reader's attention now: a breach, a stale feed, a failed load."
  avoid-when:
    - "The message is permanent guidance: use core/note."
    - "The point is a number: use core/key-figure."
  data:
    in-words: "A true-or-false condition and the words to show; no table."
    sample-row: { show: false, text: Text }
  example: { use: core/alert-banner@1, with: { show: "$.limit.USED > 2 * $.limit.LIMIT", text: Far over the limit } }
  see-also: [core/note, core/key-figure, core/freshness-badge]
  keywords: [alert, warning, banner, breach, notice]
params:
  show:   { type: boolean, required: true, doc: Whether the banner is shown }
  text:   { type: text, required: true, doc: The words of the banner }
  label:  { type: text, default: Notice, doc: The word that heads the banner }
panels:
  - id: banner
    kind: status
    when: arg.show
    fields: [ { label: arg.label, bind: "'' + arg.text" } ]
