# Synthetic demo content.
rachana: 1.2
sutra: limit-band-example
version: 1
libraries: [finance@1]
title: { id: "'Limit band'" }
data:
  desk: { record: { NET_DELTA_USD: -720000, DELTA_LIMIT_USD: 1000000 } }
panels:
  - use: finance/limit-band@1
    with: { value: "$.desk.NET_DELTA_USD", lower: "0 - $.desk.DELTA_LIMIT_USD", upper: "$.desk.DELTA_LIMIT_USD" }
