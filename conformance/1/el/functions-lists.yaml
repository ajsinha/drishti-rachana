# Generated from the examples of spec/1/functions.yaml (plan H5); a function's example is its case. Do not edit by hand: edit the example.
suite: el/functions-lists
since: "1.0"
profile: core
verified: true
description: "The examples of the lists functions of functions.yaml."
given: {"today": "2026-10-16"}
cases:

  - id: "size-2"
    kind: "expr"
    source: "functions.yaml#size"
    expr: "size('abc')"
    expect: {"value": 3}

  - id: "size-3"
    kind: "expr"
    source: "functions.yaml#size"
    expr: "size(5)"
    expect: {"value": 0}

  - id: "first-1"
    kind: "expr"
    source: "functions.yaml#first"
    expr: "first([4, 5])"
    expect: {"value": 4}

  - id: "last-1"
    kind: "expr"
    source: "functions.yaml#last"
    expr: "last([4, 5])"
    expect: {"value": 5}

  - id: "flatten-1"
    kind: "expr"
    source: "functions.yaml#flatten"
    expr: "flatten([[1, 2], [3]])"
    expect: {"value": [1, 2, 3]}

  - id: "unique-1"
    kind: "expr"
    source: "functions.yaml#unique"
    expr: "unique([1, 1.0, '1', 2])"
    expect: {"value": [1, "1", 2]}

  - id: "take-1"
    kind: "expr"
    source: "functions.yaml#take"
    expr: "take([1, 2, 3], 2)"
    expect: {"value": [1, 2]}

  - id: "take-2"
    kind: "expr"
    source: "functions.yaml#take"
    expr: "take([1, 2, 3], -1)"
    expect: {"value": [3]}

  - id: "drop-1"
    kind: "expr"
    source: "functions.yaml#drop"
    expr: "drop([1, 2, 3], 1)"
    expect: {"value": [2, 3]}

  - id: "sequence-1"
    kind: "expr"
    source: "functions.yaml#sequence"
    expr: "sequence(3)"
    expect: {"value": [1, 2, 3]}

  - id: "sequence-2"
    kind: "expr"
    source: "functions.yaml#sequence"
    expr: "sequence(3, 0.1, 0.1)"
    expect: {"value": [0.1, 0.2, 0.3]}

  - id: "map-1"
    kind: "expr"
    source: "functions.yaml#map"
    expr: "map([1, 2], @ * 10)"
    expect: {"value": [10, 20]}

  - id: "map-2"
    kind: "expr"
    source: "functions.yaml#map"
    expr: "map(['a', 'b'], #index)"
    expect: {"value": [0, 1]}

  - id: "reduce-1"
    kind: "expr"
    source: "functions.yaml#reduce"
    expr: "reduce(['FIX', 'FLT'], '', concat(@acc, left(@, 2)))"
    expect: {"value": "FIFL"}

  - id: "sort-1"
    kind: "expr"
    source: "functions.yaml#sort"
    expr: "sort([3, 1, 2])"
    expect: {"value": [1, 2, 3]}

  - id: "fillmissing-1"
    kind: "expr"
    source: "functions.yaml#fillmissing"
    expr: "fillmissing([1, null, 3], 'linear')"
    expect: {"value": [1, 2, 3]}

  - id: "fillmissing-2"
    kind: "expr"
    source: "functions.yaml#fillmissing"
    expr: "fillmissing([null, 2], 'constant', 0)"
    expect: {"value": [0, 2]}

  - id: "interp1-1"
    kind: "expr"
    source: "functions.yaml#interp1"
    expr: "interp1([1, 2, 3], [10, 20, 30], 2.5)"
    expect: {"value": 25}

  - id: "interp1-2"
    kind: "expr"
    source: "functions.yaml#interp1"
    expr: "interp1([1, 2], [10, 20], 5)"
    expect: {"value": null}

  - id: "polyval-1"
    kind: "expr"
    source: "functions.yaml#polyval"
    expr: "polyval([1, 0, -1], 3)"
    expect: {"value": 8}

  - id: "polyval-2"
    kind: "expr"
    source: "functions.yaml#polyval"
    expr: "polyval([2, 1], [0, 1])"
    expect: {"value": [1, 3]}

  - id: "trapz-1"
    kind: "expr"
    source: "functions.yaml#trapz"
    expr: "trapz([1, 2, 3])"
    expect: {"value": 4}

  - id: "trapz-2"
    kind: "expr"
    source: "functions.yaml#trapz"
    expr: "trapz([0, 2], [1, 3])"
    expect: {"value": 4}

  - id: "cumtrapz-1"
    kind: "expr"
    source: "functions.yaml#cumtrapz"
    expr: "cumtrapz([1, 2, 3])"
    expect: {"value": [0, 1.5, 4]}

  - id: "union-1"
    kind: "expr"
    source: "functions.yaml#union"
    expr: "union([1, 2], [2, 3])"
    expect: {"value": [1, 2, 3]}

  - id: "intersect-1"
    kind: "expr"
    source: "functions.yaml#intersect"
    expr: "intersect([1, 2], [2, 3])"
    expect: {"value": [2]}

  - id: "difference-1"
    kind: "expr"
    source: "functions.yaml#difference"
    expr: "difference([1, 2], [2, 3])"
    expect: {"value": [1]}

  - id: "is-member-1"
    kind: "expr"
    source: "functions.yaml#is_member"
    expr: "is_member(2, [1, 2])"
    expect: {"value": true}

  - id: "is-member-2"
    kind: "expr"
    source: "functions.yaml#is_member"
    expr: "is_member([1, 5], [1, 2])"
    expect: {"value": [true, false]}
