rachana: 1.2
fragment: lifecycle-events
version: 1
doc:
  summary: A trade's life as a timeline - booked, amended, fixed, paid, matured.
  description: >-
    One row per event with its date and a name; a detail line and a status word are optional and tone the event. The
    latest events are kept when there are very many.
  category: trading
  tags: [lifecycle, events, timeline]
  use-when:
    - "A trade's life (booked, amended, fixed, paid, matured) is read as a timeline."
  avoid-when:
    - "Record edits by users: use core/audit-trail."
  data:
    table: rows
    in-words: "One row per event: date and event name, optionally detail and status."
    sample-row: { date: "2026-11-20", event: Booked, detail: Booked by the desk, status: Open }
  example: { use: finance/lifecycle-events@1, with: { rows: { from: "$.ev", columns: { date: EV_DATE, event: EV_NAME } } } }
  see-also: [core/event-timeline, core/audit-trail]
  keywords: [lifecycle, trade events, timeline, amend, maturity]
params:
  rows:
    type: table
    required: true
    doc: One row per event
    columns:
      date:   { type: date, doc: When it happened }
      event:  { type: text, doc: What happened }
      detail: { type: text, optional: true, doc: A line of detail }
      status: { type: text, optional: true, doc: A status word that tones the event }
  title: { type: text, default: Lifecycle, doc: The panel's title }
emits:
  - { name: select, payload: { date: date, event: text }, doc: An event was chosen }
panels:
  - id: timeline
    kind: timeline
    title: arg.title
    rows: arg.rows
    date: date
    label: event
    detail: detail
    status: status
    tone: status
    emits: [ { name: select, on: point-click, payload: { date: "@.date", event: "@.event" } } ]
