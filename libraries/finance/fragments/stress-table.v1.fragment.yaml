rachana: 1.2
fragment: stress-table
version: 1
doc:
  summary: Stress scenarios with their P&L, toned by sign, the worst first and highlighted, each with its description.
  description: >-
    One row per scenario. The rows are listed worst first. A click on a row raises an event with the scenario's name.
  category: market-risk
  tags: [stress, scenarios, table]
  use-when:
    - "Stress scenarios are listed worst first with their P&L and description."
  avoid-when:
    - "P&L per scenario and group: use finance/scenario-matrix."
  data:
    table: rows
    in-words: "One row per scenario: scenario, P&L and optionally description."
    sample-row: { scenario: "Rates +100bp", pnl: -125000, description: Parallel shift up of 100bp }
  example: { use: finance/stress-table@1, with: { rows: { from: "$.stress", columns: { scenario: SCEN, pnl: TOTAL_PNL } } } }
  see-also: [finance/scenario-matrix, finance/var-tiles]
  keywords: [stress, scenarios, worst case, "p&l", shock]
params:
  rows:
    type: table
    required: true
    doc: One row per scenario
    columns:
      scenario:    { type: text,   doc: The scenario }
      pnl:         { type: number, doc: The scenario's P&L }
      description: { type: text,   optional: true, doc: What the scenario assumes }
  title: { type: text, default: Stress results, doc: The panel's title }
  fmt:   { type: format, default: signed0, doc: How the P&L is written }
emits:
  - { name: open, payload: { scenario: text }, doc: A scenario was chosen }
panels:
  - id: stress
    kind: table
    title: arg.title
    rows: "map(sort(arg.rows, @.pnl), {scenario: @.scenario, pnl: @.pnl, description: @.description})"
    search: false
    highlight: "@.pnl == min(map(arg.rows, @.pnl))"
    columns:
      - { label: Scenario, bind: "@.scenario" }
      - { label: P&L, bind: "@.pnl", fmt: "%{fmt}", tone: sign }
      - { label: Description, bind: "@.description" }
    emits: [ { name: open, on: row-click, payload: { scenario: "@.scenario" } } ]
