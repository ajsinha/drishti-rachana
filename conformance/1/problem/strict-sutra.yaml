# Harvested by reading Drishti's tests (plan H2); verified by the reference runner (plan H1) unless a case says verified: false.
suite: problem/strict-sutra
since: "1.0"
profile: core
verified: true
description: "Sutras the parser refuses, by code and line; harvested from StrictSutraTest and SutraParserTest."
cases:

  - id: "duplicate-header-key"
    kind: "problem"
    source: "StrictSutraTest#ambiguousYamlIsAProblemWithItsLine"
    sutra: "rachana: 1\nsutra: qa-strict\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.tradeId }\npanels: []\nversion: 2\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2033", "range": {"start": {"line": 7}}}]}

  - id: "duplicate-panel-key"
    kind: "problem"
    source: "StrictSutraTest#ambiguousYamlIsAProblemWithItsLine"
    sutra: "rachana: 1\nsutra: qa-strict\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.tradeId }\npanels:\n  - { id: a, id: b, kind: provenance }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2033"}]}

  - id: "second-yaml-document"
