rachana: 1.2
fragment: limit-table
version: 1
doc:
  summary: Many limits at once - name, limit, used, headroom and the share used, toned at the warning and breach levels.
  description: >-
    One row per limit, listed by share used, the largest first, so breaches come first. The state reads Breach over the
    limit, Warning from the warning share, Within otherwise. A click on a row names the limit.
  category: limits
  tags: [limits, utilisation, table]
  use-when:
    - "Many limits are monitored at once, breaches first, with headroom and share used."
  avoid-when:
    - "One limit deserves a panel with history: use finance/limit-gauge."
  data:
    table: rows
    in-words: "One row per limit: name, limit, used and optionally owner."
    sample-row: { name: Rates Desk, limit: 2500000, used: 1850000, owner: Market Risk }
  example: { use: finance/limit-table@1, with: { rows: { from: "$.limits", columns: { name: LIM_NAME, limit: LIM_AMT, used: USED_AMT } } } }
  see-also: [finance/limit-gauge, finance/risk-hierarchy-tree]
  keywords: [limits, utilisation, breaches, headroom, monitoring]
params:
  rows:
    type: table
    required: true
    live: ok
    doc: One row per limit
    columns:
      name:  { type: text,   doc: The limit's name }
      limit: { type: number, doc: The limit }
      used:  { type: number, doc: The amount used }
      owner: { type: text,   optional: true, doc: Who owns the limit }
  title:   { type: text, default: Limits, doc: The panel's title }
  warn-at: { type: number, default: 0.8, min: 0, max: 1, doc: The share of the limit from which the state is Warning }
  fmt:     { type: format, default: amount0, doc: How the amounts are written }
emits:
  - { name: open, payload: { name: text }, doc: A limit was chosen }
panels:
  - id: limits
    kind: table
    title: arg.title
    rows: "map(sort(arg.rows, @.used / @.limit, true), {name: @.name, owner: @.owner, limit: @.limit, used: @.used, headroom: @.limit - @.used, share: @.used / @.limit, state: if(@.used > @.limit, 'Breach', if(@.used >= arg.warn-at * @.limit, 'Warning', 'Within'))})"
    search: true
    columns:
      - { label: Limit, bind: "@.name" }
      - { label: Owner, bind: "@.owner" }
      - { label: Limit amount, bind: "@.limit", fmt: "%{fmt}" }
      - { label: Used, bind: "@.used", fmt: "%{fmt}" }
      - { label: Headroom, bind: "@.headroom", fmt: "%{fmt}", tone: sign }
      - { label: Share used, bind: "@.share", fmt: pct0 }
      - { label: State, bind: "@.state", tone: status }
    emits: [ { name: open, on: row-click, payload: { name: "@.name" } } ]
