  returns: "boolean"
  nulls: {empty: "an empty date gives empty", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2101", when: "a literal calendar the host does not know - at compile time"}
  description: "Whether d is a business day on the calendar; without a host calendar, weekends are the only non-business days."
  examples:
  - {expr: "is_business_day('2026-11-14')", result: false}
  - {expr: "is_business_day('2026-11-16')", result: true}
