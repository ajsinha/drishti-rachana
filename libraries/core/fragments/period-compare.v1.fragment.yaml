rachana: 1.2
fragment: period-compare
version: 1
doc:
  summary: One measure now against the same measure in a reference period, with the change.
  description: >-
    The figure now, the change against the reference and the reference itself in the caption. The change is toned by its sign;
    pass a fixed tone where down is the good direction (a cost).
  category: figures
  tags: [compare, period, change]
  use-when:
    - "One measure now is compared with the same measure in a reference period (today against yesterday, month against last month)."
  avoid-when:
    - "Many fields of two records are compared: use core/compare-ab."
    - "The whole history matters: use core/series-line."
  data:
    in-words: "Two numbers: the value now and the value in the reference period."
    sample-row: { now: 1000, then: 1000 }
  example: { use: core/period-compare@1, with: { now: "$.sales.MTD", then: "$.sales.MTD_LAST_YEAR", label: Revenue, then-label: last year } }
  see-also: [core/key-figure, core/compare-ab]
  keywords: [compare, change, previous, delta, what changed]
params:
  now:        { type: number, required: true, doc: The measure now }
  then:       { type: number, required: true, doc: The same measure in the reference period }
  label:      { type: text, default: Now, doc: What the measure is }
  then-label: { type: text, default: Before, doc: What the reference period is called }
  fmt:        { type: format, default: amount0, doc: How the measure is written }
  delta-fmt:  { type: format, default: signed0, doc: How the change is written }
  delta-tone: { type: enum, options: [sign, pos, neg, ok, warn, bad, accent], default: sign, doc: "How the change is toned: sign (up is good) or a fixed tone" }
panels:
  - id: compare
    kind: metric
    label: arg.label
    value: arg.now
    fmt: "%{fmt}"
    delta: arg.now - arg.then
    deltaFmt: "%{delta-fmt}"
    deltaTone: "%{delta-tone}"
    caption: "${fmt(arg.then, '%{fmt}')} ${arg.then-label}"
