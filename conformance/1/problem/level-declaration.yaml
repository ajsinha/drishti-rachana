# Written 2026-11-21 (owner decision: the Sutra's rachana: key declares its level, SPEC 2.1).
suite: problem/level-declaration
since: "1.2"
profile: core
verified: true
description: >-
  Rachana 1.x has one language level, 1.2 (levels 1.0 and 1.1 retired in 1.0.0): rachana: 1 and rachana: 1.2 are 1.2, a retired level is
  refused with the way to move the Sutra (use rachana 0.12 upgrade), and a minor no level has is RCH-2009.
cases:
  - id: rachana-1-is-level-1-2
    kind: problem
    source: SPEC 2.1
    sutra: |
      rachana: 1
      sutra: demo
      version: 1
      match: { kind: demo }
      panels:
        - { id: g, kind: grid, rows: $.trades }
    expect:
      ok: true

  - id: rachana-1-0-is-retired
    kind: problem
    source: SPEC 2.1
    sutra: |
      rachana: 1.0
      sutra: demo
      version: 1
      match: { kind: demo }
      panels:
        - { id: m, kind: metric, label: S, value: "1" }
    expect:
      ok: false
      problems:
        - { code: RCH-2009, severity: error }

  - id: rachana-1-1-is-retired
    kind: problem
    source: SPEC 2.1
    sutra: |
      rachana: 1.1
      sutra: demo
      version: 1
      match: { kind: demo }
      panels:
        - { id: m, kind: metric, label: S, value: "1" }
    expect:
      ok: false
      problems:
        - { code: RCH-2009, severity: error }

  - id: a-minor-no-level-has
    kind: problem
    source: SPEC 2.1
    sutra: |
      rachana: 1.7
      sutra: demo
      version: 1
      match: { kind: demo }
      panels:
        - { id: m, kind: metric, label: S, value: "1" }
    expect:
      ok: false
      problems:
        - { code: RCH-2009, severity: error }
