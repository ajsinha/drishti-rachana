# Synthetic demo content: fictional products, regions and figures.
rachana: 1.2
sutra: sales-product
version: 1
title: { id: "'Product: ' + ctl.product" }
description: One product across regions and months, with its range from the Sutra's own rows and a record.
data:
  sales: { table: sales, key: [region, product, month] }
  catalog:                                         # rows written in the file
    rows:
      - { product: Alder Desk,  line: Study,  finish: Oak }
      - { product: Birch Chair, line: Study,  finish: Birch }
      - { product: Cedar Shelf, line: Living, finish: Cedar }
      - { product: Dune Lamp,   line: Living, finish: Brass }
    key: product
  meta:                                            # one record written in the file
    record: { currency: USD, period: H1 2026, source: Synthetic demo data }
controls:
  - { id: product, kind: dropdown, label: Product, options: "unique($.sales[*].product)", default: first }
panels:
  - { id: revenue, kind: metric, label: Revenue, value: "sum($.sales[?@.product == ctl.product], 'revenue')", fmt: amount0, span: 4,
      caption: "${$.meta.currency}, ${$.meta.period}" }
  - { id: units, kind: metric, label: Units, value: "sum($.sales[?@.product == ctl.product], 'units')", fmt: amount0, span: 4 }
  - { id: price, kind: metric, label: Revenue per unit,
      value: "sum($.sales[?@.product == ctl.product], 'revenue') / sum($.sales[?@.product == ctl.product], 'units')",
      fmt: amount0, span: 4 }
  - { id: catalog, kind: kv, title: In the range, span: 4,
      rows: "first($.catalog[?@.product == ctl.product])",
      columns: [ { label: Line, bind: "@.line" }, { label: Finish, bind: "@.finish" } ] }
  - { id: by-region, kind: hbar, title: Revenue by region, rows: "group($.sales[?@.product == ctl.product], 'region', 'revenue')",
      label: label, value: value, fmt: amount0, span: 8 }
  - { id: trend, kind: line, title: Units by month,
      rows: "group($.sales[?@.product == ctl.product], 'month', 'units')", x: label, y: value, fmt: amount0, span: 12 }
  - { id: source, kind: markdown, span: 12, text: "Source: ${$.meta.source}. Figures are fictional." }
