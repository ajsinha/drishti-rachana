# Synthetic demo content.
rachana: 1
sutra: what-if-shocks-full-example
version: 1
libraries: [finance@1]
title: { id: "'What if'" }
data:
  delta:
    key: RISK_FACTOR
    rows:
      - { RISK_FACTOR: rates, PNL_PER_UNIT: -1250 }
      - { RISK_FACTOR: fx, PNL_PER_UNIT: 830 }
      - { RISK_FACTOR: equity, PNL_PER_UNIT: 410 }
  whatif: { record: { ESTIMATE: -18450 } }
state:
  rates: { type: number, default: 0 }
panels:
  - use: finance/what-if-shocks@1
    as: wi
    with:
      title: Shock the book
      sensitivities: { from: $.delta, columns: { factor: RISK_FACTOR, value: PNL_PER_UNIT } }
      shocks:
        - { id: rates, label: "Rates, bp", type: number, min: -100, max: 100 }
        - { id: fx, label: "FX, %", type: number, min: -20, max: 20 }
        - { id: equity, label: "Equity, %", type: number, min: -50, max: 50 }
      estimate: $.whatif.ESTIMATE
      fmt: signed2
    on:
      change:
        - { set: { state: rates, to: event.shocks.rates } }
        - { host: risk.what-if, with: { shocks: event.shocks } }
  - { id: rates-sent, kind: metric, label: Rates shock sent, value: state.rates }
