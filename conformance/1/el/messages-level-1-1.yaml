# The message wording of language level 1.1 (decision N5): the same compile problems as the cases of level 1.0, with the prefix expression '<source>': (SPEC 6.3). Built at level 1.1 (2026-11-21); the two '**' cases left when PY6 made '**' the power.
suite: el/messages-level-1-1
since: "1.1"
profile: core
verified: true
description: "Problem messages with the source prefix, language level 1.1."
cases:

  - id: "dates-bad-yearfrac-start-date-maturity-date-act-999-l11"
    kind: "expr-error"
    since: "1.1"
    verified: true
    source: "DateFunctionsTest#yearfracIsDecimalAndChecksItsBasis"
    note: "Message contains: \"yearfrac: unknown day-count basis 'ACT/999'\"; 'ACT/360, ACT/365F, 30/360, 30E/360, ACT/ACT'."
    expr: "yearfrac($.START_DATE, $.MATURITY_DATE, 'ACT/999')"
    expect: {"problems": [{"code": "RCH-2101", "messageStart": "expression 'yearfrac($.START_DATE, $.MATURITY_DATE, 'ACT/999')': "}]}
    given: {"record": {"TRADE_ID": "MX-20000001", "PRODUCT_TYPE": "ComSwap", "DESK": "DESK-COMM", "TT_BOOK": "BOOK-RATES-3", "QUANTITY": 242000000, "PRICE": 0.040829, "DIRECTION": "SHORT", "TRADE_DATE": "2025-11-21", "START_DATE": "2025-11-25", "MATURITY_DATE": "2032-06-25", "INSTRUMENT": "USD 2026-10 swap", "TAGS": "ir,swap,,aud", "LEG_ID": "7", "STRATEGY": null, "BLANK": "", "TEXTNUM": "12.5", "BASIS": "ACT/999", "DESKS": ["DESK-COMM", "DESK-RATES"], "LEGS": [{"LEG_ID": 1, "LEG_TYPE": "FIXED", "NOTIONAL": 242000000, "CURRENCY": "AUD"}, {"LEG_ID": 2, "LEG_TYPE": "FLOAT", "NOTIONAL": 242000000, "CURRENCY": "AUD"}], "EVENTS": [{"EVENT_TYPE": "BOOKED", "EVENT_DATE": "2025-11-21"}, {"EVENT_TYPE": "AMENDED", "EVENT_DATE": "2026-03-02"}, {"EVENT_TYPE": "CASH_SETTLEMENT", "EVENT_DATE": "2026-01-15", "AMOUNT": -1500.25}], "NUMS": [3, 1.5, "2", 10], "MIXED": [1, "1", 1.0, "a", "a"], "UNDATED": [{"ID": "a", "D": "2026-02-01"}, {"ID": "b"}, {"ID": "c", "D": "2026-01-01"}], "MTM": {"$masked": true}, "MASKED_LIST": {"$masked": true}, "PVS": [{"PV": 5}, {"PV": {"$masked": true}}]}, "today": "2026-10-16"}

