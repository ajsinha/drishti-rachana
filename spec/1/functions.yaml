  since: "1.0"
- name: dollarfr
  family: finance
  signature: "dollarfr(price, fraction)"
  eval: eager
  params:
  - {name: "price", type: "number"}
  - {name: "fraction", type: "integer"}
  returns: "decimal"
  nulls: {empty: "an empty argument, or a list with an empty element, gives empty (a missing flow is never skipped)", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number, or a list longer than 100,000 values"}
  - {code: "RCH-2102", when: "the fraction is under 1"}
  description: "A decimal price written in fractions; exact in decimal. Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
  - {expr: "dollarfr(1.125, 16)", result: 1.02}
