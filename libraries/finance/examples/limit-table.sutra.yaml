# Synthetic demo content.
rachana: 1.2
sutra: limit-table-example
version: 1
libraries: [finance@1]
title: { id: "'Limit table'" }
data:
  limits:
    rows:
      - { LIM_NAME: VaR firm, LIM_AMT: 2500000, USED_AMT: 1850000 }
      - { LIM_NAME: Credit desk, LIM_AMT: 1000000, USED_AMT: 1100000 }
panels:
  - use: finance/limit-table@1
    as: limits
    with:
      rows: { from: $.limits, columns: { name: LIM_NAME, limit: LIM_AMT, used: USED_AMT } }
  - { id: picked, kind: markdown, text: "Limit ${@limits.open.name}", waits: limits-limits }
