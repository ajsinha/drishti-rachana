rachana: 1.2
fragment: scenario-matrix
version: 1
doc:
  summary: Scenarios down the side, books or factors across, P&L in the cells, shaded by size.
  description: >-
    One row per scenario and group. Rows run in the order given, so sort them worst first to put the worst scenario at
    the top. Use it for stress or scenario results by book, desk or factor.
  category: market-risk
  tags: [scenarios, stress, matrix]
  use-when:
    - "Stress or scenario P&L is read by scenario and book or factor, shaded by size."
  avoid-when:
    - "One P&L per scenario: use finance/stress-table."
  data:
    table: rows
    in-words: "One row per scenario and group: scenario, group and P&L."
    sample-row: { scenario: "Rates +100bp", group: Financials, pnl: -125000 }
  example: { use: finance/scenario-matrix@1, with: { rows: { from: "$.stress", columns: { scenario: SCEN, group: DESK, pnl: RES_PNL } } } }
  see-also: [finance/stress-table, core/pivot-table]
  keywords: [scenarios, stress, matrix, "p&l", heat map]
params:
  rows:
    type: table
    required: true
    doc: One row per scenario and group
    columns:
      scenario: { type: text,   doc: The scenario }
      group:    { type: text,   doc: "The book, desk or factor" }
      pnl:      { type: number, doc: The P&L }
  title: { type: text, default: Scenarios, doc: The panel's title }
  fmt:   { type: format, default: signed0, doc: How the P&L is written }
  heat:  { type: boolean, default: true, doc: Whether cells are shaded by size }
emits:
  - { name: cell, payload: { scenario: text, group: text }, doc: A cell was chosen }
panels:
  - id: matrix
    kind: pivot
    title: arg.title
    rows: arg.rows
    by: scenario
    across: group
    value: pnl
    agg: sum
    fmt: "%{fmt}"
    heat: arg.heat
    emits: [ { name: cell, on: point-click, payload: { scenario: "@.row", group: "@.column" } } ]
