# Synthetic demo content.
rachana: 1.2
sutra: live-blotter-example
version: 1
libraries: [finance@1]
title: { id: "'Live blotter'" }
data:
  orders: { table: orders, key: ORDER_ID, live: true }
panels:
  - use: finance/live-blotter@1
    with:
      rows: $.orders
      order: CHANGED_AT
      columns: [ { label: Order, bind: "@.ORDER_ID" }, { label: Status, bind: "@.STATUS", tone: status } ]
