# Synthetic demo content.
rachana: 1.2
sutra: trade-blotter-example
version: 1
libraries: [finance@1]
title: { id: "'Trade blotter'" }
data:
  trades:
    rows:
      - { TRADE_ID: T-1001, PRODUCT: Swap }
      - { TRADE_ID: T-1002, PRODUCT: Forward }
panels:
  - use: finance/trade-blotter@1
    as: blotter
    with:
      rows: { from: $.trades, columns: { id: TRADE_ID, product: PRODUCT } }
  - { id: picked, kind: markdown, text: "Trade ${@blotter.open.id}", waits: blotter-blotter }
