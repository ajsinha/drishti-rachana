    rows:
      - { K: DESK-A, M: VaR, B: 5200000, A: 6100000, C: 900000, W: "RF-USD-10Y 71%, rolled window 29%", O: "WHY DESK-A" }
      - { K: T-88123, M: Trade, C: 0, W: New trade booked at 16:42, O: "TRADE T-88123", KD: new trade }
