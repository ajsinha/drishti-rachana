# Synthetic demo content.
rachana: 1.2
sutra: record-card-plain-example
version: 1
libraries: [core@1]
title: { id: "'Plain record'" }
data:
  company: { rows: [ { FOUNDED: 1999, STAFF: 4200, SECTOR: Energy } ] }
  shown: { rows: [ { ok: true } ] }
panels:
  - use: core/record-card@1
    with:
      record: "$.company[0]"
      title: Company facts
      facts: [ { label: Founded, bind: "@.FOUNDED" }, { label: Employees, bind: "@.STAFF", fmt: amount0 }, { label: Sector, bind: "@.SECTOR" } ]
      key: F3
      code: CO
      when: "$.shown[0].ok"
