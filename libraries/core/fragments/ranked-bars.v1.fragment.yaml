rachana: 1.2
fragment: ranked-bars
version: 1
doc:
  summary: One horizontal bar a row, labelled and sized by a value.
  description: >-
    Rows are drawn in the order given: sort them largest first to rank them. A click on a bar raises an event with its
    label and value.
  category: charts
  tags: [bars, ranking, breakdown]
  use-when:
    - "Named items are ranked by one measure (top desks, top counterparties)."
  avoid-when:
    - "The parts make up a whole and shares matter: use core/donut-breakdown."
    - "The values are P&L with signs: use finance/pnl-attribution-bars."
  data:
    table: rows
    in-words: "One row per bar: a label and a value, sorted the way they should be drawn."
    sample-row: { label: Rates, value: 1250000 }
  example: { use: core/ranked-bars@1, with: { title: Revenue by region, rows: { from: "$.sales", columns: { label: REGION, value: REVENUE } } } }
  see-also: [finance/pnl-attribution-bars, core/donut-breakdown, core/data-table]
  keywords: [bars, ranking, top n, by, compare]
params:
  rows:
    type: table
    required: true
    doc: One row per bar
    columns:
      label: { type: text,   doc: The bar's label }
      value: { type: number, doc: The bar's value }
  title: { type: text, default: Ranking, doc: The panel's title }
  fmt:   { type: format, default: amount0, doc: How the values are written }
  tone:  { type: enum, options: [accent, sign, ok, warn, bad, pos, neg], default: accent, doc: How the bars are toned }
emits:
  - { name: bar, payload: { label: text, value: number }, doc: A bar was chosen }
panels:
  - id: bars
    kind: hbar
    title: arg.title
    rows: arg.rows
    label: label
    value: value
    fmt: "%{fmt}"
    tone: "%{tone}"
    emits: [ { name: bar, on: bar-click, payload: { label: "@.label", value: "@.value" } } ]
