  - id: "sign-1"
    kind: "expr"
    source: "functions.yaml#sign"
    expr: "sign(-12)"
    expect: {"value": -1}

  - id: "sign-2"
    kind: "expr"
    source: "functions.yaml#sign"
    expr: "sign(0)"
    expect: {"value": 0}

  - id: "sqrt-1"
    kind: "expr"
    source: "functions.yaml#sqrt"
    expr: "sqrt(0.0144)"
    expect: {"value": 0.12, "tolerance": {"abs": 1e-09}}

  - id: "sqrt-2"
    kind: "expr"
    source: "functions.yaml#sqrt"
    expr: "sqrt(16)"
    expect: {"value": 4}

  - id: "exp-1"
    kind: "expr"
    source: "functions.yaml#exp"
    expr: "exp(0)"
