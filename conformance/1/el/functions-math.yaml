# Generated from the examples of spec/1/functions.yaml (plan H5); a function's example is its case. Do not edit by hand: edit the example.
suite: el/functions-math
since: "1.0"
profile: core
verified: true
description: "The examples of the math functions of functions.yaml."
given: {"today": "2026-10-16"}
cases:

  - id: "abs-1"
    kind: "expr"
    source: "functions.yaml#abs"
    expr: "abs(-3.5)"
