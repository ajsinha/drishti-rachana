suite: problem/fragments-gaps
since: "1.2"
profile: core
verified: true
description: "Typed fragments, the gaps the core library found (G2 lane A6): problems of renames over derived rows, list<record> and record parameters, dynamic text parameters and events beyond rows and bars; level 1.2."
cases:

  - id: field-option-over-rows-the-mapping-cannot-follow
    kind: problem
    source: L-21 (3), never silent (RCH-2121)
    files:
      grouped.v1.fragment.yaml: |
        rachana: 1
        fragment: grouped
        version: 1
        doc:
          summary: Desks as bars over rows the fragment reshapes.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - { id: bars, kind: hbar, rows: "map(arg.rows, @)", label: desk, value: amount }
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: grouped@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      ok: false
      problems:
      - code: RCH-2121
        severity: error
        message: "fragment grouped names column desk of table rows over rows derived from it that the caller's mapping cannot follow ('map(arg.rows, @)'): read the table's own rows (arg.rows, filtered or through sort, take, drop, unique), or reshape them to fixed names (map(arg.rows, {label: @.desk}))"
        file: grouped.v1.fragment.yaml
        path: "/panels/0/label"
        range: { start: { line: 15, column: 62 } }
      - code: RCH-2121
        severity: error
        message: "fragment grouped names column amount of table rows over rows derived from it that the caller's mapping cannot follow ('map(arg.rows, @)'): read the table's own rows (arg.rows, filtered or through sort, take, drop, unique), or reshape them to fixed names (map(arg.rows, {label: @.amount}))"
        file: grouped.v1.fragment.yaml
        path: "/panels/0/value"
        range: { start: { line: 15, column: 75 } }

  - id: list-of-records-checked-item-by-item
    kind: problem
    source: LIBRARIES 4.2 (list<record{...}>, RCH-2116)
    files: &badges
      badges.v1.fragment.yaml: |
        rachana: 1
        fragment: badges
        version: 1
        doc:
          summary: A row of named figures.
        params:
          items:
            type: "list<record{label: text, value: number, tone: text?}>"
            required: true
            max: 2
            doc: The figures, each a label and a value
          totals:
            type: "record{count: integer, sum: number}"
            default: { count: 0, sum: 0 }
            doc: Counted and summed elsewhere
        panels:
          - { id: count, kind: metric, label: Count, value: "size(arg.items) + arg.totals.count" }
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - use: badges@1
          with: { items: [ { label: Cash, value: 1 }, { label: Bonds, value: high } ] }
        - use: badges@1
          with: { items: [ { label: Cash, value: 1, colour: red } ] }
        - use: badges@1
          with: { items: [ { value: 1 } ] }
        - use: badges@1
          with: { items: [ { label: A, value: 1 }, { label: B, value: 2 }, { label: C, value: 3 } ] }
        - use: badges@1
          with: { items: [], totals: { count: 1.5, sum: 0 } }
        - use: badges@1
          with: { items: { label: A, value: 1 } }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "parameter items of fragment badges item 2 field value is a number, not 'high'"
        range: { start: { line: 8, column: 20 } }
      - code: RCH-2116
        severity: error
        message: "parameter items of fragment badges item 1 has no field 'colour' (it has label, value, tone)"
        range: { start: { line: 10, column: 20 } }
      - code: RCH-2116
        severity: error
        message: "parameter items of fragment badges item 1 needs field label (text)"
        range: { start: { line: 12, column: 20 } }
      - code: RCH-2116
        severity: error
        message: "parameter items of fragment badges has at most 2 items, not 3"
        range: { start: { line: 14, column: 20 } }
      - code: RCH-2116
        severity: error
        message: "parameter totals of fragment badges field count is a whole number, not '1.5'"
        range: { start: { line: 16, column: 32 } }
      - code: RCH-2116
        severity: error
        message: "parameter items of fragment badges is a list (list<record{label: text, value: number, tone: text?}>), not a mapping"
        range: { start: { line: 18, column: 20 } }

  - id: record-and-list-types-declared
    kind: problem
    source: LIBRARIES 4.2 (value types)
    files:
      bad-types.v1.fragment.yaml: |
        rachana: 1
        fragment: bad-types
        version: 1
        doc:
          summary: Types a fragment may not declare.
        params:
          nested: { type: "record{inner: record{a: text}}", optional: true, doc: A record in a record }
          deep: { type: "list<list<record{a: text}>>", optional: true, doc: A list of lists of records }
          loose: { type: "record{a text}", optional: true, doc: A field without its type }
        panels:
          - { id: one, kind: metric, label: One, value: "1" }
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - use: bad-types@1
    expect:
      ok: false
      problems:
      - code: RCH-2048
        severity: error
        message: "parameter nested of fragment bad-types has type 'record{inner: record{a: text}}': a value type ([boolean, date, datetime, decimal, duration, integer, money, number, text], list<T>, record{...}, T?, fn(T, ...) -> U with one name or more), a name type ([area, columns, enum, format, icon, id, key, palette, tone, variant]) or table"
        file: bad-types.v1.fragment.yaml
        path: "/params/nested/type"
        range: { start: { line: 7, column: 19 } }
      - code: RCH-2048
        severity: error
        message: "parameter deep of fragment bad-types has type 'list<list<record{a: text}>>': a value type ([boolean, date, datetime, decimal, duration, integer, money, number, text], list<T>, record{...}, T?, fn(T, ...) -> U with one name or more), a name type ([area, columns, enum, format, icon, id, key, palette, tone, variant]) or table"
        file: bad-types.v1.fragment.yaml
        path: "/params/deep/type"
        range: { start: { line: 8, column: 17 } }
      - code: RCH-2048
        severity: error
        message: "parameter loose of fragment bad-types has type 'record{a text}': a value type ([boolean, date, datetime, decimal, duration, integer, money, number, text], list<T>, record{...}, T?, fn(T, ...) -> U with one name or more), a name type ([area, columns, enum, format, icon, id, key, palette, tone, variant]) or table"
        file: bad-types.v1.fragment.yaml
        path: "/params/loose/type"
        range: { start: { line: 9, column: 18 } }
      - code: RCH-2048
        severity: error
        message: "no block bad-types@1 (no block files are loaded)"
        range: { start: { line: 7, column: 5 } }

  - id: dynamic-text-only-on-text
    kind: problem
    source: "LIBRARIES 4.2 (text, dynamic: true)"
    files:
      banner.v1.fragment.yaml: |
        rachana: 1
        fragment: banner
        version: 1
        doc:
          summary: A message.
        params:
          message: { type: text, dynamic: true, default: All clear, doc: The message }
          count: { type: number, dynamic: true, default: 0, doc: Not a text }
        panels:
          - { id: msg, kind: markdown, text: arg.message }
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - use: banner@1
          with: { message: "Row ${@.id} of ${#index}" }
    expect:
      ok: false
      problems:
      - code: RCH-2048
        severity: error
        message: "parameter count of fragment banner: dynamic: true is for a text parameter (the use may write a template)"
        file: banner.v1.fragment.yaml
        path: "/params/count/dynamic"
        range: { start: { line: 8, column: 35 } }
      - code: RCH-2048
        severity: error
        message: "no block banner@1 (no block files are loaded)"
        range: { start: { line: 7, column: 5 } }

  - id: dynamic-text-reads-only-the-screen
    kind: problem
    source: "LIBRARIES 4.2 (text, dynamic: true)"
    files:
      banner.v1.fragment.yaml: |
        rachana: 1
        fragment: banner
        version: 1
        doc:
          summary: A message.
        params:
          message: { type: text, dynamic: true, default: All clear, doc: The message }
        panels:
          - { id: msg, kind: markdown, text: arg.message }
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - use: banner@1
          with: { message: "Row ${@.id} of ${#index}" }
    expect:
      ok: false
      problems:
      - code: RCH-2116
        severity: error
        message: "parameter message of fragment banner is a template read in your screen's context: its parts read the screen, not @, ^ or #index (inside the fragment they are the fragment's rows, not yours): 'Row ${@.id} of ${#index}'"
        range: { start: { line: 8, column: 22 } }

  - id: point-click-only-on-marks
    kind: problem
    source: SUTRA_EXPANSION I1 (point-click, the kinds that fire it)
    sutra: |
      rachana: 1
      sutra: gaps-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      panels:
        - { id: bars, kind: hbar, rows: "[{label: 'a', value: 1}]", emits: [ { name: pick, on: point-click } ] }
        - { id: note, kind: markdown, text: Hi, emits: [ { name: pick, on: point-click } ] }
        - { id: line, kind: line, rows: "[{x: 'a', y: 1}]", x: x, y: y, emits: [ { name: pick, on: cell-click } ] }
    expect:
      ok: false
      problems:
      - code: RCH-2057
        severity: error
        message: "event pick: a hbar panel cannot fire on point-click (point-click: area, candlestick, gauge, kv, line, metric, pivot, scatter, status, surface, timeline, treemap, waterfall; row-click: table, ladder; bar-click: hbar)"
        range: { start: { line: 7, column: 90 } }
      - code: RCH-2057
        severity: error
        message: "event pick: a markdown panel cannot fire on point-click (point-click: area, candlestick, gauge, kv, line, metric, pivot, scatter, status, surface, timeline, treemap, waterfall; row-click: table, ladder; bar-click: hbar)"
        range: { start: { line: 8, column: 70 } }
      - code: RCH-2057
        severity: error
        message: "event pick: 'on' is what fires it, one of bar-click, point-click, row-click, not 'cell-click' (select, submit, load and tick come in later phases)"
        range: { start: { line: 9, column: 94 } }
