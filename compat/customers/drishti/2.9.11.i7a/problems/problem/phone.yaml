# Harvested by reading Drishti's tests (plan H2); verified by the reference runner (plan H1) unless a case says verified: false.
suite: problem/phone
since: "1.0"
profile: [core, drishti]
verified: true
description: "Phone display tiers and options, and the span and height grammar of a panel; harvested from PhoneReaderTest and SutraLayoutEditorTest."
cases:

  - id: "phone-tiers-options-and-screen-block-valid"
    kind: "problem"
    source: "PhoneReaderTest#aPanelsTierAndCompactOptionsAndTheScreensBlockAreRead"
    sutra: "rachana: 1\nsutra: nset\nversion: 1\nmatch: { kind: netting-set }\ntitle: { id: $.ID }\nphone:\n  order: [trades, header]\n  default: more\n  summary: \"Net {$.MTM}\"\npanels:\n  - { id: header, kind: kv, columns: [ { label: MTM, bind: $.MTM } ], phone: must }\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.ID\" }, { label: MTM, bind: \"@.MTM\" } ]\n    phone: { tier: glance, rows: 5, columns: [Trade, MTM], sort: -MTM }\n  - { id: notes, kind: markdown, text: hi, phone: desk }\n  - { id: built, kind: provenance }\n"
    expect: {"ok": true, "problems": []}

  - id: "phone-word-not-a-tier"
    kind: "problem"
    source: "PhoneReaderTest#aWordThatIsNotATierOrAnOptionThatDoesNotFitTheKindIsDrs2059"
    sutra: "rachana: 1\nsutra: nset\nversion: 1\nmatch: { kind: netting-set }\ntitle: { id: $.ID }\npanels:\n  - { id: a, kind: kv, columns: [ { label: A, bind: $.A } ], phone: always }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2059", "severity": "error", "message": "'always' is not a phone tier; write must, glance, more or desk", "range": {"start": {"line": 7, "column": 69}}}]}

  - id: "phone-option-does-not-fit-kind"
    kind: "problem"
    source: "PhoneReaderTest#aWordThatIsNotATierOrAnOptionThatDoesNotFitTheKindIsDrs2059"
    sutra: "rachana: 1\nsutra: nset\nversion: 1\nmatch: { kind: netting-set }\ntitle: { id: $.ID }\npanels:\n  - { id: a, kind: kv, columns: [ { label: A, bind: $.A } ], phone: { tier: glance, rows: 5 } }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2059", "severity": "error", "message": "'rows' is a compact option of hbar, ladder, links, map, table, timeline, waterfall panels, not of a kv panel", "range": {"start": {"line": 7, "column": 91}}}]}

  - id: "phone-order-names-a-desk-panel"
    kind: "problem"
    source: "PhoneReaderTest#aWordThatIsNotATierOrAnOptionThatDoesNotFitTheKindIsDrs2059"
    sutra: "rachana: 1\nsutra: nset\nversion: 1\nmatch: { kind: netting-set }\ntitle: { id: $.ID }\nphone: { order: [notes] }\npanels:\n  - { id: header, kind: kv, columns: [ { label: MTM, bind: $.MTM } ], phone: must }\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.ID\" }, { label: MTM, bind: \"@.MTM\" } ]\n    phone: { tier: glance, rows: 5, columns: [Trade, MTM], sort: -MTM }\n  - { id: notes, kind: markdown, text: hi, phone: desk }\n  - { id: built, kind: provenance }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2059", "severity": "error", "message": "phone.order names 'notes', a desk panel; the order arranges only must and glance panels", "range": {"start": {"line": 6, "column": 8}}}]}

  - id: "phone-order-names-no-panel"
    kind: "problem"
    source: "PhoneReaderTest#aWordThatIsNotATierOrAnOptionThatDoesNotFitTheKindIsDrs2059"
    sutra: "rachana: 1\nsutra: nset\nversion: 1\nmatch: { kind: netting-set }\ntitle: { id: $.ID }\nphone: { order: [nothing] }\npanels:\n  - { id: header, kind: kv, columns: [ { label: MTM, bind: $.MTM } ], phone: must }\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.ID\" }, { label: MTM, bind: \"@.MTM\" } ]\n    phone: { tier: glance, rows: 5, columns: [Trade, MTM], sort: -MTM }\n  - { id: notes, kind: markdown, text: hi, phone: desk }\n  - { id: built, kind: provenance }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2059", "severity": "error", "message": "phone.order names 'nothing', which is not a panel of this screen", "range": {"start": {"line": 6, "column": 8}}}]}

  - id: "span-and-height-in-range-valid"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, span: 6, height: 24 }\n"
    expect: {"ok": true, "problems": []}

  - id: "span-zero-is-rch-2030"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, span: 0 }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "span must be a whole number from 1 to 12 (columns of the 12-column grid), not '0'", "range": {"start": {"line": 6, "column": 45}}}]}

  - id: "span-13-is-rch-2030"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, span: 13 }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "span must be a whole number from 1 to 12 (columns of the 12-column grid), not '13'", "range": {"start": {"line": 6, "column": 45}}}]}

  - id: "span-not-a-number-is-rch-2030"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, span: wide }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "span must be a whole number from 1 to 12 (columns of the 12-column grid), not 'wide'", "range": {"start": {"line": 6, "column": 45}}}]}

  - id: "height-25-is-rch-2030"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, height: 25 }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "height must be a whole number from 1 to 24 (grid rows), not '25'", "range": {"start": {"line": 6, "column": 47}}}]}

  - id: "height-not-whole-is-rch-2030"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: a, kind: markdown, text: A, height: 2.5 }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "height must be a whole number from 1 to 24 (grid rows), not '2.5'", "range": {"start": {"line": 6, "column": 47}}}]}

  - id: "tabs-body-takes-its-panels-size"
    kind: "problem"
    source: "SutraLayoutEditorTest#theGrammarChecksSpanAndHeight"
    sutra: "rachana: 1\nsutra: s-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: t, kind: tabs, each: $.legs, body: { kind: kv, span: 4 } }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2030", "severity": "error", "message": "'span' sizes a whole panel: a tabs body takes the size of its panel", "range": {"start": {"line": 6, "column": 64}}}]}
