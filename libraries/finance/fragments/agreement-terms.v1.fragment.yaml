rachana: 1.2
fragment: agreement-terms
version: 1
doc:
  summary: The terms of a collateral agreement - thresholds, minimum transfer amounts, independent amounts, currency, frequency.
  description: >-
    Build the terms record from your own fields with a record literal; every field is optional and a missing one is
    left blank. The thresholds and minimum transfer amounts are given per side.
  category: counterparty
  tags: [agreement, collateral, terms]
  use-when:
    - "The terms of a collateral agreement (CSA) are read: thresholds, MTAs, independent amount, currency, frequency."
  avoid-when:
    - "Collateral balances are wanted: use finance/collateral-ledger."
  data:
    table: terms
    in-words: "One record of agreement terms, each field optional."
    sample-row: { type: Coupon, threshold_us: 1000, threshold_them: 1000, mta_us: 1000, mta_them: 1000, independent_amount: 1000, currency: USD, frequency: Quarterly }
  example: { use: finance/agreement-terms@1, with: { terms: "{type: $.ag.AG_TYPE, currency: $.ag.AG_CCY}" } }
  see-also: [finance/collateral-ledger, finance/margin-call-ladder]
  keywords: [csa, collateral agreement, threshold, mta, terms]
params:
  terms:
    type: "record{type: text, threshold_us: number, threshold_them: number, mta_us: number, mta_them: number, independent_amount: number, currency: text, frequency: text}"
    required: true
    doc: "The terms: type, threshold_us, threshold_them, mta_us, mta_them, independent_amount, currency, frequency"
  title: { type: text, default: Agreement terms, doc: The panel's title }
  fmt:   { type: format, default: amount0, doc: How amounts are written }
panels:
  - id: terms
    kind: kv
    title: arg.title
    rows: arg.terms
    columns:
      - { label: Type, bind: "@.type" }
      - { label: Threshold (ours), bind: "@.threshold_us", fmt: "%{fmt}" }
      - { label: Threshold (theirs), bind: "@.threshold_them", fmt: "%{fmt}" }
      - { label: Minimum transfer (ours), bind: "@.mta_us", fmt: "%{fmt}" }
      - { label: Minimum transfer (theirs), bind: "@.mta_them", fmt: "%{fmt}" }
      - { label: Independent amount, bind: "@.independent_amount", fmt: "%{fmt}" }
      - { label: Currency, bind: "@.currency" }
      - { label: Frequency, bind: "@.frequency" }
