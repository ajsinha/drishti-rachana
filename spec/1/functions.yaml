  - {code: "RCH-2102", when: "the fraction is under 1"}
  description: "A price written in fractions as a decimal (1.02 with 16: one and 2/16 is 1.125); exact in decimal. Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
