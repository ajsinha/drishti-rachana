# Written by hand from the 1.0 decisions of 2026-11-19 (EL_EXPANSION XD2 to XD4); verified: false until the reference changes after v0.10.0 is pinned (SPLIT_PLAN rule 4; el/KNOWN_DIFFERENCES.md).
suite: grammar/reserved
since: "1.0"
profile: core
verified: false
description: "The reserved tokens of rachana-el.ebnf (SPEC 4.15): refused wherever an expression stands, characters inside a text, and the near spellings that stay valid."
cases:

  - id: "pipe-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X11."
    tags: ["reserved"]
    text: "$.a |> f($.b)"
    expect: {"accepted": false}

  - id: "empty-default-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X12."
    tags: ["reserved"]
    text: "$.a ?? 0"
    expect: {"accepted": false}

  - id: "arrow-refused"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X13."
    tags: ["reserved"]
    text: "map($.l, x => x)"
    expect: {"accepted": false}

  - id: "spread-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X6."
    tags: ["reserved"]
    text: "[...$.l]"
    expect: {"accepted": false}

  - id: "range-refused"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X7."
    tags: ["reserved"]
    text: "$.a[1..2]"
    expect: {"accepted": false}

  - id: "empty-record-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X6."
    tags: ["reserved"]
    text: "{}"
    expect: {"accepted": false}

  - id: "comment-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "X14."
    tags: ["reserved"]
    text: "$.a /* c */"
    expect: {"accepted": false}

  - id: "digit-separator-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "Digit separators."
    tags: ["reserved"]
    text: "1_000"
    expect: {"accepted": false}

  - id: "reserved-tokens-in-a-string-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "Inside quotes they are characters."
    tags: ["reserved"]
    text: "'|> ?? => .. { } /* */ 1_000'"
    expect: {"accepted": true}

  - id: "or-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "'||' is the operator."
    tags: ["reserved"]
    text: "$.a || $.b"
    expect: {"accepted": true}

  - id: "conditional-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "One '?' is the conditional."
    tags: ["reserved"]
    text: "$.a ? $.b : $.c"
    expect: {"accepted": true}

  - id: "filter-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "'[?' is the filter opener."
    tags: ["reserved"]
    text: "$.a[?@.x > 1]"
    expect: {"accepted": true}

  - id: "numbers-with-points-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "A single point in a number."
    tags: ["reserved"]
    text: ".5 + 1. + 1.5"
    expect: {"accepted": true}

  - id: "underscore-in-a-name-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    note: "'_' is reserved inside numbers only."
    tags: ["reserved"]
    text: "$.a_1 + _b"
    expect: {"accepted": true}

  - id: "braces-in-template-text-accepted"
    kind: "grammar"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    rule: "template"
    note: "A lone brace outside a part is template text."
    tags: ["reserved"]
    text: "Total {x}: ${size($.a)}"
    expect: {"accepted": true}

  - id: "reserved-token-in-a-template-part-refused"
    kind: "grammar"
    until: "1.0"
    source: "SPEC 4.15; rachana-el.ebnf reserved-token"
    rule: "template"
    note: "A part is an expression."
    tags: ["reserved"]
    text: "Total ${$.a ?? 0}"
    expect: {"accepted": false}

  - id: "pipe-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "X11: the pipe is level 1.1's (DECISIONS PY2); its right side is a call. The 1.0 answer is pipe-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "$.a |> round(2)"
    expect: {"accepted": true}

  - id: "empty-default-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "X12: the first non-empty is level 1.1's. The 1.0 answer is empty-default-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "$.a ?? 0"
    expect: {"accepted": true}

  - id: "spread-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "X6: a list spread is level 1.1's. The 1.0 answer is spread-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "[...$.l]"
    expect: {"accepted": true}

  - id: "empty-record-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "X6: a record literal is level 1.1's. The 1.0 answer is empty-record-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "{}"
    expect: {"accepted": true}

  - id: "comment-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "Level 1.1 reads a comment. The 1.0 answer is comment-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "$.a /* c */"
    expect: {"accepted": true}

  - id: "digit-separator-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    note: "Level 1.1 reads a digit separator. The 1.0 answer is digit-separator-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "1_000"
    expect: {"accepted": true}

  - id: "reserved-token-in-a-template-part-accepted-l11"
    kind: "grammar"
    since: "1.1"
    source: "SPEC 4.15; DECISIONS PY2 to PY6 (level 1.1)"
    rule: "template"
    note: "A part is an expression; level 1.1 reads ??. The 1.0 answer is reserved-token-in-a-template-part-refused (until 1.0)."
    tags: ["reserved", "level-1-1"]
    text: "Total ${$.a ?? 0}"
    expect: {"accepted": true}
