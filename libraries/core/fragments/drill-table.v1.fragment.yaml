rachana: 1.2
fragment: drill-table
version: 1
doc:
  summary: A table that groups its rows by a list of levels, outermost first, and opens down them in place.
  description: >-
    Name the level columns of your rows, outermost first, and give the columns to show: the level columns and the
    measures. A measure column marked total is added up for each group.
  category: tables
  tags: [table, drill, group, levels]
  use-when:
    - "Rows are grouped by levels (region, desk, book) and the reader opens groups in place with totals."
  avoid-when:
    - "The hierarchy is given as parent links: use core/tree-table."
    - "Two fields cross-tabulate one measure: use core/pivot-table."
  data:
    table: rows
    in-words: Rows at any grain with level columns (outermost first) and measure columns to total.
    sample-row: { REGION: Europe, COUNTRY: France, REVENUE: 120 }
  example: { use: core/drill-table@1, with: { title: Sales, rows: "$.sales", levels: [REGION, COUNTRY], columns: [{ label: Region, bind: "@.REGION" }, { label: Country, bind: "@.COUNTRY" }, { label: Revenue, bind: "@.REVENUE", fmt: amount0, total: true }] } }
  see-also: [core/tree-table, core/pivot-table, core/data-table]
  keywords: [drill, group, hierarchy, subtotal, outline]
params:
  rows:
    type: table
    required: true
    doc: Rows holding every level column and measure
    columns:
      key: { type: text, optional: true, doc: "A key column, when the rows have one" }
  levels:  { type: columns, required: true, doc: "The columns that group the rows, outermost first: a list of your own column names" }
  columns: { type: columns, required: true, doc: "The columns: the levels and the measures, each { label, bind: \"@.field\", fmt, total }" }
  title:   { type: text, default: Drill, doc: The panel's title }
panels:
  - id: drill
    kind: grid
    title: arg.title
    rows: arg.rows
    group: "%{levels}"
    columns: "%{columns}"
