  - id: "is-date-trade-date"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_date($.TRADE_DATE)"
    expect: {"value": true, "type": "boolean"}

  - id: "is-date-desk"
    kind: "expr"
    source: "MoreScalarsTest#informationAndChoice"
    expr: "is_date($.DESK)"
