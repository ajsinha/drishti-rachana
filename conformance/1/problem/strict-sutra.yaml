  - id: "chart-options-of-the-wrong-value"
    kind: "problem"
    source: "SutraParserTest#theChartAndAggregateKindsParseAndRejectValuesTheyDoNotAllow"
    note: "Pins the count of RCH-2029 problems found by the reference (six); the words are not pinned."
    sutra: "rachana: 1\nsutra: bad-charts\nversion: 1\nmatch: { kind: trade }\npanels:\n  - { id: p, kind: pivot, rows: $.positions, by: book, across: currency, agg: median, heat: yes please }\n  - { id: h, kind: histogram, rows: $.scenarios, bins: 0, markers: [ { label: VaR } ] }\n  - { id: g, kind: graph, nodes: $.n, layout: circle }\n  - { id: s, kind: scatter, rows: $.books, x: var }\n  - { id: w, kind: waterfall, rows: $.explain, colors: rainbow }\n"
    expect: {"ok": false}
