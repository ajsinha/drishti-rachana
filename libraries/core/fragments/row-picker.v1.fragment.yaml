rachana: 1.2
fragment: row-picker
version: 1
doc:
  summary: A compact table whose rows, clicked, raise an event with the row's id - the master of a master-detail screen.
  description: >-
    Give it one row per item with an id and a name, and optionally a type, an amount and a date. Read the chosen id on
    your screen as @<as>.select.id (the use's as: names the instance).
  category: tables
  tags: [table, picker, master, select]
  use-when:
    - "A master list drives a detail panel: the reader clicks a row and the screen shows that item."
  avoid-when:
    - "The rows are just read: use core/data-table."
  data:
    table: rows
    in-words: "One row per item with an id and a name, optionally a type, an amount and a date."
    sample-row: { id: T-100245, name: Rates Desk, type: Coupon, amount: 250000, date: "2026-11-20" }
  example: { use: core/row-picker@1, with: { title: Customers, rows: { from: "$.customers", columns: { id: CUSTOMER_ID, name: CUSTOMER_NAME, type: SEGMENT, amount: BALANCE, date: SINCE } }, type-label: Segment, amount-label: Balance, date-label: Customer since } }
  see-also: [core/data-table, core/field-list]
  keywords: [master detail, picker, select, list, navigation]
params:
  rows:
    type: table
    required: true
    doc: One row per item
    key: required
    columns:
      id:     { type: text, doc: The item's id; the event carries it }
      name:   { type: text, doc: The item's name }
      type:   { type: text, optional: true, doc: A kind or category }
      amount: { type: number, optional: true, doc: An amount }
      date:   { type: date, optional: true, doc: A date }
  title:        { type: text, default: Pick one, doc: The panel's title }
  name-label:   { type: text, default: Name, doc: Heading of the name column }
  type-label:   { type: text, default: Type, doc: Heading of the type column }
  amount-label: { type: text, default: Amount, doc: Heading of the amount column }
  date-label:   { type: text, default: Date, doc: Heading of the date column }
  amount-fmt:   { type: format, default: amount0, doc: How the amount is written }
emits:
  - { name: select, payload: { id: text }, doc: A row was chosen }
panels:
  - id: picker
    kind: table
    title: arg.title
    rows: arg.rows
    search: true
    columns:
      - { label: arg.name-label, bind: "@.name" }
      - { label: arg.type-label, bind: "@.type" }
      - { label: arg.amount-label, bind: "@.amount", fmt: "%{amount-fmt}" }
      - { label: arg.date-label, bind: "@.date", fmt: date }
    emits: [ { name: select, on: row-click, payload: { id: "@.id" } } ]
