  - id: "expr-error-unterminated-string-l11"
    kind: expr-error
    since: "1.1"
    verified: true
    source: SPEC 6.3
    expr: "'abc"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "expression ''abc': unterminated string" }

  - id: "expr-error-arity-out-of-range-l11"
    kind: expr-error
    since: "1.1"
    verified: true
    source: SPEC 4.10 rule 1, 6.3
    expr: "size($.a, 'b')"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "expression 'size($.a, 'b')': size takes 1 argument(s), got 2" }

  - id: "expr-error-unknown-function-names-near-matches-l11"
    kind: expr-error
    since: "1.1"
    verified: true
    source: SPEC 4.10 rule 1, 6.3
    note: The list of known names after the colon is not pinned here.
    expr: "roundd(1)"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "expression 'roundd(1)': unknown function 'roundd'" }

  - id: "expr-error-unclosed-template-part-at-template-offset-l11"
    kind: expr-error
    since: "1.1"
    verified: true
    source: SPEC 4.11
    template: "Total ${sum($.a)"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "template 'Total ${sum($.a)'", expr: { start: 6 } }

  - id: "expr-error-host-lowered-depth-is-named-l11"
    kind: expr-error
    since: "1.1"
    verified: true
    source: SPEC 4.12
    given: { limits: { depth: 3 } }
    expr: "((((1))))"
    expect:
      problems:
        - { code: RCH-2101, messageStart: "expression '((((1))))': expression nested deeper than 3 levels" }

  - id: "limits-host-lowered-depth-is-named-l11"
    kind: "expr-error"
