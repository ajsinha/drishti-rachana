# Harvested by reading Drishti's tests (plan H2); verified by the reference runner (plan H1) unless a case says verified: false.
suite: problem/wiring
since: "1.0"
profile: [core, drishti]
verified: true
description: "Sutra wiring: source mapping, emits, waits, children, @panel.event.field, $src and their lint (DRS-2056, DRS-2057); harvested from SutraWiringTest."
cases:

  - id: "wiring-desk-valid"
    kind: "problem"
    source: "SutraWiringTest#theGrammarReadsSourcesEventsWaitsAndChildren / lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.trade\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trades.open.cpty}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": true, "problems": []}

  - id: "source-params-with-where"
    kind: "problem"
    source: "SutraWiringTest#aComputedSourceTakesTypedParametersAsExpressions"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: v, kind: kv, source: { kind: var-result, where: \"@.A > 1\", params: { x: 1 } } }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "'params' goes with a source read by id: a computed kind answers one question (var-result)", "range": {"start": {"line": 7, "column": 78}}}]}

  - id: "source-params-not-mapping"
    kind: "problem"
    source: "SutraWiringTest#aComputedSourceTakesTypedParametersAsExpressions"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: v, kind: kv, source: { kind: var-result, id: $.A, params: [1, 2] } }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2012", "severity": "error", "message": "'params' in a source is a mapping of parameter names to expressions ({ confidence: ctl.confidence })", "range": {"start": {"line": 7, "column": 69}}}]}

  - id: "source-params-bad-names"
    kind: "problem"
    source: "SutraWiringTest#aComputedSourceTakesTypedParametersAsExpressions"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: v, kind: kv, source: { kind: var-result, id: $.A, params: { 9x: 1, y: { a: 1 } } } }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2012", "severity": "error", "message": "'9x' is not a parameter name (letters, digits, '_' and '-', starting with a letter)", "range": {"start": {"line": 7, "column": 75}}}, {"code": "RCH-2012", "severity": "error", "message": "parameter y is an expression written as text, a number or true/false", "range": {"start": {"line": 7, "column": 81}}}]}

  - id: "older-forms-valid"
    kind: "problem"
    source: "SutraWiringTest#theOlderFormsStayOptions"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: fx, kind: line, rows: $.POINTS, source: \"link($.CURVE, 'ir-curve')\" }\n  - { id: tree, kind: table, rows: $.NODES, children: \"@.KIDS\", columns: [ { label: N, bind: \"@.N\" } ] }\n"
    expect: {"ok": true, "problems": []}

  - id: "ref-unknown-panel"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.trade\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trade.open.cpty}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "panel 'limits' reads @trade, which is no panel of this screen (panels: trades, flows, limits)", "range": {"start": {"line": 22, "column": 5}}}]}

  - id: "ref-unknown-event"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.trade\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trades.pick.cpty}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "panel 'limits' reads @trades.pick, but panel 'trades' emits open", "range": {"start": {"line": 22, "column": 5}}}]}

  - id: "ref-unknown-payload-field"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.trade\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trades.open.desk}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "panel 'limits' reads @trades.open.desk, but the payload of open has trade, cpty, n", "range": {"start": {"line": 22, "column": 5}}}]}

  - id: "parent-event-unknown"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.trade\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            title: \"${@parent.drill.x}\"\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trades.open.cpty}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2056", "severity": "error", "message": "panel 'flows' reads @parent.drill, but its parent 'trades' emits open", "range": {"start": {"line": 18, "column": 13}}}]}

  - id: "source-id-type-mismatch"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: trades\n    kind: table\n    rows: $.TRADES\n    columns: [ { label: Trade, bind: \"@.TRADE_ID\" } ]\n    emits:\n      - { name: open, on: row-click, payload: { trade: \"@.TRADE_ID\", cpty: { bind: \"@.COUNTERPARTY\", type: id }, n: { bind: \"@.N\", type: number } } }\n    children:\n      - place: expand-row\n        source: { kind: trade, id: \"@parent.open.n\" }\n        waits: Pick a trade\n        panels:\n          - id: flows\n            kind: ladder\n            rows: $src.EVENTS\n            columns: [ { label: Date, bind: \"@.EVENT_DATE\" } ]\n  - id: limits\n    kind: kv\n    title: \"Limits of ${@trades.open.cpty}\"\n    area: right\n    waits: Pick a trade to see its counterparty's limits\n    source: { pack: counterparty-risk, kind: credit-limit, where: \"@.COUNTERPARTY == @trades.open.cpty\", limit: 5 }\n    columns: [ { label: Used, bind: \"$src[0].USED\" } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2056", "severity": "error", "message": "panel 'flows': its source's id reads @parent.open.n, a number; an id is text (type id or text)", "range": {"start": {"line": 18, "column": 13}}}]}

  - id: "parent-in-top-panel"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: a, kind: kv, title: \"${@parent.x.y}\", columns: [ { label: A, bind: $.A } ] }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2056", "severity": "error", "message": "panel 'a' reads @parent but is not a child panel (no parent provides it)", "range": {"start": {"line": 7, "column": 5}}}]}

  - id: "src-without-source"
    kind: "problem"
    source: "SutraWiringTest#lintFindsUnknownPanelsEventsAndFields"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - { id: a, kind: kv, columns: [ { label: A, bind: $src.A } ] }\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "panel 'a' reads $src but names no source: (nor does its group of children)", "range": {"start": {"line": 7, "column": 5}}}]}

  - id: "wiring-cycle"
    kind: "problem"
    source: "SutraWiringTest#lintFindsACycleAndADepthOverThree"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: a\n    kind: table\n    rows: $.A\n    where: \"@.K == @b.pick.k\"\n    columns: [ { label: K, bind: \"@.K\" } ]\n    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n  - id: b\n    kind: table\n    rows: $.B\n    where: \"@.K == @a.pick.k\"\n    columns: [ { label: K, bind: \"@.K\" } ]\n    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2057", "severity": "error", "message": "panels wait on each other in a cycle: a > b > a (each waits on the next one's event, or is its child)", "range": {"start": {"line": 7, "column": 5}}}]}

  - id: "children-nested-four-deep"
    kind: "problem"
    source: "SutraWiringTest#lintFindsACycleAndADepthOverThree"
    sutra: "rachana: 1\nsutra: probe\nversion: 1\nmatch: { kind: portfolio-trades }\ntitle: { id: $.PORTFOLIO }\npanels:\n  - id: l1\n    kind: table\n    rows: $.A\n    columns: [ { label: K, bind: \"@.K\" } ]\n    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n    children:\n      - panels:\n          - id: l2\n            kind: table\n            rows: $.A\n            columns: [ { label: K, bind: \"@.K\" } ]\n            emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n            children:\n              - panels:\n                  - id: l3\n                    kind: table\n                    rows: $.A\n                    columns: [ { label: K, bind: \"@.K\" } ]\n                    emits: [ { name: pick, on: row-click, payload: { k: \"@.K\" } } ]\n                    children:\n                      - panels: [ { id: l4, kind: kv, title: \"${@parent.pick.k}\", columns: [ { label: K, bind: $.K } ] } ]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2056", "severity": "error", "message": "panel 'l4' is nested 4 deep: children nest at most 3 (screen panel, child, grandchild)", "range": {"start": {"line": 27, "column": 35}}}]}

