suite: lib/libraries
since: "1.2"
profile: core
verified: true
description: "A library folder read and checked (LIBRARIES 3, 11, 12): files, manifest, hashes, exports; its identity is the SHA-384 of its canonical archive."
cases:

  - id: valid-library
    kind: lib
    source: LIBRARIES 3, 11.1, 12
    library: demo
    files:
      LICENSE: |
        Test material for the conformance suite only.
      MANIFEST.sha384: |
        db106a3e6b152c7ece984ce582ece8dd99f8763e70e5e6044dc18b57593f5d444618670e9ea8df096e01d179adcf0520  LICENSE
        13f64110035896af0fc8e28f40d3ce87cdefd1a74adc45ce99f02d4c9f8f540c626ff0a98653d6fbac1f51e2ae4262a7  demo.rachana-lib.yaml
        efeff0b56cf42b9fd8768afceed7c2bf573b16d3aa2a2bf485444a1b68a8728afaef9f10c74a7425f071652de5effa61  fragments/figure-pair.v1.fragment.yaml
        ab6e8ed131731de52fa0dbe668334867122306f7dca70b1de8eab22cf2926e1e399fbaf145bd98327e935a488d49f281  fragments/key-figure.v1.fragment.yaml
      demo.rachana-lib.yaml: |
        rachana: 1
        library: demo
        version: 1.0.0
        title: Demo
        summary: A tiny synthetic library that exercises the library machinery in the conformance suite.
        publisher: { name: Rachana conformance }
        licence: LicenseRef-Rachana-Test
        scope: public
        profiles: []
        depends: []
        exports:
          fragments:
            - { name: figure-pair, majors: [1] }
            - { name: key-figure, majors: [1] }
      fragments/figure-pair.v1.fragment.yaml: |
        rachana: 1.2
        fragment: figure-pair
        version: 1
        doc:
          summary: Two figures side by side, with room for a note under them.
        params:
          left: { type: number, required: true, doc: The first figure }
          right: { type: number, required: true, doc: The second figure }
        slots:
          below: { accepts: panels, max: 1, doc: A note under the figures }
        panels:
          - { use: demo/key-figure@1, with: { id: left, value: arg.left, label: Left } }
          - { use: demo/key-figure@1, with: { id: right, value: arg.right, label: Right } }
          - { slot: below }
      fragments/key-figure.v1.fragment.yaml: |
        rachana: 1.2
        fragment: key-figure
        version: 1
        doc:
          summary: One figure with its label and format.
        params:
          value: { type: number, required: true, doc: The figure }
          label: { type: text, default: Value, doc: What the figure is }
          fmt: { type: format, default: amount0, doc: How the figure is written }
          id: { type: id, default: figure, doc: The panel's id }
          floor: { type: number, default: 0, min: 0, doc: Below this the caption says so }
        panels:
          - id: "%{id}"
            kind: metric
            label: arg.label
            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
    expect:
      ok: true
      problems: []
      version: 1.0.0
      fragments:
      - figure-pair
      - key-figure
      sha384: e508774901fed4086abf9915f1a177c0d442f34e95914140d7bb840cd9aeaeb2b2abb2971ee3024f1d0c8e9202dd9b03

