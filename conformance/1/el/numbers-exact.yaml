# Written by hand from the 1.0 decisions of 2026-11-19 (EL_EXPANSION XD2 to XD4); built and verified at language level 1.1 (2026-11-21, EL phase 1); level 1.0 keeps the reference's answers (decision N5).
suite: el/numbers-exact
since: "1.0"
profile: core
verified: true
description: "The numeric tower of 1.0 (SPEC 4.16, decision XD3, EL_EXPANSION X2): exact integer and decimal literals, decimal128 arithmetic, '/' half-even to 34 digits, a double on either side makes a double, overflow of the integer part an error."
cases:

  - id: "literal-decimals-add-exactly"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "XD3: both literals are decimals; + is exact."
    tags: ["numeric-tower"]
    expr: "0.1 + 0.2"
    expect: {"value": 0.3, "type": "decimal", "text": "0.3"}

  - id: "exact-sum-equals-its-literal"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "SPEC 4.6 rule 2."
    tags: ["numeric-tower"]
    expr: "0.1 + 0.2 == 0.3"
    expect: {"value": true}

  - id: "trailing-zeros-are-not-printed"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Text form: no trailing zeros (SPEC 4.2)."
    tags: ["numeric-tower"]
    expr: "1.10 * 3"
    expect: {"value": 3.3, "type": "decimal", "text": "3.3"}

  - id: "one-third"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "34 significant digits, half-even."
    tags: ["numeric-tower"]
    expr: "1 / 3"
    expect: {"value": {"$dec": "0.3333333333333333333333333333333333"}, "type": "decimal", "text": "0.3333333333333333333333333333333333"}

  - id: "two-thirds-rounds-the-last-digit"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "The 35th digit rounds the 34th up."
    tags: ["numeric-tower"]
    expr: "2 / 3"
    expect: {"value": {"$dec": "0.6666666666666666666666666666666667"}, "type": "decimal", "text": "0.6666666666666666666666666666666667"}

  - id: "an-exact-quotient"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "No rounding when the quotient is exact."
    tags: ["numeric-tower"]
    expr: "10 / 4"
    expect: {"value": 2.5, "type": "decimal", "text": "2.5"}

  - id: "a-third-times-three-is-not-one"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "The rounded third, times three, exactly."
    tags: ["numeric-tower"]
    expr: "1 / 3 * 3"
    expect: {"value": {"$dec": "0.9999999999999999999999999999999999"}, "type": "decimal", "text": "0.9999999999999999999999999999999999"}

  - id: "two-rounded-thirds"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Rounding is not undone."
    tags: ["numeric-tower"]
    expr: "1 / 3 + 1 / 3"
    expect: {"value": {"$dec": "0.6666666666666666666666666666666666"}, "type": "decimal", "text": "0.6666666666666666666666666666666666"}

  - id: "a-tie-rounds-to-even-down"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "...2.5 rounds to ...2 (half-even; half-up would give ...3)."
    tags: ["numeric-tower"]
    expr: "2000000000000000000000000000000005 / 2"
    expect: {"value": {"$dec": "1000000000000000000000000000000002"}, "type": "decimal", "text": "1000000000000000000000000000000002"}

  - id: "a-tie-rounds-to-even-up"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "...3.5 rounds to ...4."
    tags: ["numeric-tower"]
    expr: "2000000000000000000000000000000007 / 2"
    expect: {"value": {"$dec": "1000000000000000000000000000000004"}, "type": "decimal", "text": "1000000000000000000000000000000004"}

  - id: "a-64-bit-identifier-survives"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "A double would give 9007199254740992."
    tags: ["numeric-tower"]
    expr: "9007199254740993 + 0"
    expect: {"value": {"$dec": "9007199254740993"}, "type": "decimal", "text": "9007199254740993"}

  - id: "long-identifiers-compare-exactly"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "SPEC 4.16, the integer kind."
    tags: ["numeric-tower"]
    expr: "12345678901234567890 == 12345678901234567891"
    expect: {"value": false}

  - id: "thirty-four-digits-are-allowed"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "The longest literal."
    tags: ["numeric-tower"]
    expr: "1234567890123456789012345678901234 + 0"
    expect: {"value": {"$dec": "1234567890123456789012345678901234"}, "type": "decimal", "text": "1234567890123456789012345678901234"}

  - id: "remainder-of-decimals"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Exact, the sign of the left side."
    tags: ["numeric-tower"]
    expr: "5.5 % 2"
    expect: {"value": 1.5, "type": "decimal", "text": "1.5"}

  - id: "number-like-text-reads-as-a-literal"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "SPEC 4.16 rule 1."
    tags: ["numeric-tower"]
    expr: "'0.1' * 3"
    expect: {"value": 0.3, "type": "decimal", "text": "0.3"}

  - id: "a-small-decimal-prints-without-an-exponent"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Never 1.0E-4 (compare el/paths-operators#0-0001-1, which changes with XD3)."
    tags: ["numeric-tower"]
    expr: "0.0001 * 1"
    expect: {"value": 0.0001, "type": "decimal", "text": "0.0001"}

  - id: "a-large-decimal-prints-without-an-exponent"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Never 1.23456785E7."
    tags: ["numeric-tower"]
    expr: "12345678.5 * 1"
    expect: {"value": 12345678.5, "type": "decimal", "text": "12345678.5"}

  - id: "negative-zero-prints-zero"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "No negative zero."
    tags: ["numeric-tower"]
    expr: "-0.10 * 0"
    expect: {"value": 0, "type": "decimal", "text": "0"}

  - id: "a-literals-trailing-zero-is-not-printed"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Text form 1.5."
    tags: ["numeric-tower"]
    expr: "1.50 + 0"
    expect: {"value": 1.5, "type": "decimal", "text": "1.5"}

  - id: "text-joining-with-a-decimal"
    kind: "expr"
    source: "SPEC 4.16"
    note: "SPEC 4.5: the text form is joined."
    tags: ["numeric-tower"]
    expr: "'x' + 2.50"
    expect: {"value": "x2.5"}

  - id: "exact-ordering"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "Exact compare; as doubles the two are equal."
    tags: ["numeric-tower"]
    expr: "0.1 < 0.10000000000000001"
    expect: {"value": true}

  - id: "division-by-zero-is-empty"
    kind: "expr"
    source: "SPEC 4.16"
    note: "SPEC 4.5, unchanged."
    tags: ["numeric-tower"]
    expr: "1.5 / 0"
    expect: {"value": null}

  - id: "an-exponent-literal-is-a-double"
    kind: "expr"
    source: "SPEC 4.16 rule 4"
    note: "A double on either side makes a double."
    tags: ["numeric-tower"]
    expr: "1e-3 * 2"
    expect: {"value": 0.002, "type": "number", "text": "0.002"}

  - id: "decimal-with-double-is-double"
    kind: "expr"
    source: "SPEC 4.16 rule 4"
    note: "The decimal is converted to the nearest double."
    tags: ["numeric-tower"]
    expr: "0.1 + 1e-1"
    expect: {"value": 0.2, "type": "number", "text": "0.2"}

  - id: "decimal-equals-double-as-doubles"
    kind: "expr"
    source: "SPEC 4.16"
    note: "SPEC 4.16 rule 4."
    tags: ["numeric-tower"]
    expr: "0.1 == 1e-1"
    expect: {"value": true}

  - id: "text-with-an-exponent-reads-as-a-double"
    kind: "expr"
    source: "SPEC 4.16 rule 4"
    note: "SPEC 4.16 rule 1."
    tags: ["numeric-tower"]
    expr: "'1e2' * 1"
    expect: {"value": 100, "type": "number", "text": "100"}

  - id: "a-json-number-from-the-host-is-a-double"
    kind: "expr"
    source: "SPEC 4.16 rule 4"
    note: "SPEC 4.16 rule 6: the record's numbers are doubles."
    tags: ["numeric-tower"]
    given: {"record": {"x": 0.2}}
    expr: "$.x + 0.1"
    expect: {"value": 0.30000000000000004, "type": "number", "text": "0.30000000000000004"}

  - id: "sum-of-decimals-is-exact"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16"
    note: "SPEC 4.16 rule 7."
    tags: ["numeric-tower"]
    expr: "sum([0.1, 0.2])"
    expect: {"value": 0.3, "type": "decimal", "text": "0.3"}

  - id: "sum-with-a-double-is-a-double"
    kind: "expr"
    source: "SPEC 4.16 rule 4"
    note: "SPEC 4.16 rule 7: then the compensated double sum."
    tags: ["numeric-tower"]
    expr: "sum([0.1, 2e-1])"
    expect: {"value": 0.30000000000000004, "type": "number", "text": "0.30000000000000004"}

  - id: "a-whole-overflow-is-an-error"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16 rule 2"
    note: "10^34 needs 35 digits before the point."
    tags: ["numeric-tower"]
    expr: "9999999999999999999999999999999999 + 1"
    expect: {"error": {"code": "RCH-2102"}}

  - id: "a-product-overflow-is-an-error"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16 rule 2"
    tags: ["numeric-tower"]
    expr: "9999999999999999999999999999999999 * 10"
    expect: {"error": {"code": "RCH-2102"}}

  - id: "iferror-catches-the-overflow"
    kind: "expr"
    since: "1.1"
    source: "SPEC 4.16 rule 2"
    note: "SPEC 4.1 rule 4."
    tags: ["numeric-tower"]
    expr: "iferror(9999999999999999999999999999999999 + 1, 'too big')"
    expect: {"value": "too big"}

  - id: "a-literal-of-35-digits-does-not-compile"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.16 rule 1"
    tags: ["numeric-tower"]
    expr: "12345678901234567890123456789012345 + 1"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '12345678901234567890123456789012345 + 1': number '12345678901234567890123456789012345' has more than 34 significant digits at 0", "expr": {"start": 0, "end": 35}}]}

  - id: "a-fraction-of-35-digits-does-not-compile"
    kind: "expr-error"
    since: "1.1"
    source: "SPEC 4.16 rule 1"
    tags: ["numeric-tower"]
    expr: "0.12345678901234567890123456789012345"
    expect: {"problems": [{"code": "RCH-2101", "message": "expression '0.12345678901234567890123456789012345': number '0.12345678901234567890123456789012345' has more than 34 significant digits at 0", "expr": {"start": 0, "end": 37}}]}
