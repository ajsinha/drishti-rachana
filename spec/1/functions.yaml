  - {name: "calendar", type: "text", optional: true, default: "empty"}
  returns: "integer"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2101", when: "a literal calendar the host does not know - at compile time"}
  description: "The business days after a up to and including b (negative when b is before a)."
  examples:
  - {expr: "business_days_between('2026-11-13', '2026-11-17')", result: 2}
  since: "1.0"
- name: shift_date
  family: dates
  signature: "shift_date(d, n, unit?, calendar?)"
  eval: eager
  params:
  - {name: "d", type: "date"}
  - {name: "n", type: "integer"}
  - {name: "unit", type: "text", enum: ["business-day", "business_day", "day", "week", "month", "quarter", "year"], optional: true, default: "business-day"}
  - {name: "calendar", type: "text", optional: true, default: "empty"}
  returns: "date"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2102", when: "an unknown unit; a calendar with a unit other than business-day; more than 100,000 business days; a result outside the calendar's years"}
  - {code: "RCH-2101", when: "a literal unit or calendar outside the sets - at compile time"}
  description: "d moved by n units: business-day (default; `business_day` accepted) skips weekends and the calendar's holidays; day, week, month, quarter, year."
  examples:
  - {expr: "shift_date('2026-11-16', -1)", result: "2026-11-13"}
  - {expr: "shift_date('2026-11-17', 1, 'month')", result: "2026-12-17"}
