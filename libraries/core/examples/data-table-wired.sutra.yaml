# Synthetic demo content.
rachana: 1.2
sutra: data-table-wired-example
version: 1
libraries: [core@1]
title: { id: "'Data table, wired'" }
data:
  orders: { rows: [ { ORDER_ID: A1, AMT_USD: 120 }, { ORDER_ID: A2, AMT_USD: 80 }, { ORDER_ID: A3, AMT_USD: 0 } ] }
  shown: { rows: [ { ok: true } ] }
panels:
  - use: core/data-table@1
    with:
      rows: $.orders
      title: Open orders
      columns: [ { label: Order, bind: "@.ORDER_ID" }, { label: Amount, bind: "@.AMT_USD", fmt: amount0, total: true } ]
      key: F2
      code: ORD
      empty: No open orders
      when: "$.shown[0].ok"
      span: 6
      where: "lambda r: r.AMT_USD > 0"
