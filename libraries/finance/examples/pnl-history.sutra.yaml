# Synthetic demo content.
rachana: 1
sutra: pnl-history-example
version: 1
libraries: [finance@1]
title: { id: "'Pnl history'" }
data:
  daily:
    rows:
      - { BIZ_DATE: "2026-01-12", PNL_USD: 24000 }
      - { BIZ_DATE: "2026-01-13", PNL_USD: -9000 }
      - { BIZ_DATE: "2026-01-14", PNL_USD: 31000 }
panels:
  - use: finance/pnl-history@1
    with:
      rows: { from: $.daily, columns: { date: BIZ_DATE, pnl: PNL_USD } }
