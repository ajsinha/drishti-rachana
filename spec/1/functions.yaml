  family: lists
  signature: "reduce(list, init, expr)"
  eval: form
  params:
  - {name: "list", type: "list"}
  - {name: "init", type: "any"}
  - {name: "expr", type: "expression"}
  returns: "any"
  nulls: {empty: "an empty list argument gives empty", masked: "a masked list or element masks the result"}
  errors:
  - {code: "RCH-2101", when: "an expression that adds or subtracts @acc with + or - (use sum or concat) - at compile time"}
  description: "The list folded from init: the expression for each element in turn, `@` the element and `@acc` the value so far; the last value. A third argument that adds or subtracts `@acc` with `+`/`-` does not compile."
  examples:
  - {expr: "reduce(['FIX', 'FLT'], '', concat(@acc, left(@, 2)))", result: "FIFL"}
  since: "1.0"
- name: sort
  family: lists
  signature: "sort(list, ...keys)"
  eval: form
  params:
  - {name: "list", type: "list"}
  - {name: "keys", type: "any", variadic: true}
  returns: "list"
  nulls: {empty: "an empty list argument gives empty", masked: "a masked key gives masked"}
  errors: []
  description: "Elements ordered by key (an expression over `@`; the element itself by default), ascending unless desc is true; several keys, each with its own direction: `sort(list, key1, desc1, key2, desc2, ...)`. Numbers (and number-like text) as numbers and before text; text by code point (SPEC 4.13); empty keys last either way; stable. Arity 1 to 17."
  examples:
  - {expr: "sort([3, 1, 2])", result: [1, 2, 3]}
  - {expr: "sort($.events, @.date, true)", result: "see says", says: "the events, latest first"}
  since: "1.0"
- name: group
  family: lists
  signature: "group(list, key, aggregate?, by?)"
  eval: form
  params:
  - {name: "list", type: "list"}
  - {name: "key", type: "any", role: "column"}
  - {name: "aggregate", type: "any", optional: true, default: "empty", role: "column"}
  - {name: "by", type: "text", enum: ["month", "year"], optional: true, default: "empty"}
  returns: "list"
  nulls: {empty: "an empty list gives empty", masked: "a masked key or element gives masked"}
  errors:
  - {code: "RCH-2102", when: "an aggregate the engine cannot compute; no aggregate kernel available"}
  description: "One row {label, value, count} per key, in key order, the aggregate over each group; at most 500 groups (further groups left out [CS]). Key: a quoted field (dotted path) or an expression over `@`; aggregate: a quoted field (summed) or an aggregate call over `@`; `by` 'month'/'year' cuts an ISO date key. Arity 2 to 4. The grouping is the aggregate kernel's (decision D3)."
  examples:
  - {expr: "group($.sales, 'region', 'revenue')", result: "see says", says: "[{label, value, count}, ...] in key order"}
  - {expr: "group($.sales, @.region, avg(@.price))", result: "see says", says: "the average price per region"}
  since: "1.0"
- name: fillmissing
  family: lists
  signature: "fillmissing(list, method, value?)"
  eval: eager
  params:
  - {name: "list", type: "list"}
  - {name: "method", type: "text", enum: ["previous", "next", "linear", "nearest", "constant"]}
  - {name: "value", type: "number", optional: true, default: "empty"}
  returns: "list"
  nulls: {empty: "an empty list argument gives empty", masked: "a masked element gives masked"}
  errors:
  - {code: "RCH-2101", when: "a literal method outside the set - at compile time"}
  - {code: "RCH-2102", when: "'constant' without a value"}
  description: "Each missing element (empty, or text that is no number) filled: 'previous', 'next', 'nearest' (the next on a tie), 'linear' (by position; ends extended in a line), 'constant' (value). Present elements are kept."
  examples:
  - {expr: "fillmissing([1, null, 3], 'linear')", result: [1, 2, 3]}
  - {expr: "fillmissing([null, 2], 'constant', 0)", result: [0, 2]}
