suite: sutra/fragments-calls
since: "1.2"
profile: core
verified: true
description: "Fragments are functions (decision L-21): the caller binds the fragment's local names, columns included, at compile time; level 1.2."
cases:

  - id: caller-columns-map-to-local-columns
    kind: sutra
    source: L-21 (2, 3); LIBRARIES 5.1
    files: &desk
      desk-list.v1.fragment.yaml: |
        rachana: 1
        fragment: desk-list
        version: 1
        doc:
          summary: Amounts by desk, one row each.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        emits:
          - { name: pick, payload: { desk: text }, doc: A desk was chosen }
        panels:
          - id: list
            kind: table
            rows: arg.rows
            columns: [ { label: Desk, bind: desk }, { label: Amount, bind: "@.amount", fmt: amount0 } ]
            emits: [ { name: pick, on: row-click, payload: { desk: "@.desk" } } ]
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 } ] }
      panels:
        - use: desk-list@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      at:
        /panels/0/id: list
        /panels/0/data/rows/0/cells/0/text: FX
        /panels/0/data/rows/1/cells/1/text: "800"

  - id: identity-when-names-already-match
    kind: sutra
    source: L-21 (2)
    files: *desk
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        by_desk: { rows: [ { desk: Credit, amount: 75 } ] }
      panels:
        - { use: desk-list@1, with: { rows: $.by_desk } }
    expect:
      at:
        /panels/0/data/rows/0/cells/0/text: Credit
        /panels/0/data/rows/0/cells/1/text: "75"

  - id: two-uses-two-instances
    kind: sutra
    source: L-21 (6); LIBRARIES 7.2 (as)
    files: *desk
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
        limits: { rows: [ { DESK_NAME: Rates, LIMIT_USD: 5000 } ] }
      panels:
        - use: desk-list@1
          as: mtm
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
        - use: desk-list@1
          as: lim
          with: { rows: { from: $.limits, columns: { desk: DESK_NAME, amount: LIMIT_USD } } }
    expect:
      at:
        /panels/0/id: mtm-list
        /panels/0/data/rows/0/cells/1/text: "1,200"
        /panels/1/id: lim-list
        /panels/1/data/rows/0/cells/0/text: Rates

  - id: event-read-in-the-callers-names
    kind: sutra
    source: L-21 (4); LIBRARIES 6.1
    note: "@mtm.pick.desk is read as @mtm-list.pick.desk: the panel of the use mtm that raises pick; desk is the fragment's return value."
    files: *desk
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      panels:
        - use: desk-list@1
          as: mtm
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
        - { id: chosen, kind: markdown, text: "Desk ${@mtm.pick.desk}", waits: mtm-list }
    expect:
      at:
        /panels/0/id: mtm-list
        /panels/1/id: chosen

  - id: on-sets-a-control-from-the-event
    kind: sutra
    source: L-21 (4); LIBRARIES 7.2 (on)
    files: *desk
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 } ] }
      controls:
        - { id: desk, kind: dropdown, options: [FX, Rates] }
      panels:
        - use: desk-list@1
          as: mtm
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
          on: { pick: { set: desk, field: desk } }
    expect:
      at:
        /panels/0/id: mtm-list
        /panels/0/data/rows/0/pick: FX

  - id: table-parameter-by-published-contract
    kind: sutra
    source: L-21 (1); LIBRARIES 5.2
    files:
      contracts/desk-amounts.json: |
        { "contract": "desk-amounts", "title": "Amounts by desk", "grain": "one row per desk", "key": ["desk"],
          "columns": [ { "name": "desk", "type": "string", "doc": "The desk" },
                       { "name": "amount", "type": "decimal", "doc": "The amount" } ] }
      desk-total.v1.fragment.yaml: |
        rachana: 1
        fragment: desk-total
        version: 1
        doc:
          summary: Amounts by desk, from the published shape.
        params:
          rows: { type: table, contract: desk-amounts, required: true, doc: One row per desk }
        panels:
          - { id: bars, kind: hbar, rows: arg.rows, label: desk, value: amount, fmt: amount0 }
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 } ] }
      panels:
        - use: desk-total@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      at:
        /panels/0/id: bars
        /panels/0/data/bars/0/label: FX
        /panels/0/data/bars/1/text: "800"

  - id: column-parameter-text-is-renamed
    kind: sutra
    source: L-21 (3); functions.yaml role column
    note: "sum's field is a column parameter (role: column): its text 'amount' is renamed to the caller's MTM_USD at compile time, as @.amount is; so are @.<column> in a filter or a per-element argument over the table, a lambda element's field, the field of first(...) or of an index of the table's rows, the key and aggregate texts of group, and the same inside a template's ${...}. The pipe and take keep the table's rows."
    files: &figures
      desk-figures.v1.fragment.yaml: |
        rachana: 1
        fragment: desk-figures
        version: 1
        doc:
          summary: Figures over amounts by desk.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - { id: total, kind: metric, label: Total, value: "sum(arg.rows, 'amount')", fmt: amount0 }
          - { id: mean, kind: metric, label: Mean, value: "avg(arg.rows |> take(2), 'amount')", fmt: amount0 }
          - { id: big, kind: metric, label: Large, value: "count(arg.rows[?@.amount > 1000])" }
          - { id: top, kind: metric, label: Top desk, value: "first(sort(arg.rows, lambda r: r.amount, true)).desk" }
          - { id: last, kind: metric, label: Last desk, value: "arg.rows[-1].desk" }
          - { id: doubled, kind: metric, label: Doubled, value: "sum(map(arg.rows, @.amount * 2))", fmt: amount0 }
          - { id: desks, kind: metric, label: Desks, value: "size(group(arg.rows, 'desk', 'amount'))" }
          - { id: note, kind: markdown, text: "Total ${sum(arg.rows, 'amount')} over ${count(arg.rows, 'desk')} desks" }
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 }, { BOOK_DESK: Credit, MTM_USD: 2000 } ] }
      panels:
        - use: desk-figures@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      at:
        /panels/0/data/value/text: "4,000"
        /panels/1/data/value/text: "1,000"
        /panels/2/data/value/text: "2"
        /panels/3/data/value/text: Credit
        /panels/4/data/value/text: Credit
        /panels/5/data/value/text: "8,000"
        /panels/6/data/value/text: "3"
        /panels/7/data/text: Total 4000 over 3 desks

  - id: identity-mapping-keeps-the-text
    kind: sutra
    source: L-21 (2, 3)
    files: *figures
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        by_desk: { rows: [ { desk: FX, amount: 5 }, { desk: Rates, amount: 7 } ] }
      panels:
        - { use: desk-figures@1, with: { rows: $.by_desk } }
    expect:
      at:
        /panels/0/data/value/text: "12"
        /panels/1/data/value/text: "6"
        /panels/3/data/value/text: Rates
        /panels/7/data/text: Total 12 over 2 desks

  - id: set-operations-keep-the-tables-rows
    kind: sutra
    source: L-21 (3); library finding (core library 1.0.0)
    note: "difference and intersect give rows of their first list, union rows of one table when both lists are: a filter's @.amount over them is renamed to the caller's MTM_USD."
    files:
      desk-sets.v1.fragment.yaml: |
        rachana: 1
        fragment: desk-sets
        version: 1
        doc:
          summary: Large amounts among sets of desks.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
        panels:
          - { id: rest, kind: metric, label: Rest, value: "count(difference(arg.rows, take(arg.rows, 1))[?@.amount > 1000])" }
          - { id: both, kind: metric, label: Both, value: "count(intersect(arg.rows, arg.rows)[?@.amount > 1000])" }
          - { id: any, kind: metric, label: Any, value: "count(union(arg.rows, arg.rows)[?@.amount > 1000])" }
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 }, { BOOK_DESK: Credit, MTM_USD: 2000 } ] }
      panels:
        - use: desk-sets@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      at:
        /panels/0/data/value/text: "1"
        /panels/1/data/value/text: "2"
        /panels/2/data/value/text: "2"

  - id: function-parameter-takes-the-callers-lambda
    kind: sutra
    source: L-21 (2); LIBRARIES 4.2 (fn); EL_EXPANSION X13
    note: "score is fn(number) -> number: the use writes a lambda in its own context; where the fragment calls it, arg.score(x) is the lambda bound by let around the expression; where it passes it whole (sort's key), the lambda itself. The lambda reads the caller's column names, as the rows it gets are the caller's."
    files: &ranked
      ranked-desks.v1.fragment.yaml: |
        rachana: 1
        fragment: ranked-desks
        version: 1
        doc:
          summary: Desks scored and ordered as the caller says.
        params:
          rows:
            type: table
            required: true
            doc: One row per desk
            columns:
              desk: { type: text, doc: The desk }
              amount: { type: number, doc: The amount }
          score: { type: "fn(number) -> number", default: "lambda x: x", doc: The score of an amount }
          order: { type: "fn(any) -> any", optional: true, doc: The sort key of a row }
        panels:
          - { id: total, kind: metric, label: Scored, value: "sum(map(arg.rows, arg.score(@.amount)))" }
          - { id: first, kind: metric, label: First, value: "first(sort(arg.rows, arg.order)).desk", when-bound: order }
          - { id: note, kind: markdown, text: "Top score ${max(map(arg.rows, arg.score(@.amount)))}" }
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 }, { BOOK_DESK: Credit, MTM_USD: 2000 } ] }
      panels:
        - use: ranked-desks@1
          with:
            rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } }
            score: "lambda x: x / 1000"
            order: "lambda r: -r.MTM_USD"
    expect:
      at:
        /panels/0/data/value/text: "4"
        /panels/1/data/value/text: Credit
        /panels/2/data/text: Top score 2

  - id: function-parameter-default
    kind: sutra
    source: LIBRARIES 4.2 (fn, default)
    files: *ranked
    sutra: |
      rachana: 1
      sutra: calls-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        positions: { rows: [ { BOOK_DESK: FX, MTM_USD: 1200 }, { BOOK_DESK: Rates, MTM_USD: 800 } ] }
      panels:
        - use: ranked-desks@1
          with: { rows: { from: $.positions, columns: { desk: BOOK_DESK, amount: MTM_USD } } }
    expect:
      at:
        /panels/0/data/value/text: "2000"
        /panels/1/id: note
        /panels/1/data/text: Top score 1200
