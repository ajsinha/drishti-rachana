# Synthetic demo content.
rachana: 1.2
sutra: exceptions-list-full-example
version: 1
libraries: [core@1]
title: { id: "'Exceptions list (full)'" }
data:
  exc:
    rows:
      - { SEV: high, TXT: DESK-C VaR at 99% of limit, WHO: DESK-C, CMD: "VAR DESK-C" }
      - { SEV: low, TXT: Rates feed 6 minutes late, WHO: RATES-FEED, CMD: "FEEDS" }
      - { SEV: medium, TXT: Two trades failed the load check, WHO: LOAD-0421, CMD: "LOADS" }
panels:
  - use: core/exceptions-list@1
    as: exc
    with:
      title: Exceptions first
      rows: { from: $.exc, columns: { severity: SEV, message: TXT, key: WHO, open: CMD } }
