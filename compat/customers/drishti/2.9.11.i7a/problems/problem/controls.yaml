    expect: {"ok": false, "problems": [{"code": "RCH-2034", "severity": "error", "message": "unknown control kind 'knob'; expected one of dropdown, multi-select, cascading, toggle, segmented, date, date-range, number-range, slider, top-n, search", "range": {"start": {"line": 6, "column": 22}}}]}

