  - id: "date-default-bad-date"
    kind: "problem"
    source: "ControlsTest#defaultsMustFitTheKindDrs2039"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: a, kind: date, default: 2026-13-45 }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2039", "severity": "error", "message": "default of control 'a': '2026-13-45' is not a date (2026-10-01) or a relative one (today, yesterday, previous-business-day, next-5bd)", "range": {"start": {"line": 6, "column": 35}}}]}

  - id: "number-range-default-text"
    kind: "problem"
    source: "ControlsTest#defaultsMustFitTheKindDrs2039"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: a, kind: number-range, default: abc }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2039", "severity": "error", "message": "default of control 'a': 'abc' is not a range of numbers (1000000..5000000, either end may be empty)", "range": {"start": {"line": 6, "column": 43}}}]}

  - id: "defaults-valid"
    kind: "problem"
    source: "ControlsTest#defaultsMustFitTheKindDrs2039"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: a, kind: date-range, default: \"2026-10-01..2026-12-31\" }\n  - { id: b, kind: date, default: previous-business-day }\n  - { id: c, kind: number-range, default: \"..5000000\" }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": true, "problems": []}

  - id: "where-not-a-condition"
    kind: "problem"
    source: "ControlsTest#wherePivotFreeOptionsAreChecked"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    where: 5\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2029", "severity": "error", "message": "option 'where' of 'table' panels is a condition written as text (such as oneOf(@.leg, ctl.legs)), not '5'", "range": {"start": {"line": 9, "column": 12}}}]}

  - id: "where-on-kv-refused"
    kind: "problem"
    source: "ControlsTest#wherePivotFreeOptionsAreChecked"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\npanels:\n  - id: k\n    kind: kv\n    where: \"true\"\n    columns: [{ label: A, bind: \"$.x\" }]\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2023", "severity": "error", "message": "option 'where' is not valid for 'kv' panels", "range": {"start": {"line": 8, "column": 12}}}]}

  - id: "limit-from-ctl-valid"
    kind: "problem"
    source: "ControlsTest#wherePivotFreeOptionsAreChecked"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: top, kind: top-n, options: [5] }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n    limit: ctl.top\n"
    expect: {"ok": true, "problems": []}

  - id: "panel-options-valid"
    kind: "problem"
    source: "ControlsTest#thePanelOptionsAreKeptOnThePanel"
    sutra: "rachana: 1\nsutra: ctl-test\nversion: 1\nmatch: { kind: trade }\ncontrols:\n  - { id: leg, kind: search }\npanels:\n  - id: cf\n    kind: table\n    rows: $.schedule\n    columns: [{ label: Leg, bind: \"@.leg\" }]\n    where: \"@.leg == 1\"\n    on-select: { by: leg, field: leg, filter: [cf] }\n"
    expect: {"ok": true, "problems": []}
