rachana: 1.2
sutra: held-changes-example
version: 1
libraries: [core@1]
title: { id: "'Pending changes'" }
data:
  pending: { table: trade.changes, key: CHANGE_ID, live: true }
panels:
  - use: core/held-changes@1
    with:
      changes: { from: $.pending, columns: { change: CHANGE_ID, state: STATE, summary: SUMMARY, by: MADE_BY, at: MADE_AT, message: NOTE } }
      order: MADE_AT
