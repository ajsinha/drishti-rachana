suite: sutra/fragments-state-params
since: "1.2"
profile: core
verified: true
description: "A state name parameter (LIBRARIES 4.2, 6.3), level 1.2: the user hands a fragment one name of the screen's state, and the fragment may write only that."
cases:

  - id: a-filter-writes-the-state-it-is-handed
    kind: sutra
    source: "LIBRARIES 6.3 (writing the user's state: by handing over a name)"
    note: "into: desk hands state.desk over; the fragment writes it with set: { state: %{into} }; two uses write two states."
    files:
      chooser.v1.fragment.yaml: |
        rachana: 1.2
        fragment: chooser
        version: 1
        doc:
          summary: A list whose clicked row is written into the user's state.
        params:
          rows: { type: table, required: true, doc: The items, columns: { id: { type: text, doc: The item } } }
          into: { type: state, of: text, required: true, doc: The state the chosen item is written to }
        panels:
          - id: list
            kind: table
            rows: arg.rows
            columns: [ { label: Id, bind: "@.id" } ]
            on:
              row-click: [ { set: { state: "%{into}", to: "@.id" } } ]
    sutra: |
      rachana: 1.2
      sutra: params-demo
      version: 1
      title: { id: "'Demo'" }
      data:
        desks: { rows: [ { id: FX }, { id: Rates } ] }
        books: { rows: [ { id: B1 } ] }
      state:
        desk: { type: text }
        book: { type: text, default: none }
      panels:
        - use: chooser@1
          as: d
          with: { rows: $.desks, into: desk }
        - use: chooser@1
          as: b
          with: { rows: $.books, into: book }
        - { id: shown, kind: metric, label: Chosen, value: "state.book" }
    expect:
      at:
        /panels/0/id: d-list
        /panels/0/data/rows/1/set: { desk: Rates }
        /panels/1/data/rows/0/set: { book: B1 }
        /panels/2/data/value/text: none
