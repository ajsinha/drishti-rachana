rachana: 1.2
fragment: settlement-figures
version: 1
doc:
  summary: Three figures over a set of payments - due today, due in the coming week, overdue.
  description: >-
    Each figure adds the amounts of payments that are not paid: due today on the given day, due in the seven days after
    it, overdue before it. A payment whose status is Paid (any case) is left out. Amounts are added as they are, so give
    one currency.
  category: trading
  tags: [settlement, payments, due]
  use-when:
    - "Payments due today, in the coming week and overdue head an operations screen."
  avoid-when:
    - "The payments themselves: use finance/payment-schedule."
  data:
    table: rows
    in-words: "One row per payment: payment date, amount and optionally status; plus the business day."
    sample-row: { pay_date: "2026-11-20", amount: 250000, status: Open }
  example: { use: finance/settlement-figures@1, with: { today: "'2026-01-15'", rows: { from: "$.pay", columns: { pay_date: PAYDT, amount: AMT } } } }
  see-also: [finance/payment-schedule, finance/cashflow-ladder]
  keywords: [settlement, due, overdue, payments, operations]
params:
  rows:
    type: table
    required: true
    doc: One row per payment
    columns:
      pay_date: { type: date,   doc: The payment date }
      amount:   { type: number, doc: The amount }
      status:   { type: text,   optional: true, doc: "Paid, due or late" }
  today: { type: date, required: true, doc: The day the figures are taken on }
  fmt:   { type: format, default: amount0, doc: How amounts are written }
panels:
  - id: today
    kind: metric
    label: Due today
    value: "sum(map(arg.rows, if(days_between(arg.today, @.pay_date) == 0 && lower(coalesce(@.status, '')) != 'paid', @.amount, 0)))"
    fmt: "%{fmt}"
  - id: week
    kind: metric
    label: Due in 7 days
    value: "sum(map(arg.rows, if(days_between(arg.today, @.pay_date) > 0 && days_between(arg.today, @.pay_date) <= 7 && lower(coalesce(@.status, '')) != 'paid', @.amount, 0)))"
    fmt: "%{fmt}"
  - id: overdue
    kind: metric
    label: Overdue
    value: "sum(map(arg.rows, if(days_between(arg.today, @.pay_date) < 0 && lower(coalesce(@.status, '')) != 'paid', @.amount, 0)))"
    fmt: "%{fmt}"
    tone: bad
