    sutra: "rachana: 1\nsutra: qa-strict\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.tradeId }\npanels: []\n---\nrachana: 1\nsutra: other\n"
    expect: {"ok": false, "problems": [{"code": "RCH-2033", "range": {"start": {"line": 7}}}]}

