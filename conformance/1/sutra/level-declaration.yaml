# Written 2026-11-21 (owner decision: the Sutra's rachana: key declares its level, SPEC 2.1).
suite: sutra/level-declaration
since: "1.2"
profile: core
verified: true
description: >-
  One host (level 1.2) reads each Sutra at the level it declares (SPEC 2.1): the same expression is a double at level 1.0 (rachana: 1)
  and an exact decimal at level 1.2 (SPEC 4.16), and range(list, field) is the 1.0 aggregate where 1.2 spells it span.
given:
  record: { rows: [ { p: 3 }, { p: 9 }, { p: 4 } ] }
cases:
  - id: rachana-1-keeps-doubles
    kind: sutra
    source: SPEC 2.1, 4.16
    sutra: |
      rachana: 1
      sutra: lv
      version: 1
      panels:
        - { id: m, kind: metric, label: Sum, value: "0.1 + 0.2" }
    expect:
      at:
        /panels/0/data/value/text: "0.30000000000000004"

  - id: rachana-1-2-is-exact
    kind: sutra
    source: SPEC 2.1, 4.16
    sutra: |
      rachana: 1.2
      sutra: lv
      version: 1
      panels:
        - { id: m, kind: metric, label: Sum, value: "0.1 + 0.2" }
    expect:
      at:
        /panels/0/data/value/text: "0.3"

  - id: rachana-1-reads-the-range-aggregate
    kind: sutra
    source: SPEC 2.1, 4.17 (DECISIONS EL1-1)
    sutra: |
      rachana: 1
      sutra: lv
      version: 1
      panels:
        - { id: m, kind: metric, label: Spread, value: "range($.rows, 'p')" }
    expect:
      at:
        /panels/0/data/value/text: "6"

  - id: rachana-1-2-spells-it-span
    kind: sutra
    source: SPEC 2.1, 4.17 (DECISIONS EL1-1)
    sutra: |
      rachana: 1.2
      sutra: lv
      version: 1
      panels:
        - { id: m, kind: metric, label: Spread, value: "span($.rows, 'p')" }
    expect:
      at:
        /panels/0/data/value/text: "6"
