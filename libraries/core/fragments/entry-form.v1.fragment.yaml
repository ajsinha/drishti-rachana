rachana: 1.2
fragment: entry-form
version: 1
doc:
  summary: A form of the fields you list, checked by their types and your rules, that raises submit with the values or cancel.
  description: >-
    List the fields (id, label, type, required, choices) and, if you like, rules over them. Nothing is sent until every
    check passes; then the form raises submit carrying values (field id to value). Wire it with the use's on: - for
    example { submit: [ { host: order.place, with: { order: event.values } } ] } or set a state from event.values.qty.
  category: forms
  tags: [form, entry, input, submit]
  use-when:
    - "The reader enters a few values that the screen hands to its host (a request, a note, a parameter set)."
  avoid-when:
    - "The form is long and has stages: use core/stepped-form."
    - "The form is an order: use finance/order-ticket."
  data:
    in-words: "No table: the list of fields (id, label, type, required, options) and optional rules."
    sample-row: { fields: A, rules: A }
  example: { use: core/entry-form@1, with: { title: New contact, submit-label: Save, fields: [{ id: name, label: Name, required: true }, { id: segment, label: Segment, type: enum, options: [Retail, Wholesale] }, { id: limit, label: Credit limit, type: number }], rules: [{ rule: "limit <= 50000", message: "At most 50,000 without approval" }] } }
  see-also: [core/stepped-form, finance/order-ticket]
  keywords: [form, input, entry, submit, fields]
params:
  fields:
    type: "list<record{id: text, label: text, type: text?, required: boolean?, options: list<text>?}>"
    required: true
    min: 1
    max: 40
    doc: "The fields, in order: { id, label, type (text, number, date, enum, bool, textarea, money, datetime), required, options (an enum's choices) }"
  rules:
    type: "list<record{rule: text, message: text}>"
    default: []
    max: 20
    doc: "Checks over the fields' ids that must hold before the form is sent: { rule: \"qty <= 1000\", message: \"At most 1,000\" }"
  title:        { type: text, default: Enter, doc: The panel's title }
  submit-label: { type: text, default: Submit, doc: The Submit button's text }
  cancel-label: { type: text, default: Cancel, doc: The Cancel button's text }
emits:
  - { name: submit, payload: { values: record }, doc: "The form passed its checks and was sent: values, field id to value" }
  - { name: cancel, doc: The form was put away }
panels:
  - id: form
    kind: form
    title: arg.title
    submitLabel: arg.submit-label
    cancelLabel: arg.cancel-label
    form:
      fields: arg.fields
      rules: arg.rules
    emits:
      - { name: submit, on: submit, payload: { values: event } }
      - { name: cancel, on: cancel }
