suite: protocol/host
since: "1.0"
profile: core
verified: true
description: More of a host's answers (PROTOCOL 4 to 12), run by tools/conformance/protocol_check.py against the reference server.
cases:
  - id: bridge-rows-of-a-sortable-table
    kind: protocol
    source: PROTOCOL 12, 4 (sort needs can sort)
    note: bridge-rows-request-answered-once in examples/bridge sorts a table without sort, which PROTOCOL 4 refuses; this is that case with sort declared.
    fixture: &pair
      name: rdp-pair2
      schema:
        name: rdp-pair2
        key: [k]
        columns: [ { name: k, type: string }, { name: v, type: integer } ]
        can: [page, sort]
      rows: [ { k: b, v: 2 }, { k: a, v: 1 } ]
    steps:
      - request: { method: POST, path: /_test/bridge, body: { rdp: 1, t: rows, id: r1, table: rdp-pair2, body: { sort: k } } }
        expect:
          status: 200
          body: { rdp: 1, t: res, re: r1, body: { table: rdp-pair2, columns: [k, v], values: [ [a, 1], [b, 2] ] } }

  - id: key-is-the-last-tie-breaker
    kind: protocol
    source: PROTOCOL 6.1 (stable pages)
    fixture: &ties
      name: rdp-ties
      schema:
        name: rdp-ties
        key: [id]
        columns: [ { name: id, type: integer }, { name: grp, type: string } ]
        can: [page, sort]
      rows: [ { id: 3, grp: x }, { id: 1, grp: x }, { id: 2, grp: y }, { id: 10, grp: x } ]
    steps:
      - request: { method: GET, path: /tables/rdp-ties/rows, query: { sort: grp } }
        expect:
          status: 200
          body: { values: [ [1, x], [3, x], [10, x], [2, y] ] }

  - id: descending-with-nulls-last
    kind: protocol
    source: PROTOCOL 6.1 (nulls last by default, independent of dir)
    fixture: &nulls
      name: rdp-nulls
      schema:
        name: rdp-nulls
        key: [id]
        columns: [ { name: id, type: string }, { name: amt, type: decimal } ]
        can: [page, sort, filter]
      rows: [ { id: a, amt: "9.5" }, { id: b, amt: null }, { id: c, amt: "10.25" } ]
    steps:
      - request: { method: POST, path: /tables/rdp-nulls/query, body: { sort: [ { col: amt, dir: desc } ] } }
        expect:
          status: 200
          body: { values: [ [c, "10.25"], [a, "9.5"], [b, null] ] }
      - request: { method: POST, path: /tables/rdp-nulls/query, body: { sort: [ { col: amt, nulls: first } ] } }
        expect:
          status: 200
          body: { values: [ [b, null], [a, "9.5"], [c, "10.25"] ] }

  - id: ordering-against-empty-is-false
    kind: protocol
    source: PROTOCOL 7 (an ordering comparison against empty is false)
    fixture: *nulls
    steps:
      - request: { method: POST, path: /tables/rdp-nulls/query, body: { filter: { op: "<", args: [ { col: amt }, { lit: "100", type: decimal } ] }, sort: [ { col: id } ] } }
        expect:
          status: 200
          body: { values: [ [a, "9.5"], [c, "10.25"] ] }

  - id: a-cursor-of-another-query-is-410
    kind: protocol
    source: PROTOCOL 6.2
    fixture: *ties
    steps:
      - request: { method: GET, path: /tables/rdp-ties/rows, query: { limit: 1, sort: grp } }
        expect: { status: 200 }
        capture: { next: /next }
      - request: { method: GET, path: /tables/rdp-ties/rows, query: { limit: 1, sort: id, cursor: "${next}" } }
        expect:
          status: 410
          body: { error: { code: rdp.cursor.invalid } }

  - id: offset-needs-can-offset
    verified: true
    kind: protocol
    source: PROTOCOL 6.2 (offset declared as can offset)
    fixture: *ties
    steps:
      - request: { method: GET, path: /tables/rdp-ties/rows, query: { offset: 1 } }
        expect:
          status: 422
          body: { error: { code: rdp.query.unsupported, operation: offset } }

  - id: filtering-a-masked-column-is-forbidden
    kind: protocol
    source: PROTOCOL 11
    fixture:
      name: rdp-masked
      schema:
        name: rdp-masked
        key: [id]
        columns: [ { name: id, type: string }, { name: salary, type: decimal, masked: true } ]
        can: [page, filter]
      rows: [ { id: a, salary: { $masked: true } } ]
    steps:
      - request: { method: POST, path: /tables/rdp-masked/query, body: { filter: { op: ">", args: [ { col: salary }, { lit: 1 } ] } } }
        expect:
          status: 403
          body: { error: { code: rdp.forbidden, column: salary } }

  - id: no-replay-is-a-gap
    kind: protocol
    source: PROTOCOL 8.3 (6), 8.2 (gap with recoverable false)
    fixture:
      name: rdp-live
      schema:
        name: rdp-live
        key: [id]
        columns: [ { name: id, type: string }, { name: n, type: integer } ]
        can: [page, changes]
      rows: [ { id: a, n: 1 } ]
    steps:
      - request: { method: POST, path: /_test/patch, body: { table: rdp-live, update: [ { id: a, n: 2 } ] } }
        expect: { status: 204 }
      - request: { method: GET, path: /changes, query: { table: rdp-live, after: "t1:0" } }
        expect:
          status: 200
          body: [ { t: gap, recoverable: false } ]
      - request: { method: GET, path: /changes, query: { table: rdp-live, after: "other:3" } }
        expect:
          status: 200
          body: [ { t: gap, recoverable: false } ]

  - id: arrow-not-offered-is-406
    kind: protocol
    source: PROTOCOL 5.2 (a host without arrow answers 406)
    fixture: *ties
    steps:
      - request: { method: GET, path: /tables/rdp-ties/rows, headers: { Accept: application/vnd.apache.arrow.stream } }
        expect:
          status: 406
          body: { error: { code: rdp.query.unsupported } }

  - id: group-count-distinct-min-max
    verified: true
    kind: protocol
    source: PROTOCOL 6.3
    fixture:
      name: rdp-grp
      schema:
        name: rdp-grp
        columns: [ { name: d, type: string }, { name: q, type: integer }, { name: px, type: decimal } ]
        can: [page, sort, group]
      rows: [ { d: A, q: 1, px: "1.10" }, { d: A, q: 1, px: "2.20" }, { d: B, q: 5, px: "0.05" } ]
    steps:
      - request:
          method: POST
          path: /tables/rdp-grp/query
          body:
            group: { by: [d], values: [ { name: n, agg: count }, { name: dq, agg: distinct, col: q }, { name: lo, agg: min, col: px }, { name: hi, agg: max, col: px }, { name: s, agg: sum, col: px } ], totals: true }
            sort: [ { col: d } ]
        expect:
          status: 200
          body:
            columns: [d, n, dq, lo, hi, s]
            values: [ [A, 2, 1, "1.10", "2.20", "3.30"], [B, 1, 1, "0.05", "0.05", "0.05"] ]
            totals: { n: 3, dq: 2, lo: "0.05", hi: "2.20", s: "3.35" }

  - id: a-decimal-sum-has-the-digits-of-its-own-group
    verified: true
    kind: protocol
    source: PROTOCOL 3.1 (the text of a decimal), 6.3
    note: code fix CF-4 (SG-12); each group's sum has the longest digits after the point among its own values, min and max are the cell as held
    fixture:
      name: rdp-grp-scale
      schema:
        name: rdp-grp-scale
        columns: [ { name: d, type: string }, { name: px, type: decimal } ]
        can: [page, sort, group]
      rows: [ { d: A, px: "1.1" }, { d: A, px: "2.25" }, { d: B, px: "1.5" } ]
    steps:
      - request:
          method: POST
          path: /tables/rdp-grp-scale/query
          body:
            group: { by: [d], values: [ { name: s, agg: sum, col: px }, { name: lo, agg: min, col: px }, { name: hi, agg: max, col: px } ], totals: true }
            sort: [ { col: d } ]
        expect:
          status: 200
          body:
            columns: [d, s, lo, hi]
            values: [ [A, "3.35", "1.1", "2.25"], [B, "1.5", "1.5", "1.5"] ]
            totals: { s: "4.85", lo: "1.1", hi: "2.25" }

  - id: a-sum-of-nothing-is-0
    verified: true
    kind: protocol
    source: PROTOCOL 6.3 (a sum over no value is 0; every other aggregate but count is null)
    fixture:
      name: rdp-grp-none
      schema:
        name: rdp-grp-none
        columns: [ { name: d, type: string }, { name: q, type: integer }, { name: px, type: decimal } ]
        can: [page, sort, group]
      rows: [ { d: A, q: 2, px: "1.50" }, { d: B, q: null, px: null } ]
    steps:
      - request:
          method: POST
          path: /tables/rdp-grp-none/query
          body:
            group: { by: [d], values: [ { name: sq, agg: sum, col: q }, { name: sp, agg: sum, col: px }, { name: ap, agg: avg, col: px }, { name: lo, agg: min, col: px }, { name: n, agg: count, col: px } ] }
            sort: [ { col: d } ]
        expect:
          status: 200
          body:
            columns: [d, sq, sp, ap, lo, n]
            values: [ [A, 2, "1.50", "1.5", "1.50", 1], [B, 0, "0", null, null, 0] ]

  - id: a-decimal-avg-is-divided-to-34-digits
    verified: true
    kind: protocol
    source: PROTOCOL 3.1 (the text of a decimal), 6.3; SPEC 4.16 rule 3
    fixture:
      name: rdp-grp-avg
      schema:
        name: rdp-grp-avg
        columns: [ { name: d, type: string }, { name: px, type: decimal } ]
        can: [page, sort, group]
      rows: [ { d: A, px: "1" }, { d: A, px: "2" }, { d: A, px: "2" }, { d: B, px: "1.00" }, { d: B, px: "3.00" } ]
    steps:
      - request:
          method: POST
          path: /tables/rdp-grp-avg/query
          body:
            group: { by: [d], values: [ { name: a, agg: avg, col: px } ], totals: true }
            sort: [ { col: d } ]
        expect:
          status: 200
          body:
            columns: [d, a]
            values: [ [A, "1.666666666666666666666666666666667"], [B, "2"] ]
            totals: { a: "1.8" }
