            value: arg.value
            fmt: "%{fmt}"
            caption: "${arg.value < arg.floor ? 'below floor' : 'ok'}"
      rachana.lock: |
        lock: 1
        libraries:
          demo: { version: 1.0.0, sha384: "6f945cc79032be7b89b7538a0a8b29bcc8856ba352c3cc677f60bbf9b0829480a306501eb1521f58e25694c0d64d0843" }
    sutra: |
      rachana: 1
      sutra: lib-demo
      version: 1
      match: { kind: demo }
      title: { id: "'Demo'" }
      libraries: [demo@1]
      panels:
        - use: demo/figure-pair@1
          with: { left: 1, right: 2 }
          slots:
            below:
              - { id: a, kind: metric, label: A, value: 1 }
              - { id: b, kind: metric, label: B, value: 2 }
    expect:
      ok: false
      problems:
      - code: RCH-2118
        severity: error
        message: slot below of fragment demo/figure-pair takes at most 1 panel, not 2
        range:
          start:
            line: 12
            column: 9

