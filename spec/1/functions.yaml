  - {code: "RCH-2102", when: "the end is before the start; an unknown basis"}
  description: "Interest accrued from a date to another: rate * yearfrac(from, to, basis) * par; exact in decimal. Excel's signs (paid out negative) and argument order. Real-number function."
  examples:
