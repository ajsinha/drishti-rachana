# Drafted by reading Drishti's tests (plan F2); verified by the reference runner (plan H1); a case with verified: false pins what SPEC says where the reference differs (el/KNOWN_DIFFERENCES.md).
suite: el/logic
since: "1.0"
profile: core
verified: true
description: "Logic and choice: if, ifs, switch, iferror, let, choose, coalesce, information tests, the null rule, and the function-name rules."
given: {"record": {"TRADE_ID": "MX-20000001", "PRODUCT_TYPE": "ComSwap", "DESK": "DESK-COMM", "TT_BOOK": "BOOK-RATES-3", "QUANTITY": 242000000, "PRICE": 0.040829, "DIRECTION": "SHORT", "TRADE_DATE": "2025-11-21", "START_DATE": "2025-11-25", "MATURITY_DATE": "2032-06-25", "INSTRUMENT": "USD 2026-10 swap", "TAGS": "ir,swap,,aud", "LEG_ID": "7", "STRATEGY": null, "BLANK": "", "TEXTNUM": "12.5", "BASIS": "ACT/999", "DESKS": ["DESK-COMM", "DESK-RATES"], "LEGS": [{"LEG_ID": 1, "LEG_TYPE": "FIXED", "NOTIONAL": 242000000, "CURRENCY": "AUD"}, {"LEG_ID": 2, "LEG_TYPE": "FLOAT", "NOTIONAL": 242000000, "CURRENCY": "AUD"}], "EVENTS": [{"EVENT_TYPE": "BOOKED", "EVENT_DATE": "2025-11-21"}, {"EVENT_TYPE": "AMENDED", "EVENT_DATE": "2026-03-02"}, {"EVENT_TYPE": "CASH_SETTLEMENT", "EVENT_DATE": "2026-01-15", "AMOUNT": -1500.25}], "NUMS": [3, 1.5, "2", 10], "MIXED": [1, "1", 1.0, "a", "a"], "UNDATED": [{"ID": "a", "D": "2026-02-01"}, {"ID": "b"}, {"ID": "c", "D": "2026-01-01"}], "MTM": {"$masked": true}, "MASKED_LIST": {"$masked": true}, "PVS": [{"PV": 5}, {"PV": {"$masked": true}}]}, "today": "2026-10-16"}
cases:

  - id: "if-direction-short-1-1"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    expr: "if($.DIRECTION == 'SHORT', -1, 1)"
    expect: {"value": -1}

  - id: "if-direction-long-1-1"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    expr: "if($.DIRECTION == 'LONG', -1, 1)"
    expect: {"value": 1}

  - id: "if-false-1"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    expr: "if(false, 1)"
    expect: {"value": null, "type": "empty"}

  - id: "if-true-ok-round-up-x"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    note: "The other branch would be an error; it is not evaluated."
    expr: "if(true, 'ok', round_up('x'))"
    expect: {"value": "ok"}

  - id: "if-nope-1-2"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    expr: "if($.NOPE, 1, 2)"
    expect: {"value": 2}

  - id: "if-mtm-0-1-2"
    kind: "expr"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    expr: "if($.MTM > 0, 1, 2)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "bad-if-true"
    kind: "expr-error"
    source: "LogicFunctionsTest#ifEvaluatesOnlyTheBranchTaken"
    note: "Message contains: 'if takes 2-3 argument(s), got 1'."
    expr: "if(true)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "ifs-quantity-1e6-large-quantity-1e5-medium-small"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    expr: "ifs($.QUANTITY > 1e6, 'large', $.QUANTITY > 1e5, 'medium', 'small')"
    expect: {"value": "large"}

  - id: "ifs-false-1-true-2-3"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    expr: "ifs(false, 1, true, 2, 3)"
    expect: {"value": 2}

  - id: "ifs-false-1-false-2"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    expr: "ifs(false, 1, false, 2)"
    expect: {"value": null, "type": "empty"}

  - id: "ifs-false-1-else"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    expr: "ifs(false, 1, 'else')"
    expect: {"value": "else"}

  - id: "ifs-true-1-mtm-0-2"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    note: "A masked condition never reached does not mask the result."
    expr: "ifs(true, 1, $.MTM > 0, 2)"
    expect: {"value": 1}

  - id: "ifs-false-1-mtm-0-2-3"
    kind: "expr"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    expr: "ifs(false, 1, $.MTM > 0, 2, 3)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "bad-ifs-true"
    kind: "expr-error"
    source: "LogicFunctionsTest#ifsTakesTheFirstTrueCondition"
    note: "Message contains: 'ifs takes 2-64 argument(s), got 1'."
    expr: "ifs(true)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "switch-legs-0-leg-type-fixed-f-float-v"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch($.LEGS[0].LEG_TYPE, 'FIXED', 'F', 'FLOAT', 'V', '?')"
    expect: {"value": "F"}

  - id: "switch-legs-1-leg-type-fixed-f-float-v"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch($.LEGS[1].LEG_TYPE, 'FIXED', 'F', 'FLOAT', 'V', '?')"
    expect: {"value": "V"}

  - id: "switch-x-fixed-f"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch('X', 'FIXED', 'F', '?')"
    expect: {"value": "?"}

  - id: "switch-x-a-1"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch('X', 'A', 1)"
    expect: {"value": null, "type": "empty"}

  - id: "switch-1-1-0-one"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    note: "Equality as == (SPEC 4.6)."
    expr: "switch(1, '1.0', 'one')"
    expect: {"value": "one"}

  - id: "switch-nope-null-none-some"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch($.NOPE, null, 'none', 'some')"
    expect: {"value": "none"}

  - id: "switch-a-a-1-b-round-up-x"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    note: "Answers not chosen are not evaluated."
    expr: "switch('A', 'A', 1, 'B', round_up('x'))"
    expect: {"value": 1}

  - id: "switch-mtm-1-a"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch($.MTM, 1, 'a')"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "switch-b-mtm-a-b-b"
    kind: "expr"
    source: "LogicFunctionsTest#switchMatchesAValue"
    expr: "switch('B', $.MTM, 'a', 'B', 'b')"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "bad-switch-a-a"
    kind: "expr-error"
    source: "LogicFunctionsTest#switchMatchesAValue"
    note: "Message contains: 'switch takes 3-64 argument(s), got 2'."
    expr: "switch('A', 'A')"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "iferror-1-0-0"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    expr: "iferror(1 / 0, 0)"
    expect: {"value": 0}

  - id: "iferror-round-up-abc-1"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    expr: "iferror(round_up('abc'), -1)"
    expect: {"value": -1}

  - id: "iferror-sqrt-1-negative"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    expr: "iferror(sqrt(-1), 'negative')"
    expect: {"value": "negative"}

  - id: "iferror-quantity-nope-0"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    note: "Not a number."
    expr: "iferror($.QUANTITY * $.NOPE, 0)"
    expect: {"value": 0}

  - id: "iferror-nope-n-a"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    expr: "iferror($.NOPE, 'n/a')"
    expect: {"value": "n/a"}

  - id: "iferror-5-round-up-x"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    note: "The fallback only when needed."
    expr: "iferror(5, round_up('x'))"
    expect: {"value": 5}

  - id: "iferror-regex-extract-a-trade-id-bad-pattern"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    note: "A refused pattern computed at run time is an error iferror catches."
    expr: "iferror(regex_extract('a', $.TRADE_ID + '('), 'bad pattern')"
    expect: {"value": "bad pattern"}

  - id: "iferror-mtm-0"
    kind: "expr"
    source: "LogicFunctionsTest#iferrorGivesAFallback"
    note: "A masked first argument is returned as it is (SPEC 4.9 rule 4)."
    expr: "iferror($.MTM, 0)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "let-n-legs-0-notional-q-2-n-q"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(n = $.LEGS[0].NOTIONAL, q = 2, n * q)"
    expect: {"value": 484000000, "reads": ["$.LEGS[0].NOTIONAL"]}

  - id: "let-a-2-b-a-3-b-a"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(a = 2, b = a * 3, b + a)"
    expect: {"value": 8}

  - id: "let-quantity-1-quantity-1"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "A name hides a field."
    expr: "let(QUANTITY = 1, QUANTITY + 1)"
    expect: {"value": 2}

  - id: "let-a-1-let-a-5-a-a"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(a = 1, let(a = 5, a) + a)"
    expect: {"value": 6}

  - id: "quantity"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "A bare name reads a field of $ outside a row (SPEC 4.3), and a let name only inside its let."
    expr: "QUANTITY"
    expect: {"value": 242000000}

  - id: "map-legs-let-n-notional-n-1e6"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "map($.LEGS, let(n = @.NOTIONAL, n / 1e6))"
    expect: {"value": [242, 242], "type": "list"}

  - id: "let-leg-first-legs-leg-currency"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(leg = first($.LEGS), leg.CURRENCY)"
    expect: {"value": "AUD"}

  - id: "let-m-mtm-m-2"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(m = $.MTM, m * 2)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "let-m-mtm-3"
    kind: "expr"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    expr: "let(m = $.MTM, 3)"
    expect: {"value": 3}

  - id: "bad-let-5"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: 'let needs a name = value before its result'."
    expr: "let(5)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "bad-let-a-1"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: \"expected ',' and then the result\"."
    expr: "let(a = 1)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "bad-let-true-1-2"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: \"let: 'true' cannot be a name\"."
    expr: "let(true = 1, 2)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "bad-let-a-1-a-2-a"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: \"let: 'a' is named twice\"."
    expr: "let(a = 1, a = 2, a)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "bad-let-a-1-a-2"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: 'only the last argument is the result'."
    expr: "let(a = 1, a, 2)"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "bad-a-1"
    kind: "expr-error"
    source: "LogicFunctionsTest#letNamesAPartToReuse"
    note: "Message contains: \"unexpected '='\"."
    expr: "a = 1"
    expect: {"problems": [{"code": "RCH-2101"}]}

  - id: "one-of-desk-desks-oneof-desk-desks"
    kind: "expr"
    source: "LogicFunctionsTest#theOneNamesAndTheOldReadAlike"
    note: "The old spelling reads alike (SPEC 5.10)."
    expr: "one_of($.DESK, $.DESKS) == oneOf($.DESK, $.DESKS)"
    expect: {"value": true, "type": "boolean"}

  - id: "coalesce-strategy-none"
    kind: "expr"
    source: "LogicFunctionsTest#theOneNamesAndTheOldReadAlike"
    expr: "coalesce($.STRATEGY, 'NONE')"
    expect: {"value": "NONE"}

  - id: "nonblank-blank-tt-book"
    kind: "expr"
    source: "LogicFunctionsTest#theOneNamesAndTheOldReadAlike"
    expr: "nonblank($.BLANK, $.TT_BOOK)"
    expect: {"value": "BOOK-RATES-3"}

  - id: "coalesce-mtm-1"
    kind: "expr"
    source: "LogicFunctionsTest#theOneNamesAndTheOldReadAlike"
    expr: "coalesce($.MTM, 1)"
    expect: {"value": {"$masked": true}, "type": "masked", "text": "•••"}

  - id: "nonblank-nope-cp-name"
    kind: "expr"
    source: "ElTest#flattenJoinsTheListsOfEveryElementAndNonblankSkipsEmptyText"
    note: "nonblank skips empty and blank text and empty values."
    given: {"record": {"cp": {"id": "CP-1", "name": "Northbridge"}}}
    expr: "nonblank('', '  ', $.nope, $.cp.name)"
    expect: {"value": "Northbridge"}

  - id: "coalesce-cp-name"
    kind: "expr"
    source: "ElTest#flattenJoinsTheListsOfEveryElementAndNonblankSkipsEmptyText"
    note: "coalesce keeps an empty text, as before."
    given: {"record": {"cp": {"id": "CP-1", "name": "Northbridge"}}}
    expr: "coalesce('', $.cp.name)"
    expect: {"value": ""}

  - id: "nonblank-null"
    kind: "expr"
    source: "ElTest#flattenJoinsTheListsOfEveryElementAndNonblankSkipsEmptyText"
    expr: "nonblank('', null)"
    expect: {"value": null, "type": "empty"}

  - id: "is-number-quantity"
