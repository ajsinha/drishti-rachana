rachana: 1.2
fragment: fixing-ladder
version: 1
doc:
  summary: An index's fixings by date, newest first, with the day's change.
  description: >-
    One row per fixing. The ladder lists them newest first and shows the change against the previous fixing in basis
    points. Use it for any dated series read as a list rather than a chart.
  category: market-data
  tags: [fixings, index, ladder]
  use-when:
    - "An index's fixings are read as a dated list, newest first, with the day's change."
  avoid-when:
    - "The shape over time matters: use core/series-line."
  data:
    table: rows
    in-words: "One row per fixing: date and value."
    sample-row: { date: "2026-11-20", value: 1250000 }
  example: { use: finance/fixing-ladder@1, with: { rows: { from: "$.fix", columns: { date: FIX_DATE, value: RATE } } } }
  see-also: [core/series-line, finance/price-history]
  keywords: [fixings, index, rates, sofr, ladder]
params:
  rows:
    type: table
    required: true
    doc: One row per fixing
    columns:
      date:  { type: date,   doc: The fixing date }
      value: { type: number, doc: The fixed rate }
  title:      { type: text, default: Fixings, doc: The panel's title }
  fmt:        { type: format, default: pct4, doc: How the rates are written }
  change-fmt: { type: format, default: bp1, doc: How the change is written in basis points }
panels:
  - id: ladder
    kind: ladder
    title: arg.title
    rows: "map(sort(arg.rows, @.date), {date: @.date, value: @.value, change: if(#index == 0, null, (@.value - ^.value) * 10000)})"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Fixing, bind: "@.value", fmt: "%{fmt}" }
      - { label: Change (bp), bind: "@.change", fmt: "%{change-fmt}", tone: sign }
