      - { DAY: "2026-01-14", OPEN_PX: 99.9, HIGH_PX: 102.2, LOW_PX: 99.7, CLOSE_PX: 101.8, QTY: 1480000 }
      - { DAY: "2026-01-15", OPEN_PX: 101.8, HIGH_PX: 102.0, LOW_PX: 100.6, CLOSE_PX: 101.4, QTY: 870000 }
panels:
  - use: finance/price-bars@1
    with:
      title: Alder Ltd daily
      fmt: price2
      rows: { from: $.px, columns: { date: DAY, open: OPEN_PX, high: HIGH_PX, low: LOW_PX, close: CLOSE_PX, volume: QTY } }
