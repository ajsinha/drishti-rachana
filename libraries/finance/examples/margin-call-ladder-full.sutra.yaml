rachana: 1.2
sutra: margin-call-ladder-full-example
version: 1
libraries: [finance@1]
title: { id: "'Margin call ladder (full)'" }
data:
  calls:
    rows:
      - { CALL_DT: "2026-01-13", SIDE: Issued, AMT: 800000, CCY: USD, STATE: Settled }
      - { CALL_DT: "2026-01-14", SIDE: Received, AMT: 150000, CCY: USD, STATE: Disputed }
      - { CALL_DT: "2026-01-15", SIDE: Issued, AMT: 350000, CCY: USD, STATE: Agreed }
panels:
  - use: finance/margin-call-ladder@1
    with:
      title: Calls this week
      fmt: amount0
      rows: { from: $.calls, columns: { date: CALL_DT, direction: SIDE, amount: AMT, currency: CCY, status: STATE } }
