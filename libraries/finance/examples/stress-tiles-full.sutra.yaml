rachana: 1.2
sutra: stress-tiles-full-example
version: 1
libraries: [finance@1]
title: { id: "'Stress tiles (full)'" }
data:
  st:
    rows:
      - { S: Rates +100bp, P: -3100000, L: 5000000 }
      - { S: Equity -20%, P: -6400000, L: 8000000 }
      - { S: FX shock, P: 1200000, L: 4000000 }
panels:
