  description: "A number or an ISO date written with an Excel format code: `0 # , .` digits and groups, `%`, `0.00E+00`, quoted literals, up to three sections positive;negative;zero; dates `yyyy yy mmmm mmm mm m dddd ddd dd d hh ss`; `@` the text itself. Rounding half away from zero, in decimal."
