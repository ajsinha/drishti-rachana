- name: map
  family: lists
  signature: "map(list, expr)"
  eval: form
  params:
  - {name: "list", type: "list"}
  - {name: "expr", type: "expression"}
  returns: "list"
  nulls: {empty: "an empty list argument gives empty", masked: "a masked list, or a masked element result, gives masked"}
  errors: []
  description: "The expression for each element (`@` the element, `#index` its position, `^` the previous element), as a list."
  examples:
  - {expr: "map([1, 2], @ * 10)", result: [10, 20]}
  - {expr: "map(['a', 'b'], #index)", result: [0, 1]}
