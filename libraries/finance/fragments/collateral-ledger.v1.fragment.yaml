rachana: 1.2
fragment: collateral-ledger
version: 1
doc:
  summary: Collateral held and posted - asset, direction, nominal, haircut, value after haircut, with totals by direction.
  description: >-
    One row per asset and direction. The value after haircut is supplied, not derived. The totals by direction add the
    values, so give one currency. A click on a row names the asset.
  category: counterparty
  tags: [collateral, ledger, haircut]
  use-when:
    - Collateral held and posted is listed by asset with haircuts and totals by direction.
  avoid-when:
    - "The agreement's terms are wanted: use finance/agreement-terms."
  data:
    table: rows
    in-words: "One row per asset and direction: asset, direction, nominal, currency, haircut and value after haircut."
    sample-row: { asset: "UST 4.25% 2034", direction: Received, nominal: 10000000, currency: USD, haircut: 0.02, value: 1250000 }
  example: { use: finance/collateral-ledger@1, with: { rows: { from: "$.coll", columns: { asset: ASSET, direction: SIDE, nominal: NOMINAL, currency: CCY, value: VAL } } } }
  see-also: [finance/agreement-terms, finance/margin-call-ladder]
  keywords: [collateral, haircut, held, posted, ledger]
params:
  rows:
    type: table
    required: true
    doc: One row per asset and direction
    columns:
      asset:     { type: text,   doc: The asset }
      direction: { type: text,   doc: Held or posted }
      nominal:   { type: number, doc: The nominal amount }
      currency:  { type: text,   doc: The currency }
      haircut:   { type: number, optional: true, doc: "The haircut, as a fraction" }
      value:     { type: number, doc: The value after haircut }
  title: { type: text, default: Collateral, doc: The panel's title }
  fmt:   { type: format, default: amount0, doc: How amounts are written }
emits:
  - { name: open, payload: { asset: text }, doc: An asset was chosen }
panels:
  - id: ledger
    kind: table
    title: arg.title
    rows: "map(arg.rows, {asset: @.asset, direction: @.direction, nominal: @.nominal, currency: @.currency, haircut: @.haircut, value: @.value})"
    search: false
    columns:
      - { label: Asset, bind: "@.asset" }
      - { label: Direction, bind: "@.direction" }
      - { label: Nominal, bind: "@.nominal", fmt: "%{fmt}" }
      - { label: Currency, bind: "@.currency" }
      - { label: Haircut, bind: "@.haircut", fmt: pct2 }
      - { label: Value, bind: "@.value", fmt: "%{fmt}" }
    emits: [ { name: open, on: row-click, payload: { asset: "@.asset" } } ]
  - id: totals
    kind: table
    title: Totals by direction
    rows: "map(group(arg.rows, 'direction', 'value'), {label: @.label, value: @.value, count: @.count})"
    search: false
    columns:
      - { label: Direction, bind: "@.label" }
      - { label: Value, bind: "@.value", fmt: "%{fmt}" }
      - { label: Items, bind: "@.count", fmt: amount0 }
