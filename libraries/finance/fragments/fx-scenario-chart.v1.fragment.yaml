rachana: 1.2
fragment: fx-scenario-chart
version: 1
doc:
  summary: The path of an exchange rate over scenario dates, with the shock per scenario, as a line and a table.
  description: >-
    One row per scenario date with the rate and, optionally, the shock applied. Name the currency pair for the title.
    Use it beside a value-at-risk screen to show which market moves a scenario set contains.
  category: market-data
  tags: [fx, scenarios, shocks]
  use-when:
    - The path of an exchange rate across scenario dates is shown with the shock per scenario.
  avoid-when:
    - "The scenarios' P&L is wanted: use finance/var-path."
  data:
    table: rows
    in-words: "One row per scenario date: the rate and optionally the shock."
    sample-row: { date: "2026-11-20", rate: 0.0425, shock: -0.035 }
  example: { use: finance/fx-scenario-chart@1, with: { pair: EURUSD, rows: { from: "$.scen", columns: { date: SCEN_DATE, rate: FX_RATE } } } }
  see-also: [finance/var-path, finance/what-if-shocks]
  keywords: [fx, scenario, shock, exchange rate, var]
params:
  rows:
    type: table
    required: true
    doc: One row per scenario date
    columns:
      date:  { type: date,   doc: The scenario date }
      rate:  { type: number, doc: The exchange rate }
      shock: { type: number, optional: true, doc: "The shock applied on that date, as a fraction" }
  pair:      { type: text, required: true, doc: "The currency pair, such as EURUSD" }
  fmt:       { type: format, default: price4, doc: How rates are written }
  shock-fmt: { type: format, default: pct2, doc: How shocks are written }
emits:
  - { name: point, payload: { date: date }, doc: A point of the path was chosen }
panels:
  - id: path
    kind: line
    title: "${arg.pair} scenario path"
    rows: arg.rows
    x: date
    y: rate
    fmt: "%{fmt}"
    emits: [ { name: point, on: point-click, payload: { date: "@.date" } } ]
  - id: shocks
    kind: table
    title: Scenarios
    rows: arg.rows
    limit: 50
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Rate, bind: "@.rate", fmt: "%{fmt}" }
      - { label: Shock, bind: "@.shock", fmt: "%{shock-fmt}", tone: sign }
