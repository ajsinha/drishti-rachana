# Harvested by reading Drishti's tests (plan H2); verified by the reference runner (plan H1) unless a case says verified: false.
suite: problem/coverage-valid
since: "1.0"
profile: [core, drishti]
verified: true
description: "Small valid Sutras exercising panel kinds, options and keys the other suites leave out (plan R0 H5 coverage); each is one point."
cases:

  - id: "sutra-description-and-notes"
    kind: "problem"
    source: "coverage-gaps (plan R0 H5)"
    sutra: "rachana: 1\nsutra: cov\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.id }\ndescription: A screen for coverage.\nnotes: Notes for the author.\npanels:\n  - { id: a, kind: markdown, text: hi }\n"
    expect: {"ok": true, "problems": []}

  - id: "sutra-refresh-seconds"
    kind: "problem"
    source: "coverage-gaps (plan R0 H5)"
    sutra: "rachana: 1\nsutra: cov\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.id }\nrefresh: 30\npanels:\n  - { id: a, kind: markdown, text: hi }\n"
    expect: {"ok": true, "problems": []}

  - id: "sutra-doc-complete"
    kind: "problem"
    source: "coverage-gaps (plan R0 H5)"
    sutra: "rachana: 1\nsutra: cov\nversion: 1\nmatch: { kind: trade }\ntitle: { id: $.id }\ndoc:\n  summary: One line.\n  description: What it shows.\n  params: {}\n  emits: []\n  expects: []\n  since: \"1.0\"\npanels:\n  - { id: a, kind: markdown, text: hi }\n"
    expect: {"ok": true, "problems": []}

