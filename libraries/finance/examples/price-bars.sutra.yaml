    rows:
      - { DAY: "2026-01-12", OPEN_PX: 99.0, HIGH_PX: 100.5, LOW_PX: 98.2, CLOSE_PX: 100.1 }
      - { DAY: "2026-01-13", OPEN_PX: 100.1, HIGH_PX: 101.0, LOW_PX: 99.4, CLOSE_PX: 99.9 }
      - { DAY: "2026-01-14", OPEN_PX: 99.9, HIGH_PX: 102.2, LOW_PX: 99.7, CLOSE_PX: 101.8 }
panels:
  - use: finance/price-bars@1
    with:
      rows: { from: $.px, columns: { date: DAY, open: OPEN_PX, high: HIGH_PX, low: LOW_PX, close: CLOSE_PX } }
