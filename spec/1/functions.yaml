#
# functions.yaml - the function catalogue of `rachana: 1`.
#
# STATUS: draft, completed with the coverage gate in R0 step H5. Drafted by reading Drishti's signatures.yaml and the
# implementations of its `rachana.el` package (the reference); nothing here was run. Examples are conformance cases once
# H5 verifies them against the reference. Where this file and SPEC.md disagree, SPEC.md wins until H5 settles it.
#
# SCHEMA (formal: functions.schema.json in this folder)
#
#   functions_version  integer   the shape of this file (1)
#   language           text      the language version the catalogue describes ("1.0")
#   status             text      "draft" until H5 closes
#   core               list      every Core function (SPEC 5): 207 entries, grouped by family
#   deprecated         list      spellings read for old Sutras, never offered (SPEC 5.10)
#   drishti_profile    list      functions of the Drishti profile (SPEC 5.11): need a model or a platform
#   engine_list_functions list   functions Drishti's pivot engine supplies today; each is `classify: pending (H5)`
#
# A Core entry:
#   name         text      the one name
#   family       text      logic | math | text | dates | lists | aggregates | statistics | finance
#   signature    text      human form; `?` after a name = optional, `...` before = repeatable
#   eval         text      eager (arguments evaluated; masked in -> masked out) | form (arguments unevaluated: lazy,
#                          or evaluated per element with `@`) | syntax (built by the parser)
#   params       list      in call order: {name, type, optional, default, variadic, enum}
#                          types: number integer text boolean date timestamp list any expression link
#                          `enum` = the closed set a literal argument is checked against at compile time (SPEC 4.10 rule 2)
#                          every parameter may also be given by name (SPEC 4.10 rule 3); none is keyword-only in Core
#   returns      text      the result type; "same" = the type of the arguments; "decimal" = exact decimal where the
#                          reference computes in decimal (SPEC 4.10 rule 7)
#   nulls        mapping   empty: what an empty argument gives; masked: what a masked argument gives (SPEC 4.9, 5.1)
#   errors       list      {code, when}: the problem raised. Every Core function also gives RCH-2101 at compile time for
#                          an argument count out of range; RCH-2101 appears here only for a literal-argument check
#   tolerance    number    present for real-number results (binary floating point): the relative tolerance a case allows
#   description  text      the behaviour in a few sentences
#   deprecated_spellings   list  {name, note}: old spellings of this function (also listed under `deprecated`)
#   examples     list      1-3 of {expr, result | error, says}. `result` is typed: number, text, true/false, null (empty),
#                          or a list. `error` is the RCH- code expected. When `result` is "see says" the answer depends
#                          on data not in the case and `says` states it (the case then needs a fixture, H5).
#                          `needs_fixture: true` marks an example that reads `$` (a record): H5 supplies the record.
#   since        text      the minor version that added it ("1.0")
#
# A profile entry carries the profile's own fields (runs: R scalar | E engine; scopes; edge_cases), as Drishti's
# signatures.yaml has them; its codes are the profile's (DRS-), not Core's. `classify: profile`.
#
# Rules every Core entry inherits (SPEC 5.1): empty in, empty out unless `nulls` says otherwise; tests answer true or
# false, never empty; masked in, masked out (SPEC 4.9); wrong type -> RCH-2102 naming the function and the value.

functions_version: 1
language: "1.0"
status: draft
roles_since: "1.2"

core:
# ---- logic (21)
- name: if
  family: logic
  signature: "if(cond, then, else?)"
  eval: syntax
  params:
  - {name: "cond", type: "any"}
  - {name: "then", type: "any"}
  - {name: "else", type: "any", optional: true, default: "empty"}
  returns: "any"
  nulls: {empty: "a condition that is empty or false takes the else branch; no else gives empty", masked: "the condition decides; a masked condition gives masked"}
  errors: []
  description: "Built by the parser as the conditional `c ? a : b`; only the branch taken is evaluated."
  examples:
  - {expr: "if($.qty > 0, 'long', 'short')", result: "see says", says: "long when $.qty is 5"}
  - {expr: "if(false, 1)", result: null}
  since: "1.0"
- name: ifs
  family: logic
  signature: "ifs(...pairs)"
  eval: syntax
  params:
  - {name: "pairs", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "an empty condition is not truthy; no match and no else gives empty", masked: "masked"}
  errors: []
  description: "Condition and answer in turn; an odd argument count makes the last argument the else. Arity 2 to 64. Built by the parser; lazy."
  examples:
  - {expr: "ifs(false, 'a', true, 'b', 'c')", result: "b"}
  - {expr: "ifs(false, 'a', false, 'b', 'c')", result: "c"}
  since: "1.0"
- name: switch
  family: logic
  signature: "switch(x, ...cases)"
  eval: form
  params:
  - {name: "x", type: "any"}
  - {name: "cases", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "an empty x equals an empty case value (== rules); no match and no else gives empty", masked: "a masked x, or a masked case reached before the match, gives masked"}
  errors: []
  description: "Value and answer in turn, `x` compared as `==` (numbers numerically, otherwise as text); an even argument count makes the last argument the else. Arity 3 to 64. Lazy: only the answer chosen is evaluated."
  examples:
  - {expr: "switch('FLOAT', 'FIXED', 'F', 'FLOAT', 'V', '?')", result: "V"}
  - {expr: "switch('X', 'FIXED', 'F')", result: null}
  since: "1.0"
- name: iferror
  family: logic
  signature: "iferror(x, fallback)"
  eval: form
  params:
  - {name: "x", type: "any"}
  - {name: "fallback", type: "any"}
  returns: "any"
  nulls: {empty: "an empty x (or NaN, or a failed evaluation) gives the fallback", masked: "a masked x stays masked"}
  errors: []
  description: "`x`, or `fallback` when `x` raises RCH-2102, is empty or is NaN; `fallback` is evaluated only when needed. A division by zero is empty, so it is caught too."
  examples:
  - {expr: "iferror($.a / $.b, 0)", result: "see says", says: "0 when $.b is 0 or empty"}
  - {expr: "iferror(date('soon'), 'n/a')", result: "n/a"}
  since: "1.0"
- name: is_error
  family: logic
  signature: "is_error(x)"
  eval: form
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x is not an error: false", masked: "a masked x gives masked"}
  errors: []
  description: "True when `x` raises RCH-2102 (wrong type, bad date, argument out of domain, refused pattern). A division by zero is empty, not an error; use `is_blank` for it."
  examples:
  - {expr: "is_error(date('soon'))", result: true}
  - {expr: "is_error(1)", result: false}
  since: "1.0"
- name: let
  family: logic
  signature: "let(...bindings)"
  eval: syntax
  params:
  - {name: "bindings", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "a bound empty value stays empty; the result is the last expression's", masked: "masked"}
  errors: []
  description: "Names bound in turn (each may use the earlier ones), then the result expression. Arity 2 to 64; at most 63 names (RCH-2101)."
  examples:
  - {expr: "let(n = 4, n * 2)", result: 8}
  - {expr: "let(a = 2, b = a + 1, a * b)", result: 6}
  since: "1.0"
- name: choose
  family: logic
  signature: "choose(i, ...values)"
  eval: form
  params:
  - {name: "i", type: "integer"}
  - {name: "values", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "an empty i gives empty", masked: "a masked i gives masked"}
  errors:
  - {code: "RCH-2102", when: "i outside 1..number of values, or not a whole number"}
  description: "The i-th value, 1-based; only that one is evaluated. A fraction in i is cut."
  examples:
  - {expr: "choose(2, 'a', 'b')", result: "b"}
  - {expr: "choose(quarter('2026-11-17'), 'Q1', 'Q2', 'Q3', 'Q4')", result: "Q4"}
  since: "1.0"
- name: coalesce
  family: logic
  signature: "coalesce(...values)"
  eval: eager
  params:
  - {name: "values", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "empty arguments are skipped; the empty string counts as a value; all empty gives empty", masked: "passes a masked argument as a value (the host decides)"}
  errors: []
  description: "The first argument that is not empty. Arity 1 to 8."
  examples:
  - {expr: "coalesce($.book, 'UNBOOKED')", result: "see says", says: "UNBOOKED when $.book is empty"}
  - {expr: "coalesce('', 'x')", result: ""}
  since: "1.0"
- name: nonblank
  family: logic
  signature: "nonblank(...values)"
  eval: eager
  params:
  - {name: "values", type: "any", variadic: true}
  returns: "any"
  nulls: {empty: "empty and blank-text arguments are skipped; all skipped gives empty", masked: "passes a masked argument as a value"}
  errors: []
  description: "The first argument that is neither empty nor blank text. Arity 1 to 8."
  examples:
  - {expr: "nonblank('  ', 'n/a')", result: "n/a"}
  - {expr: "nonblank($.pkg, 'n/a')", result: "see says", says: "n/a when $.pkg is empty"}
  since: "1.0"
- name: within
  family: logic
  signature: "within(v, range)"
  eval: eager
  params:
  - {name: "v", type: "any"}
  - {name: "range", type: "text"}
  returns: "boolean"
  nulls: {empty: "an empty v is false (outside any range) unless the range is empty, which holds all", masked: "masked"}
  errors: []
  description: "`range` is `from..to`; either end may be empty; an empty range holds everything. Numbers compare as numbers when value and ends are numbers, otherwise as text (ISO dates order); a timestamp is compared by its date."
  examples:
  - {expr: "within(5, '1..10')", result: true}
  - {expr: "within('2026-11-17', '2026-01-01..')", result: true}
  - {expr: "within(5, '')", result: true}
  since: "1.0"
- name: one_of
  family: logic
  signature: "one_of(v, choices)"
  eval: eager
  params:
  - {name: "v", type: "any"}
  - {name: "choices", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty choice (empty list, empty text, empty) holds everything", masked: "masked"}
  errors: []
  description: "Equality as `==`. A single non-list value is a list of one. The empty choice holds everything: a multi-select control with nothing chosen filters nothing."
  deprecated_spellings:
  - {name: "oneOf", note: "same results"}
  examples:
  - {expr: "one_of('A', ['A', 'B'])", result: true}
  - {expr: "one_of('C', ['A', 'B'])", result: false}
  - {expr: "one_of('C', [])", result: true}
  since: "1.0"
- name: has
  family: logic
  signature: "has(list, v)"
  eval: eager
  params:
  - {name: "list", type: "any"}
  - {name: "v", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty list holds nothing: false; a list attribute may be a JSON-text list", masked: "a masked list gives masked"}
  errors: []
  description: "The list attribute holds the value (equality as `==`). A single value counts as a list of one."
  examples:
  - {expr: "has(['fx', 'rates'], 'fx')", result: true}
  - {expr: "has([], 'fx')", result: false}
  since: "1.0"
- name: any_of
  family: logic
  signature: "any_of(list, values)"
  eval: eager
  params:
  - {name: "list", type: "any"}
  - {name: "values", type: "any"}
  returns: "boolean"
  nulls: {empty: "no value chosen (empty `values`) holds everything: true", masked: "masked"}
  errors: []
  description: "The list holds at least one of the values."
  examples:
  - {expr: "any_of(['fx', 'rates'], ['rates', 'eq'])", result: true}
  - {expr: "any_of(['fx'], [])", result: true}
  since: "1.0"
- name: all_of
  family: logic
  signature: "all_of(list, values)"
  eval: eager
  params:
  - {name: "list", type: "any"}
  - {name: "values", type: "any"}
  returns: "boolean"
  nulls: {empty: "no value chosen (empty `values`) holds everything: true", masked: "masked"}
  errors: []
  description: "The list holds every one of the values."
  examples:
  - {expr: "all_of(['fx', 'rates'], ['fx', 'rates'])", result: true}
  - {expr: "all_of(['fx'], ['fx', 'rates'])", result: false}
  since: "1.0"
- name: link
  family: logic
  signature: "link(id, kind?, label?)"
  eval: eager
  params:
  - {name: "id", type: "text"}
  - {name: "kind", type: "text", optional: true, default: "empty"}
  - {name: "label", type: "text", optional: true, default: "empty"}
  returns: "link"
  nulls: {empty: "an empty id gives empty; an empty kind or label is left out", masked: "masked"}
  errors: []
  description: "A link value; its text form is the label (or the id when there is none)."
  examples:
  - {expr: "link($.cpty, 'counterparty')", result: "see says", says: "a link to $.cpty of kind counterparty"}
  - {expr: "link('', 'x')", result: null}
  since: "1.0"
- name: type_of
  family: logic
  signature: "type_of(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "text"
  nulls: {empty: "an empty x gives 'empty'; the answer is always text", masked: "a masked x gives masked"}
  errors: []
  description: "One of 'empty', 'number', 'text', 'boolean', 'link', 'list', 'object'. An ISO date is 'text' (dates are text in Rachana). Never raises. The answers are an open set (SPEC 4.15 rule 3): a later minor may add words, and a caller MUST accept a word it does not know; in 1.0 an integer or a decimal is 'number'."
  examples:
  - {expr: "type_of([1])", result: "list"}
  - {expr: "type_of('a')", result: "text"}
  - {expr: "type_of($.missing)", result: "empty", needs_fixture: true}
  since: "1.0"
- name: is_number
  family: logic
  signature: "is_number(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x answers false", masked: "a masked x gives masked"}
  errors: []
  description: "Type test: true for a number as the data holds it, not for number-like text (Excel's ISNUMBER; arithmetic still reads '12.5' as a number); NaN is not a number. Answers true or false, never empty; never raises."
  examples:
  - {expr: "is_number(1.5)", result: true}
  - {expr: "is_number('1.5')", result: false}
  since: "1.0"
- name: is_text
  family: logic
  signature: "is_text(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x answers false", masked: "a masked x gives masked"}
  errors: []
  description: "Type test: true for any text, an ISO date's included. Answers true or false, never empty; never raises."
  examples:
  - {expr: "is_text('a')", result: true}
  - {expr: "is_text(1)", result: false}
  since: "1.0"
- name: is_date
  family: logic
  signature: "is_date(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x answers false", masked: "a masked x gives masked"}
  errors: []
  description: "Type test: true for text that is an ISO date or timestamp. Answers true or false, never empty; never raises."
  examples:
  - {expr: "is_date('2026-11-17')", result: true}
  - {expr: "is_date('soon')", result: false}
  since: "1.0"
- name: is_boolean
  family: logic
  signature: "is_boolean(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x answers false", masked: "a masked x gives masked"}
  errors: []
  description: "Type test: true for true or false. Answers true or false, never empty; never raises."
  examples:
  - {expr: "is_boolean(true)", result: true}
  - {expr: "is_boolean(1)", result: false}
  since: "1.0"
- name: is_blank
  family: logic
  signature: "is_blank(x)"
  eval: eager
  params:
  - {name: "x", type: "any"}
  returns: "boolean"
  nulls: {empty: "an empty x answers true (the one test that does)", masked: "a masked x gives masked"}
  errors: []
  description: "Type test: true for empty, NaN or blank text. Answers true or false, never empty; never raises."
  examples:
  - {expr: "is_blank('  ')", result: true}
  - {expr: "is_blank(0)", result: false}
  since: "1.0"
# ---- math (43)
- name: abs
  family: math
  signature: "abs(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "same as x"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  description: "Absolute value."
  examples:
  - {expr: "abs(-3.5)", result: 3.5}
  - {expr: "abs(7)", result: 7}
  since: "1.0"
- name: sign
  family: math
  signature: "sign(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "integer"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  description: "-1, 0 or 1."
  examples:
  - {expr: "sign(-12)", result: -1}
  - {expr: "sign(0)", result: 0}
  since: "1.0"
- name: sqrt
  family: math
  signature: "sqrt(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "x is negative"}
  description: "Square root in decimal (16 significant digits; exact for exact squares)."
  examples:
  - {expr: "sqrt(0.0144)", result: 0.12}
  - {expr: "sqrt(16)", result: 4}
  since: "1.0"
- name: exp
  family: math
  signature: "exp(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  tolerance: 1.0e-12
  description: "e to the power x. Real-number function (binary floating point)."
  examples:
  - {expr: "exp(0)", result: 1}
  - {expr: "exp(1)", result: 2.718281828459045}
  since: "1.0"
- name: ln
  family: math
  signature: "ln(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "x is not above zero"}
  tolerance: 1.0e-12
  description: "Natural logarithm. Real-number function."
  examples:
  - {expr: "ln(1)", result: 0}
  - {expr: "ln(2.718281828459045)", result: 1}
  since: "1.0"
- name: log10
  family: math
  signature: "log10(x)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "x is not above zero"}
  tolerance: 1.0e-12
  description: "Base-10 logarithm. Real-number function."
  examples:
  - {expr: "log10(1000)", result: 3}
  - {expr: "log10(0.01)", result: -2}
  since: "1.0"
- name: log
  family: math
  signature: "log(x, base?)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  - {name: "base", type: "number", optional: true, default: 10}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "x is not above zero, or base is not above zero or is 1"}
  tolerance: 1.0e-12
  description: "Logarithm in a base (10 by default), Excel's LOG. Real-number function."
  examples:
  - {expr: "log(8, 2)", result: 3}
  - {expr: "log(100)", result: 2}
  since: "1.0"
- name: round
  family: math
  signature: "round(x, n?)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  - {name: "n", type: "integer", optional: true, default: 0}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "|n| is beyond 100"}
  description: "Half away from zero to n places (negative n: tens, hundreds), in decimal, Excel's ROUND."
  examples:
  - {expr: "round(2.675, 2)", result: 2.68}
  - {expr: "round(-2.5)", result: -3}
  - {expr: "round(1234, -2)", result: 1200}
  since: "1.0"
- name: round_up
  family: math
  signature: "round_up(x, n?)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  - {name: "n", type: "integer", optional: true, default: 0}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "|n| is beyond 100"}
  description: "Away from zero to n places, in decimal."
  examples:
  - {expr: "round_up(2.671, 2)", result: 2.68}
  - {expr: "round_up(0.1 + 0.2, 1)", result: 0.3}
  since: "1.0"
- name: round_down
  family: math
  signature: "round_down(x, n?)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  - {name: "n", type: "integer", optional: true, default: 0}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "|n| is beyond 100"}
  description: "Towards zero to n places, in decimal."
  examples:
  - {expr: "round_down(-2.679, 2)", result: -2.67}
  - {expr: "round_down(1999, -3)", result: 1000}
  since: "1.0"
- name: round_sig
  family: math
  signature: "round_sig(x, digits)"
  eval: eager
  params:
  - {name: "x", type: "number"}
  - {name: "digits", type: "integer"}
  returns: "decimal"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not a number (number-like text counts)"}
  - {code: "RCH-2102", when: "digits is not from 1 to 100"}
  description: "Half away from zero to a number of significant digits."
  examples:
  - {expr: "round_sig(123456, 2)", result: 120000}
  - {expr: "round_sig(0.012345, 3)", result: 0.0123}
