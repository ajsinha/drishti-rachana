  eval: eager
  params:
  - {name: "a", type: "date"}
  - {name: "b", type: "date"}
  - {name: "unit", type: "text", enum: ["Y", "M", "D", "MD", "YM", "YD"]}
  returns: "integer"
  nulls: {empty: "empty in, empty out", masked: "masked"}
  errors:
  - {code: "RCH-2102", when: "an argument that is not an ISO date (yyyy-mm-dd; a timestamp counts by its date)"}
  - {code: "RCH-2102", when: "the end is before the start"}
  - {code: "RCH-2101", when: "a literal unit outside the set - at compile time"}
  description: "Complete units from start to end, Excel's DATEDIF: 'Y' years, 'M' months, 'D' days, 'MD' days ignoring months and years, 'YM' months ignoring years, 'YD' days ignoring years."
  examples:
  - {expr: "datedif('2020-02-29', '2026-11-17', 'Y')", result: 6}
  - {expr: "datedif('2026-01-15', '2026-11-17', 'M')", result: 10}
