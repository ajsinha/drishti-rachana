rachana: 1.2
fragment: audit-trail
version: 1
doc:
  summary: "Who changed what and when: actor, time, field, the value before and after."
  description: One row per change, newest first as given.
  category: history
  tags: [audit, changes, history]
  use-when:
    - "A reader must see who changed a record, when and from what to what."
  avoid-when:
    - "The events are business milestones, not edits: use core/event-timeline."
    - "Two whole versions are compared: use core/version-diff."
  data:
    table: rows
    in-words: "One row per change: when, who, what action, and optionally the field with its value before and after."
    sample-row: { at: "2026-11-20T09:30:00Z", actor: a.smith, action: Update, field: limit, before: A, after: A }
  example: { use: core/audit-trail@1, with: { rows: { from: "$.audit", columns: { at: CHANGED_AT, actor: CHANGED_BY, action: CHANGE, field: COLUMN_NAME, before: OLD_VALUE, after: NEW_VALUE } } } }
  see-also: [core/event-timeline, core/version-diff]
  keywords: [audit, history, changes, who, provenance]
params:
  rows:
    type: table
    required: true
    doc: One row per change
    columns:
      at:     { type: datetime, doc: When the change was made }
      actor:  { type: text, doc: Who made it }
      action: { type: text, doc: What was done }
      field:  { type: text, optional: true, doc: The field that changed }
      before: { optional: true, doc: The value before }
      after:  { optional: true, doc: The value after }
  title: { type: text, default: Changes, doc: The panel's title }
  limit: { type: integer, default: 100, min: 1, max: 5000, doc: The most changes shown }
panels:
  - id: audit
    kind: table
    title: arg.title
    rows: arg.rows
    limit: arg.limit
    search: true
    columns:
      - { label: When, bind: "@.at" }
      - { label: Who, bind: "@.actor" }
      - { label: Action, bind: "@.action" }
      - { label: Field, bind: "@.field" }
      - { label: Before, bind: "@.before" }
      - { label: After, bind: "@.after" }
